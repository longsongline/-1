<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e141a">
<meta name="color-scheme" content="light">
<title>古代世家 · 高门主母掌家录 (完整典藏版)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  color:#1c100e;background:#f6eee3;line-height:1.55;font-size:13px;
  height:100%;overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

#fxCanvas{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#fxCanvas span{position:absolute;top:-30px;animation:petalFall linear infinite;opacity:.65;}
@keyframes petalFall{to{transform:translateY(110vh) rotate(360deg);}}

.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;
  padding:8px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:8px;overflow:hidden;}

/* 顶栏高门品牌 */
.topbar{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 8px rgba(70,25,35,.06);}
.brand-box{display:flex;align-items:center;gap:10px;}
.mansion-logo{width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg,#7e1f34,#4e1220);border:1.5px solid #d4af37;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(126,31,52,.35),inset 0 1px 2px rgba(255,255,255,.35);
  flex-shrink:0;}
.brand-box h1{font-size:16px;font-weight:700;letter-spacing:1px;color:#6b1527;display:flex;align-items:baseline;gap:6px;}
.brand-box h1 small{font-size:11.5px;color:#854955;font-weight:600;letter-spacing:0;}
.brand-sub{font-size:11px;color:#5a372c;font-weight:500;letter-spacing:0.3px;}

/* 顶栏属性标签 (微矢量徽章 · 高对比度加粗) */
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chip{background:#fffdfa;border:1px solid #cfb49e;border-radius:18px;
  padding:3.5px 9px;font-size:12px;color:#2c1713;font-weight:500;
  display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 1px 2px rgba(60,20,30,.04);}
.chip b{color:#7e1f34;font-weight:700;}
.chip-svg{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;}
.chip.clickable{cursor:pointer;user-select:none;transition:all .15s;}
.chip.clickable:hover{background:#f3e3d3;border-color:#a53b51;transform:translateY(-1px);}
.chip.highlight{background:#7e1f34;color:#fff;border-color:#5c1222;box-shadow:0 2px 6px rgba(126,31,52,.25);}
.chip.highlight b{color:#ffe482;}
.chip.highlight .chip-svg svg{stroke:#fff;}
.chip .d-text{display:inline;}
.chip .m-text{display:none;}

/* 移动端视图切换条 */
.mobile-switch-bar{display:none;background:#fffdfa;border:1px solid #d4bda8;border-radius:10px;
  padding:3px;gap:5px;flex-shrink:0;box-shadow:0 2px 6px rgba(70,25,35,.04);}
.m-switch-btn{flex:1;background:#f3e8dc;border:1px solid transparent;border-radius:8px;
  padding:7px 6px;font-size:12.5px;font-weight:600;color:#542f25;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;}
.m-switch-btn.on{background:#7e1f34;color:#fff;border-color:#5c1222;
  box-shadow:0 2px 6px rgba(126,31,52,.3);}
.m-switch-btn .m-badge{font-size:10px;background:#c53030;color:#fff;border-radius:10px;padding:1px 6px;margin-left:2px;}

/* 主体栅格 */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 345px;gap:8px;}

/* 左侧主内容 */
.left-col{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;
  box-shadow:0 2px 8px rgba(70,25,35,.04);}

/* 导航选项卡 */
.nav-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.nav-tabs::-webkit-scrollbar{height:0;}
.nav-btn{background:#f5e8db;border:1px solid #d1b7a0;border-radius:8px;
  padding:6.5px 12px;font-size:12px;font-family:inherit;font-weight:600;color:#4f2b21;
  cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;}
.nav-btn:hover{background:#eedbca;border-color:#b95e72;}
.nav-btn.on{background:#7e1f34;border-color:#5f1323;color:#ffffff;font-weight:700;
  box-shadow:0 2px 8px rgba(126,31,52,.3);}
.nav-btn .nav-svg{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;}
.nav-btn.on .nav-svg svg{stroke:#fff;}

/* 场景文案 */
.scene-desc{background:#f9f0e4;border-left:4px solid #7e1f34;border-radius:6px;
  padding:8px 12px;font-size:12.5px;font-weight:500;color:#3f221a;line-height:1.6;flex-shrink:0;
  border-top:1px solid #ebd5c2;border-right:1px solid #ebd5c2;border-bottom:1px solid #ebd5c2;}
.page-content{flex:1;min-height:0;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch;}
.page-content::-webkit-scrollbar{width:5px;}
.page-content::-webkit-scrollbar-thumb{background:#cbb099;border-radius:3px;}

/* 动作网格 */
.acts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;align-content:start;}
.act-card{background:#fffefc;border:1px solid #d8bfab;border-radius:10px;
  padding:10px 11px;display:flex;gap:10px;cursor:pointer;transition:all .16s;
  text-align:left;position:relative;user-select:none;align-items:flex-start;min-width:0;
  box-shadow:0 1px 3px rgba(70,25,35,.03);}
.act-card:hover{background:#fdf5ec;border-color:#a53b51;transform:translateY(-1.5px);
  box-shadow:0 4px 12px rgba(126,31,52,.12);}
.act-card.off{opacity:.45;filter:grayscale(.75);pointer-events:none;}

/* 矢量徽章图标容器 */
.act-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#fffdfa,#f3e5d7);
  border:1px solid #d4bda8;box-shadow:0 1px 3px rgba(80,30,40,.06),inset 0 1px 1px #fff;
  flex-shrink:0;transition:all .18s;}
.act-card:hover .act-ic{transform:scale(1.05);border-color:#a53b51;}
.act-ic svg{display:block;}

.act-bd{flex:1;min-width:0;}
.act-t1{font-size:13px;font-weight:700;color:#1f100d;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.act-t2{font-size:11.5px;font-weight:500;color:#4a2f26;margin-top:4px;line-height:1.5;word-break:break-word;}
.act-cost{font-size:10.5px;color:#7e1f34;font-weight:700;background:#fde9ed;padding:1.5px 7px;border-radius:10px;border:1px solid #eec0c9;flex-shrink:0;}

/* 卡片列表通用 */
.card-item{background:#fffefc;border:1px solid #d8bfab;border-radius:9px;padding:10px 12px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;}
.item-ic{width:36px;height:36px;border-radius:8px;background:#f4e6d8;border:1px solid #d6bfa8;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.card-content{flex:1;min-width:0;}
.card-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:#2e151b;}
.card-body{font-size:12px;color:#4a2b22;margin-top:4px;line-height:1.55;}
.card-acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}

/* 右侧侧边栏 */
.right-col{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;}
.house-panel{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;padding:12px;
  display:flex;flex-direction:column;gap:8px;flex-shrink:0;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.panel-hd{display:flex;align-items:center;justify-content:space-between;}
.panel-hd h2{font-size:13.5px;font-weight:700;color:#6b1527;display:flex;align-items:center;gap:6px;}
.badge-rank{background:#f9eef1;color:#7e1f34;border:1px solid #e4b8c3;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;}

.rel-box{background:#fdf9f4;border:1px solid #e5d4c2;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;}
.rel-avatar{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#7e1f34,#501321);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
.rel-info{flex:1;min-width:0;}
.rel-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#2c1511;}
.rel-bar-bg{height:5px;background:#eaddce;border-radius:3px;margin-top:5px;overflow:hidden;}
.rel-bar-fill{height:100%;background:linear-gradient(90deg,#97266d,#7e1f34);border-radius:3px;transition:width .3s;}

.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mini-stat-card{background:#fbf5ed;border:1px solid #e5d5c5;border-radius:6px;padding:6px 8px;text-align:center;}
.mini-stat-num{font-size:15px;font-weight:700;color:#7e1f34;}
.mini-stat-label{font-size:11px;color:#543228;font-weight:500;}

.status-tags{display:flex;flex-wrap:wrap;gap:4px;}
.tag-badge{font-size:11px;font-weight:600;padding:2.5px 7px;border-radius:6px;border:1px solid;}
.tag-badge.pink{background:#fdf2f4;color:#9b2c45;border-color:#f1c2cc;}
.tag-badge.green{background:#f0fdf4;color:#166534;border-color:#bbf7d0;}
.tag-badge.gold{background:#fefce8;color:#854d0e;border-color:#fde047;}
.tag-badge.blue{background:#eff6ff;color:#1e40af;border-color:#bfdbfe;}

/* 日志框 */
.log-box{flex:1;min-height:0;background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.log-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:#6b1527;border-bottom:1px solid #eddcd0;padding-bottom:5px;flex-shrink:0;}
.log-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px;-webkit-overflow-scrolling:touch;}
.log-list::-webkit-scrollbar{width:4px;}
.log-list::-webkit-scrollbar-thumb{background:#cbb099;border-radius:2px;}
.log-row{font-size:11.5px;line-height:1.55;color:#3f221a;background:#faf3ea;padding:5px 8px;border-radius:6px;border-left:2.5px solid #a33b51;}
.log-row.pink{border-left-color:#d53f8c;background:#fff5f7;}
.log-row.gold{border-left-color:#d97706;background:#fffbeb;}
.log-row.gd{border-left-color:#2f855a;background:#f0fdf4;}
.log-row.gd2{border-left-color:#3182ce;background:#eff6ff;}
.log-tag{font-weight:700;color:#6b1527;margin-right:4px;}

/* 底栏操作区 */
.bottom-bar{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.main-btn{background:linear-gradient(135deg,#7e1f34,#601323);color:#fff;border:1px solid #4a0d1a;
  border-radius:8px;padding:6px 14px;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;
  box-shadow:0 2px 6px rgba(126,31,52,.25);}
.main-btn:hover{background:linear-gradient(135deg,#91253c,#74182b);transform:translateY(-1px);}
.main-btn.secondary{background:#f3e6d8;color:#4a261c;border:1px solid #c9b09b;box-shadow:none;}
.main-btn.secondary:hover{background:#ecd7c4;border-color:#99384e;}
.main-btn.gold{background:linear-gradient(135deg,#b45309,#78350f);color:#fff;border-color:#451a03;}

/* 模态框通用 */
.modal-mask{position:fixed;inset:0;background:rgba(20,8,12,.65);backdrop-filter:blur(3px);
  z-index:99;display:none;align-items:center;justify-content:center;padding:12px;}
.modal-mask.show{display:flex;}
.modal-box{background:#fffdfa;border:1.5px solid #c4a993;border-radius:14px;width:100%;max-width:580px;
  max-height:86vh;overflow-y:auto;display:flex;flex-direction:column;box-shadow:0 12px 35px rgba(0,0,0,.35);
  animation:popIn .2s ease-out;}
@keyframes popIn{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{background:linear-gradient(135deg,#7e1f34,#501321);color:#fff;padding:10px 14px;
  border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;
  font-weight:700;font-size:14px;letter-spacing:.5px;}
.modal-close{cursor:pointer;padding:2px 6px;border-radius:4px;font-size:14px;transition:background .15s;}
.modal-close:hover{background:rgba(255,255,255,.25);}
.modal-body{padding:14px;display:flex;flex-direction:column;gap:10px;}

/* 剧情选择面板 */
.story-panel{background:#faf3ea;border:1px solid #dfcbb8;border-radius:10px;padding:12px;
  display:flex;flex-direction:column;gap:8px;}
.story-title{font-size:13.5px;font-weight:700;color:#6b1527;border-bottom:1px solid #ecd5c2;padding-bottom:5px;}
.story-text{font-size:12.5px;line-height:1.65;color:#3b1e16;}
.story-text p{margin-bottom:6px;}
.story-choices{display:flex;flex-direction:column;gap:7px;margin-top:6px;}
.story-choice{background:#fff;border:1px solid #d4baa2;border-radius:8px;padding:9px 12px;
  text-align:left;font-size:12.5px;font-weight:600;color:#351a14;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:space-between;}
.story-choice:hover{background:#fdf5ec;border-color:#8e233a;transform:translateX(3px);box-shadow:0 2px 6px rgba(126,31,52,.1);}

/* 结局专刊展示卡片 */
.ending-banner{background:linear-gradient(135deg,#4a0f1c,#22050b);border:2px solid #eab308;
  border-radius:12px;padding:16px;color:#fff;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.ending-title{font-size:18px;font-weight:800;color:#fde047;letter-spacing:1px;margin-bottom:6px;}
.ending-sub{font-size:12.5px;color:#fef08a;margin-bottom:12px;}
.ending-scroll{background:rgba(255,255,255,.1);border:1px solid rgba(253,224,71,.3);border-radius:8px;
  padding:12px;font-size:12px;line-height:1.7;text-align:left;color:#fef9c3;max-height:220px;overflow-y:auto;}

/* 提示泡 */
#toastBox{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);
  background:rgba(30,10,16,.92);color:#fff;padding:8px 18px;border-radius:24px;
  font-size:12.5px;font-weight:600;pointer-events:none;z-index:9999;
  box-shadow:0 4px 15px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;
  opacity:0;display:none;}
#toastBox.show{display:block;opacity:1;transform:translateX(-50%) translateY(-5px);}

/* 响应式断点适配 (移动端极致空间优化) */
@media (max-width:860px){
  .wrap{padding:4px;gap:4px;}

  /* 顶栏极致收拢：高度由200px骤减至约65px */
  .topbar{padding:5px 7px;gap:4px;flex-direction:column;align-items:stretch;border-radius:8px;}
  .brand-box{justify-content:flex-start;width:100%;gap:6px;}
  .mansion-logo{width:22px;height:22px;border-radius:5px;}
  .mansion-logo svg{width:13px;height:13px;}
  .brand-box h1{font-size:13px;letter-spacing:0.2px;}
  .brand-box h1 small{display:none;}
  .brand-sub{display:none;}

  /* 状态栏变成精准的4列x2行高密度微徽章矩阵，杜绝臃肿折行 */
  .chips{display:grid !important;grid-template-columns:repeat(4,1fr) !important;gap:2.5px !important;width:100% !important;}
  .chip{padding:3px 2px !important;font-size:10.5px !important;border-radius:5px !important;gap:2.5px !important;justify-content:center !important;box-shadow:none !important;white-space:nowrap !important;}
  .chip .d-text{display:none !important;}
  .chip .m-text{display:inline !important;}
  .chip-svg{width:11px;height:11px;}
  .chip-svg svg{width:11px;height:11px;}

  /* 切换栏紧凑化 */
  .mobile-switch-bar{display:flex;padding:2px;gap:3px;border-radius:6px;}
  .m-switch-btn{padding:5px 6px;font-size:11.5px;border-radius:5px;}

  /* 主体单视口与严密分屏，杜绝右栏泄漏 */
  .main{grid-template-columns:1fr !important;position:relative;}
  .left-col.m-hidden{display:none !important;}
  .right-col.m-hidden{display:none !important;}
  .left-col{padding:7px;border-radius:8px;gap:5px;height:100%;}
  .right-col{padding:7px;border-radius:8px;gap:5px;height:100%;}
  .house-panel{padding:8px;}

  /* 导航选项卡小巧化 */
  .nav-tabs{gap:4px;padding-bottom:2px;}
  .nav-btn{padding:4px 8px;font-size:11px;border-radius:6px;gap:4px;}
  .nav-btn .nav-svg{width:13px;height:13px;}
  .nav-btn .nav-svg svg{width:13px;height:13px;}

  /* 场景文案收拢为精炼单行提示 */
  .scene-desc{padding:4px 7px;font-size:11px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;border-left-width:3px;}

  /* 动作卡片收拢，一屏可看4~5个行动 */
  .acts-grid{grid-template-columns:1fr !important;gap:5px !important;}
  .act-card{padding:6px 8px !important;gap:7px !important;border-radius:8px !important;}
  .act-ic{width:30px !important;height:30px !important;border-radius:6px !important;}
  .act-ic svg{width:17px !important;height:17px !important;}
  .act-t1{font-size:12px !important;}
  .act-t2{font-size:10.5px !important;line-height:1.35 !important;margin-top:2px !important;}
  .act-cost{font-size:9.5px !important;padding:1px 5px !important;}

  .card-item{padding:6px 8px !important;gap:7px !important;margin-bottom:5px !important;}
  .item-ic{width:28px !important;height:28px !important;}
  .item-ic svg{width:15px !important;height:15px !important;}
  .card-head{font-size:12px !important;}
  .card-body{font-size:11px !important;}
  .card-acts{margin-top:4px !important;}

  /* 底栏单行高密度Dock栏，收窄至38px */
  .bottom-bar{padding:4px 6px !important;gap:4px !important;border-radius:8px !important;}
  .bottom-identity{display:none !important;}
  .bottom-btns{width:100% !important;display:flex !important;gap:3px !important;flex-wrap:nowrap !important;}
  .bottom-btns .main-btn{padding:5px 5px !important;font-size:11px !important;flex:1 !important;justify-content:center !important;white-space:nowrap !important;}
  .bottom-btns .main-btn.primary-turn{flex:1.8 !important;font-weight:700 !important;}
  .bottom-btns .main-btn.btn-endings{display:none !important;}
}
</style>
</head>
<body>

<div id="fxCanvas"></div>

<div class="wrap">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand-box">
      <div class="mansion-logo">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10L12 3l9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
      </div>
      <div>
        <h1>定远侯府 <small>· 高门主母掌家录</small></h1>
        <div class="brand-sub">百年世家 · 钟鸣鼎食 · 掌中馈 · 驭群妾 · 助夫登科</div>
      </div>
    </div>

    <!-- 顶栏状态徽章 -->
    <div class="chips" id="topChips">
      <!-- 动态更新 -->
    </div>
  </header>

  <!-- 移动端双屏切换条 -->
  <div class="mobile-switch-bar">
    <button class="m-switch-btn on" id="btnMViewMain" onclick="setMobileView('main')">

/* ================= 2. Web Audio 原生宫廷古筝和弦合成 ================= */
var audioCtx = null;
var bgmPlaying = false;
var bgmTimer = null;
function initAudio(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
}
function playTone(freq, type, duration, delay, gainLevel){
  if(!audioCtx) return;
  setTimeout(function(){
    try{
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainLevel || 0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }, (delay||0)*1000);
}
function playPalaceChords(){
  if(!bgmPlaying) return;
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  var pentatonic = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33];
  var note1 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  var note2 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  var note3 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  playTone(note1, 'triangle', 2.2, 0, 0.08);
  playTone(note2, 'sine', 1.8, 0.4, 0.06);
  playTone(note3, 'sine', 2.5, 0.9, 0.05);
}
function playClickSound(type){
  initAudio();
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  try{
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    if(type === 'guzheng'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    }
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }catch(e){}
}
function toggleMusic(){
  bgmPlaying = !bgmPlaying;
  if(bgmPlaying){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    playPalaceChords();
    if(!bgmTimer) bgmTimer = setInterval(playPalaceChords, 4800);
    toast('雅乐鸣奏 · 宫商角徵羽清音流转');
  } else {
    if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
    toast('雅乐静止');
  }
  render();
}

/* ================= 4. 辅助函数 ================= */
function ri(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function cl(v, min, max){ if(min===undefined) min=0; if(max===undefined) max=100; return Math.max(min, Math.min(max, v)); }
function toast(msg){
  var el = document.getElementById('toastBox');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function addLog(txt, type, tag){
  if(!G) return;
  var sName = SEASONS[Math.floor((G.month-1)/3)%4];
  var timeStr = '第'+G.year+'年·'+sName;
  G.logs.unshift({ text: txt, type: type||'', tag: tag||timeStr });
  if(G.logs.length > 60) G.logs.pop();
  renderLogs();
  if(mobileView !== 'house'){
    var b = document.getElementById('mBadge');
    if(b) b.style.display = 'inline-block';
  }
}
function useEnergy(n){
  if(G.energy < n){ toast('精力不济，请歇息或进入下一旬！'); return false; }
  G.energy -= n; playClickSound('guzheng'); render(); return true;
}

function createActCard(svgIcon, t1, t2, cost, onClickStr){
  var ok = G.energy >= cost;
  return '<div class="act-card '+(ok?'':'off')+'" onclick="'+onClickStr+'">'+
    '<div class="act-ic">'+svgIcon+'</div>'+
    '<div class="act-bd">'+
      '<div class="act-t1"><span>'+t1+'</span><span class="act-cost">耗'+cost+'力</span></div>'+
      '<div class="act-t2">'+t2+'</div>'+
    '</div></div>';
}

    if(G.month > 12){
      G.month = 1;
      G.year++;

      G.reputation = cl(G.reputation + 8);

    var totalIncome = 0;
    for(var i=0; i<G.estates.length; i++){

    G.silver += totalIncome;

  render();
  autoSave();
}

function saveSlot(i){
  try{
    localStorage.setItem('gaomen_save_'+i, JSON.stringify(G));
    toast('第 '+i+' 卷简册存录成功！');
    openSaveModal();
  }catch(e){ toast('存录失败'); }
}
function loadSlot(i){
  try{
    var raw = localStorage.getItem('gaomen_save_'+i);
    if(!raw){ toast('暂无存录记录'); return; }
    G = JSON.parse(raw);
    closeModal();
    toast('调阅成功，时光倒流！');
    render();
  }catch(e){ toast('读取失败'); }
}

function showHelp(){
  openModal('📖 掌家心法与典籍要诀',
    '<div class="story-panel"><div class="story-title">高门主母四大纲纪</div>'+
    '<div class="story-text">'+
    '<p><b>一、中馈公中莫亏空：</b>每月按旬发放份例，庄田与商铺必须常去巡查，收购钱庄可保银钱充裕。</p>'+
    '<p><b>二、内宅驭下恩威并施：</b>林小娘得宠需立规矩，寄居表妹柳纤纤心机不纯宜尽早赐婚远嫁，侍奉婆母保奥援。</p>'+
    '<p><b>三、世家大族后代为本：</b>聘翰林大儒受业，年满考中探花郎跨马游街，娶名门贵女诞育第三代长孙，三代鼎盛。</p>'+
    '<p><b>四、朝堂风暴稳如泰山：</b>皇子夺嫡与御史参劾乃灭门大劫，审时度势，或孤臣自保，或盛装击鼓救夫！</p>'+
    '</div></div>');
}

function restartGame(){
  if(confirm('是否从新妇过门之日重新开启高门掌家录？')){
    localStorage.removeItem('gaomen_save_auto');
    G = getDefaultState();
    render();
    toast('新妇过门，从头执掌定远侯府中馈！');
  }
}

/* ================= 11. 初始化启动 ================= */
window.onload = function(){
  try{
    var raw = localStorage.getItem('gaomen_save_auto');
    if(raw) G = JSON.parse(raw);
    else G = getDefaultState();
  }catch(e){
    G = getDefaultState();
  }
  // 补齐新增字段容错
  if(!G.cousin) G.cousin = { name:'柳纤纤 (青州远房表妹)', status:'借住海棠轩', scheming:65, favor:20, resolved:false };
  if(!G.grandchildren) G.grandchildren = [];
  if(!G.endingsUnlocked) G.endingsUnlocked = {};
  if(!G.flags) G.flags = {};
  render();
  setMobileView('main');
};
</script>
