<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2e141a">
<meta name="color-scheme" content="light">
<title>古代世家 · 高门主母掌家录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{
  /* 现代高清晰度 CJK 系统字族，字迹锐利工整，彻底消除细弱发虚 */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  color:#1c100e;background:#f6eee3;line-height:1.55;font-size:13px;
  height:100%;overflow:hidden;position:relative;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

/* 背景花瓣浮动 */
#fxCanvas{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#fxCanvas span{position:absolute;top:-30px;animation:petalFall linear infinite;opacity:.65;}
@keyframes petalFall{to{transform:translateY(110vh) rotate(360deg);}}

.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;
  padding:8px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:8px;overflow:hidden;}

/* 顶栏高门品牌 */
.topbar{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;
  align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 8px rgba(70,25,35,.06);}
.brand-box{display:flex;align-items:center;gap:10px;}
.mansion-logo{width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg,#7e1f34,#4e1220);border:1.5px solid #d4af37;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(126,31,52,.35),inset 0 1px 2px rgba(255,255,255,.35);
  flex-shrink:0;}
.brand-box h1{font-size:16px;font-weight:700;letter-spacing:1px;color:#6b1527;display:flex;align-items:baseline;gap:6px;}
.brand-box h1 small{font-size:11.5px;color:#854955;font-weight:600;letter-spacing:0;}
.brand-sub{font-size:11px;color:#5a372c;font-weight:500;letter-spacing:0.3px;}

/* 顶栏属性标签 (微矢量徽章 · 高对比度加粗) */
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chip{background:#fffdfa;border:1px solid #cfb49e;border-radius:18px;
  padding:3.5px 9px;font-size:12px;color:#2c1713;font-weight:500;
  display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 1px 2px rgba(60,20,30,.04);}
.chip b{color:#7e1f34;font-weight:700;}
.chip-svg{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;flex-shrink:0;}
.chip.clickable{cursor:pointer;user-select:none;transition:all .15s;}
.chip.clickable:hover{background:#f3e3d3;border-color:#a53b51;transform:translateY(-1px);}

/* 移动端/窄屏 视图切换器 (解决显示不全与重叠) */
.mobile-switch-bar{display:none;background:#fffdfa;border:1px solid #d4bda8;border-radius:10px;
  padding:3px;gap:5px;flex-shrink:0;box-shadow:0 2px 6px rgba(70,25,35,.04);}
.m-switch-btn{flex:1;background:#f3e8dc;border:1px solid transparent;border-radius:8px;
  padding:7px 6px;font-size:12.5px;font-weight:600;color:#542f25;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .15s;}
.m-switch-btn.on{background:#7e1f34;color:#fff;border-color:#5c1222;
  box-shadow:0 2px 6px rgba(126,31,52,.3);}
.m-switch-btn .m-badge{font-size:10px;background:#c53030;color:#fff;border-radius:10px;padding:1px 6px;margin-left:2px;}

/* 主体栅格 */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 345px;gap:8px;}

/* 左侧主内容 */
.left-col{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden;
  box-shadow:0 2px 8px rgba(70,25,35,.04);}

/* 导航选项卡 (宋锦古风高对比) */
.nav-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;flex-shrink:0;-webkit-overflow-scrolling:touch;}
.nav-tabs::-webkit-scrollbar{height:0;}
.nav-btn{background:#f5e8db;border:1px solid #d1b7a0;border-radius:8px;
  padding:6.5px 13px;font-size:12.5px;font-family:inherit;font-weight:600;color:#4f2b21;
  cursor:pointer;white-space:nowrap;transition:all .15s;
  display:inline-flex;align-items:center;gap:6px;}
.nav-btn:hover{background:#eedbca;border-color:#b95e72;}
.nav-btn.on{background:#7e1f34;border-color:#5f1323;color:#ffffff;font-weight:700;
  box-shadow:0 2px 8px rgba(126,31,52,.3);}
.nav-btn .nav-svg{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;}
.nav-btn.on .nav-svg svg{stroke:#fff;}

/* 场景文案 */
.scene-desc{background:#f9f0e4;border-left:4px solid #7e1f34;border-radius:6px;
  padding:8px 12px;font-size:12.5px;font-weight:500;color:#3f221a;line-height:1.6;flex-shrink:0;
  border-top:1px solid #ebd5c2;border-right:1px solid #ebd5c2;border-bottom:1px solid #ebd5c2;}
.page-content{flex:1;min-height:0;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch;}
.page-content::-webkit-scrollbar{width:5px;}
.page-content::-webkit-scrollbar-thumb{background:#cbb099;border-radius:3px;}

/* 动作网格 (自适应卡片，永不横向溢出) */
.acts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;align-content:start;}
.act-card{background:#fffefc;border:1px solid #d8bfab;border-radius:10px;
  padding:10px 11px;display:flex;gap:10px;cursor:pointer;transition:all .16s;
  text-align:left;position:relative;user-select:none;align-items:flex-start;min-width:0;
  box-shadow:0 1px 3px rgba(70,25,35,.03);}
.act-card:hover{background:#fdf5ec;border-color:#a53b51;transform:translateY(-1.5px);
  box-shadow:0 4px 12px rgba(126,31,52,.12);}
.act-card.off{opacity:.45;filter:grayscale(.75);pointer-events:none;}

/* 矢量徽章图标容器 */
.act-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#fffdfa,#f3e5d7);
  border:1px solid #d4bda8;box-shadow:0 1px 3px rgba(80,30,40,.06),inset 0 1px 1px #fff;
  flex-shrink:0;transition:all .18s;}
.act-card:hover .act-ic{transform:scale(1.05);border-color:#a53b51;}
.act-ic svg{display:block;}

.act-bd{flex:1;min-width:0;}
.act-t1{font-size:13.5px;font-weight:700;color:#1f100d;display:flex;justify-content:space-between;align-items:center;gap:6px;}
.act-t2{font-size:11.5px;font-weight:500;color:#4a2f26;margin-top:4px;line-height:1.5;word-break:break-word;}
.act-cost{font-size:10.5px;color:#7e1f34;font-weight:700;background:#fde9ed;padding:1.5px 7px;border-radius:10px;border:1px solid #eec0c9;flex-shrink:0;}

/* 卡片列表通用 */
.card-item{background:#fffefc;border:1px solid #d8bfab;border-radius:9px;padding:10px 12px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 3px rgba(70,25,35,.03);}
.card-item .item-ic{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,#fffdfa,#f5e5d5);
  border:1px solid #d4bda8;box-shadow:0 1px 2px rgba(80,30,40,.06);flex-shrink:0;}
.card-content{flex:1;min-width:0;}
.card-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:#351a14;}
.card-body{font-size:12px;font-weight:500;color:#4a2f26;margin-top:4px;line-height:1.5;}
.card-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

/* 右侧侧边栏 · 府邸大观与起居注 */
.right-col{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;}
.house-panel{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:12px 14px;flex-shrink:0;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.house-title{font-size:13px;font-weight:700;color:#6b1527;border-bottom:1px solid #e5cebc;
  padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.rank-badge{font-size:11px;font-weight:600;color:#7e1f34;background:#fde9ed;border:1px solid #eec0c9;padding:1.5px 8px;border-radius:10px;}

.lord-card{display:flex;gap:10px;align-items:center;background:#fbf3e9;border:1px solid #dec4b1;border-radius:8px;padding:8px 10px;}
.lord-avatar{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#7e1f34,#9a2a41);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lord-avatar svg{stroke:#fff;}
.lord-info{flex:1;min-width:0;}
.lord-name{font-size:12.5px;font-weight:700;color:#381c15;}

.meter-bar-wrap{display:flex;flex-direction:column;gap:3px;margin-top:5px;}
.meter-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:#4f332a;}
.meter-track{height:6px;background:#e5cebc;border-radius:4px;overflow:hidden;}
.meter-fill{height:100%;border-radius:4px;transition:width .3s;}
.meter-fill.rose{background:linear-gradient(to right,#a83850,#7e1f34);}
.meter-fill.purple{background:linear-gradient(to right,#805ad5,#553c9a);}

.stats-duo{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.stat-cell{background:#fdf7f0;border:1px solid #dec4b1;border-radius:7px;padding:6px 8px;text-align:center;}
.sc-title{font-size:11px;font-weight:600;color:#5a372c;}
.sc-val{font-size:16px;font-weight:700;margin:1px 0;}
.sc-desc{font-size:11px;font-weight:500;color:#7a3543;}

.household-tags{display:flex;flex-wrap:wrap;gap:4px;}
.h-tag{font-size:11.5px;font-weight:600;background:#fbf3ea;border:1px solid #d4bda8;border-radius:6px;
  padding:2.5px 8px;color:#3e221a;display:inline-flex;align-items:center;gap:4px;}

/* 府邸起居注 (日志流) */
.log-box{flex:1;background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:10px 12px;display:flex;flex-direction:column;min-height:0;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.log-head{font-size:12.5px;font-weight:700;color:#4a261c;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.log-list{flex:1;overflow-y:auto;font-size:11.5px;line-height:1.65;display:flex;flex-direction:column;gap:5px;padding-right:2px;}
.log-list::-webkit-scrollbar{width:4px;}
.log-list::-webkit-scrollbar-thumb{background:#cbb099;border-radius:3px;}
.log-item{padding:6px 9px;border-radius:6px;background:#fcf5eb;border-left:3px solid #d4af37;color:#2c1712;font-weight:500;}
.log-item.gd{color:#1a5929;background:#eef6f0;border-left-color:#2f855a;}
.log-item.gd2{color:#134e20;background:#e5f3e8;font-weight:700;border-left-color:#276749;}
.log-item.bd{color:#8c1d1e;background:#fdeeee;border-left-color:#c53030;}
.log-item.pink{color:#7e1f34;background:#fdf0f3;border-left-color:#a53b51;font-weight:600;}
.log-item.gold{color:#744210;background:#fef9e7;border-left-color:#d69e2e;font-weight:600;}
.log-tag{font-size:10.5px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.08);margin-right:5px;font-weight:700;}

/* 底部功能条 */
.bottom-bar{background:#fffdfa;border:1px solid #d4bda8;border-radius:12px;
  padding:7px 12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  align-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(70,25,35,.04);}
.main-btn{background:#7e1f34;border:1px solid #5f1323;border-radius:8px;
  color:#fff;padding:6px 13px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;
  transition:all .15s;display:inline-flex;align-items:center;gap:5px;}
.main-btn:hover{background:#982841;box-shadow:0 2px 8px rgba(126,31,52,.3);transform:translateY(-1px);}
.main-btn.secondary{background:#f3e3d3;border-color:#d4bda8;color:#4a261c;}
.main-btn.secondary:hover{background:#e7d3c0;}

/* 模态弹窗系统 */
.modal-mask{position:fixed;inset:0;background:rgba(28,12,16,.6);backdrop-filter:blur(2px);
  z-index:99;display:none;align-items:center;justify-content:center;padding:12px;}
.modal-box{background:#fffdfa;border:1.5px solid #a53b51;border-radius:14px;
  max-width:540px;width:100%;max-height:86vh;display:flex;flex-direction:column;
  box-shadow:0 14px 40px rgba(50,15,22,.32);overflow:hidden;animation:popIn .2s ease-out;}
@keyframes popIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.modal-head{background:linear-gradient(to right,#7e1f34,#9a2a41);color:#fff;
  padding:11px 16px;font-size:14px;font-weight:700;letter-spacing:1px;
  display:flex;justify-content:space-between;align-items:center;}
.modal-close{cursor:pointer;font-size:18px;line-height:1;opacity:.85;}
.modal-close:hover{opacity:1;}
.modal-body{padding:14px;overflow-y:auto;font-size:12.5px;color:#2c1713;line-height:1.65;}
.story-panel{background:#faf2e8;border:1px solid #dfc7b0;border-radius:10px;padding:12px;margin-bottom:10px;}
.story-title{font-size:13.5px;font-weight:700;color:#6b1527;margin-bottom:6px;border-bottom:1px dashed #d4bda8;padding-bottom:4px;}
.story-text{font-size:12.5px;font-weight:500;color:#351e17;line-height:1.7;}
.story-text p{margin-bottom:6px;}
.story-choices{display:flex;flex-direction:column;gap:7px;margin-top:10px;}
.story-choice{background:#fffdfa;border:1px solid #d4bda8;border-radius:8px;
  padding:10px 14px;font-size:12.5px;font-weight:600;color:#351a14;cursor:pointer;text-align:left;
  font-family:inherit;transition:all .15s;}
.story-choice:hover{background:#7e1f34;border-color:#5c1222;color:#fff;}

/* 提示浮条 */
#toastBox{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(30,12,16,.92);color:#fff;border:1px solid #a53b51;
  border-radius:20px;padding:7px 18px;font-size:12px;font-weight:600;z-index:999;
  pointer-events:none;opacity:0;transition:opacity .2s;}
#toastBox.show{opacity:1;}

/* 彻底解决窄屏/移动端 (<= 890px) 遮挡、裁切与重叠 */
@media(max-width:890px){
  .wrap{padding:6px;gap:6px;}
  .topbar{padding:6px 10px;gap:6px;}
  .brand-box h1{font-size:14.5px;}
  .brand-sub{font-size:10.5px;}
  .chip{padding:2.5px 8px;font-size:11px;}

  /* 显式开启移动端分屏切换器，避免两栏上下挤压塌陷 */
  .mobile-switch-bar{display:flex;}
  .main{display:flex;flex-direction:column;overflow:hidden;}

  /* 切换隐藏逻辑 */
  .left-col.m-hidden, .right-col.m-hidden{display:none!important;}
  .left-col, .right-col{flex:1;min-height:0;height:100%;}
  .house-panel{padding:10px 12px;}
  .log-box{min-height:0;}

  .acts-grid{grid-template-columns:1fr;gap:8px;}
  .bottom-bar{padding:6px 10px;}
}

@media(min-width:891px){
  .mobile-switch-bar{display:none!important;}
  .left-col, .right-col{display:flex!important;}
}
</style>
</head>
<body class="s-spring">
<div id="fxCanvas"></div>

<div class="wrap">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand-box">
      <div class="mansion-logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L3 7v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V7l-9-5z"/>
          <path d="M12 7v5"/>
          <circle cx="12" cy="15" r="1.5" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>定远侯府 <small>高门主母掌家录</small></h1>
        <div class="brand-sub">执掌中馈 · 规训内宅 · 经略庄产 · 望子成龙</div>
      </div>
    </div>
    <div class="chips" id="topChips">
      <!-- 动态渲染属性牌 -->
    </div>
  </header>

  <!-- 移动端专属切换器 (保证无论屏幕多窄，均拥有100%全景高度，杜绝重叠截断) -->
  <div class="mobile-switch-bar">
    <button class="m-switch-btn on" id="btnMViewMain" onclick="setMobileView('main')">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10L12 3l9 7v10h-6v-6h-6v6H5z"/></svg>
      执掌中馈 (主令)
    </button>
    <button class="m-switch-btn" id="btnMViewHouse" onclick="setMobileView('house')">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      阖府大观 · 起居注 <span class="m-badge" id="mBadge" style="display:none;">新</span>
    </button>
  </div>

  <!-- 主体工作区 -->
  <div class="main">
    <!-- 左侧中枢 (主令与中馈政务) -->
    <div class="left-col" id="leftCol">
      <!-- 页面标签栏 -->
      <div class="nav-tabs" id="navTabs">
        <!-- 动态渲染 6 大中馈分区 -->
      </div>

      <!-- 场景诗意文案 -->
      <div class="scene-desc" id="sceneDesc">
        <!-- 动态渲染 -->
      </div>

      <!-- 具体功能区内容 -->
      <div class="page-content" id="pageContent">
        <!-- 动态渲染动作或子列表 -->
      </div>
    </div>

    <!-- 右侧：府邸状态与流水日志 -->
    <div class="right-col" id="rightCol">
      <!-- 府邸大观概览卡 -->
      <div class="house-panel" id="housePanel">
        <!-- 动态渲染 -->
      </div>

      <!-- 府邸起居注 (日志) -->
      <div class="log-box">
        <div class="log-head">
          <span style="display:inline-flex;align-items:center;gap:6px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#7e1f34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            侯府起居注
          </span>
          <span style="font-size:11px;color:#854955;font-weight:600;">岁月无声 · 掌家有度</span>
        </div>
        <div class="log-list" id="logList">
          <!-- 动态渲染日志 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 底栏 -->
  <footer class="bottom-bar">
    <div style="font-size:12px;color:#4a261c;font-weight:600;display:flex;align-items:center;gap:6px;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#7e1f34" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      当前身份：<b>定远侯正头大娘子 (谢氏锦仪)</b>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="main-btn" onclick="endCurrentXun()">⏳ 岁月流转 (下旬)</button>
      <button class="main-btn secondary" onclick="openSaveModal()">💾 存简</button>
      <button class="main-btn secondary" onclick="showHelp()">❓ 典籍</button>
      <button class="main-btn secondary" onclick="restartGame()">🔄 重开</button>
    </div>
  </footer>
</div>

<!-- 通用模态弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">侯府事宜</span>
      <span class="modal-close" onclick="closeModal()">✕</span>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- 内容 -->

/* ================= 2. Web Audio 原生宫廷古筝和弦合成 ================= */
var audioCtx = null;
var bgmPlaying = false;
var bgmTimer = null;
function initAudio(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
}
function playTone(freq, type, duration, delay, gainLevel){
  if(!audioCtx) return;
  setTimeout(function(){
    try{
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainLevel || 0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }catch(e){}
  }, (delay||0)*1000);
}
function playPalaceChords(){
  if(!bgmPlaying) return;
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  var pentatonic = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33];
  var note1 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  var note2 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  var note3 = pentatonic[Math.floor(Math.random()*pentatonic.length)];
  playTone(note1, 'triangle', 2.2, 0, 0.08);
  playTone(note2, 'sine', 1.8, 0.4, 0.06);
  playTone(note3, 'sine', 2.5, 0.9, 0.05);
}
function playClickSound(type){
  initAudio();
  if(!audioCtx) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  try{
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    if(type === 'guzheng'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.25);
    }
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }catch(e){}
}
function toggleMusic(){
  bgmPlaying = !bgmPlaying;
  if(bgmPlaying){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    playPalaceChords();
    if(!bgmTimer) bgmTimer = setInterval(playPalaceChords, 4800);
    toast('雅乐鸣奏 · 宫商角徵羽清音流转');
  } else {
    if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; }
    toast('雅乐静止');
  }
  render();
}

/* ================= 4. 辅助函数 ================= */
function ri(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function cl(v, min, max){ if(min===undefined) min=0; if(max===undefined) max=100; return Math.max(min, Math.min(max, v)); }
function toast(msg){
  var el = document.getElementById('toastBox');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 1800);
}
function addLog(txt, type, tag){
  if(!G) return;
  var sName = SEASONS[Math.floor((G.month-1)/3)%4];
  var timeStr = '第'+G.year+'年·'+sName;
  G.logs.unshift({ text: txt, type: type||'', tag: tag||timeStr });
  if(G.logs.length > 50) G.logs.pop();
  renderLogs();
  // 移动端更新起居注红点
  if(mobileView !== 'house'){
    var b = document.getElementById('mBadge');
    if(b) b.style.display = 'inline-block';
  }
}
function useEnergy(n){
  if(G.energy < n){ toast('体力精力不济，请歇息或进入下旬！'); return false; }
  G.energy -= n; playClickSound('guzheng'); render(); return true;
}

/* 移动端视图切换 */
function setMobileView(view){
  mobileView = view;
  var btnMain = document.getElementById('btnMViewMain');
  var btnHouse = document.getElementById('btnMViewHouse');
  var leftCol = document.getElementById('leftCol');
  var rightCol = document.getElementById('rightCol');
  if(view === 'main'){
    btnMain.className = 'm-switch-btn on';
    btnHouse.className = 'm-switch-btn';
    leftCol.classList.remove('m-hidden');
    rightCol.classList.add('m-hidden');
  } else {
    btnMain.className = 'm-switch-btn';
    btnHouse.className = 'm-switch-btn on';
    leftCol.classList.add('m-hidden');
    rightCol.classList.remove('m-hidden');
    var b = document.getElementById('mBadge');
    if(b) b.style.display = 'none';
  }
  playClickSound('ting');
}

/* ================= 5. 模态弹窗系统 ================= */
function openModal(title, html){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalMask').style.display = 'flex';
  playClickSound('ting');
}
function closeModal(){
  document.getElementById('modalMask').style.display = 'none';
}

/* ================= 6. 剧情队列系统 StoryQueue ================= */
var storyQueue = [];
function pushStory(fn){
  storyQueue.push(fn);
  if(storyQueue.length === 1) triggerNextStory();
}
function triggerNextStory(){
  if(storyQueue.length === 0) return;
  var fn = storyQueue[0];
  fn();
}
function finishStory(){
  storyQueue.shift();
  closeModal();
  if(storyQueue.length > 0) setTimeout(triggerNextStory, 200);
}

function endCurrentXun(){
  G.energy = G.maxEnergy;
  G.xun++;
  if(G.xun >= 3){
    G.xun = 0;
    G.month++;
    if(G.month > 12){
      G.month = 1;
      G.year++;
      addLog('岁除迎新春！定远侯府除夕设百官年宴，你掌家一年清白有序，得朝廷诰命加封！','gold','【岁除大典】');
      G.prestige = cl(G.prestige + 10);
    }
    // 月度产业结算
    var totalIncome = 0;
    for(var i=0; i<G.estates.length; i++){
      totalIncome += G.estates[i].income;
    }
    G.silver += totalIncome;
    addLog('月度公中盘点：名下庄田商铺进项汇总，入公中库银+'+totalIncome+'两！','gd2','【月度盘库】');

  } else {
    addLog('岁月荏苒，侯府又过一旬。后宅平安无事。','','【时岁如流】');
  }
  render();
  autoSave();
}

        '<div class="story-choices">'+
          '<button class="story-choice" onclick="helpFamily(true)">动用侯府声势与公中200两解母家之围（门风+10，公中-200两）</button>'+
          '<button class="story-choice" onclick="helpFamily(false)">写信从容劝导，严守公中规矩不涉私利（威仪+5）</button>'+
        '</div>');
    });
  } else if(r < 0.6){
    pushStory(function(){
      openModal('【寿安堂喜讯 · 皇室赐赏】',
        '<div class="story-panel"><div class="story-title">圣天子赐紫金寿桃</div>'+
        '<div class="story-text"><p>恰逢老太君六十整寿，圣上念定远侯战功赫赫，特赐如意两柄、紫金蟠桃，京城勋贵齐聚贺寿！</p></div></div>'+
        '<div class="story-choices">'+
          '<button class="story-choice" onclick="finishStory()">大娘子亲自领众命妇谢恩领赏（侯府声望暴涨+15）</button>'+
        '</div>');
    });
    G.reputation = cl(G.reputation + 15);
  }
}
function helpFamily(ok){
  finishStory();
  if(ok){
    if(G.silver >= 200) G.silver -= 200;
    G.reputation = cl(G.reputation + 10);
    addLog('你兼顾娘家与侯府，母家化险为夷，对你感激涕零。（声望+10）','gd2','【援引母家】');
  } else {
    G.prestige = cl(G.prestige + 5);
    addLog('你回信规劝兄长秉公任事，公私分明，老太君知晓后极力赞赏。（威仪+5）','gd','【克己奉公】');
  }
  render();
}

/* ================= 11. 存档与神识导出系统 ================= */
function autoSave(){
  try{
    localStorage.setItem('gaomen_save_auto', JSON.stringify(G));
  }catch(e){}
}
function openSaveModal(){
  var s0 = localStorage.getItem('gaomen_save_auto') ? '已有自动存简' : '暂无';
  var html = '<p style="font-size:12.5px;font-weight:600;margin-bottom:8px;color:#4a261c;">存档保存在本地，亦可调阅各卷宗室档案：</p>';
  html += '<div style="background:#fcf5ec;border:1px solid #dfc7b0;padding:8px 10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">'+
    '<span>天道印记自动档：<b>'+s0+'</b></span>'+
    '<button class="main-btn" style="padding:3px 10px;font-size:11.5px;" onclick="loadSlot(&apos;auto&apos;)">读取</button></div>';

  for(var i=1; i<=3; i++){
    var has = localStorage.getItem('gaomen_save_'+i) ? '【已刻印档案】' : '【空置卷轴】';
    html += '<div style="background:#fcf5ec;border:1px solid #dfc7b0;padding:8px 10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">'+
      '<span>第 '+i+' 卷简册：'+has+'</span>'+
      '<div>'+
        '<button class="main-btn secondary" style="padding:3px 9px;font-size:11.5px;margin-right:4px;" onclick="saveSlot('+i+')">存入</button>'+
        '<button class="main-btn" style="padding:3px 9px;font-size:11.5px;" onclick="loadSlot('+i+')">读取</button>'+
      '</div></div>';
  }
  html += '<button class="main-btn secondary" style="width:100%;margin-top:6px;" onclick="closeModal()">返回</button>';
  openModal('💾 侯府起居注卷轴存简', html);
}
function saveSlot(i){
  try{
    localStorage.setItem('gaomen_save_'+i, JSON.stringify(G));
    toast('第 '+i+' 卷简册存录成功！');
    openSaveModal();
  }catch(e){ toast('存录失败'); }
}
function loadSlot(i){
  try{
    var raw = localStorage.getItem('gaomen_save_'+i);
    if(!raw){ toast('暂无存录记录'); return; }
    G = JSON.parse(raw);
    closeModal();
    toast('神识调阅成功，时光倒流！');
    render();
  }catch(e){ toast('读取失败'); }
}

function showHelp(){
  openModal('📖 掌家心法与典籍要诀',
    '<div class="story-panel"><div class="story-title">高门主母修养三大纲纪</div>'+
    '<div class="story-text">'+
    '<p><b>一、中馈公中莫亏空：</b>每月按旬发放份例，田庄与绸缎铺子必须常去盘查，防范管事做假账虚报开销。</p>'+
    '<p><b>二、内宅驭下恩威并重：</b>林小娘虽得宠，但尊卑有别不可逾矩；老太君面前尽孝，夫君书房常去温情抚慰。</p>'+
    '<p><b>三、世家大族后代为本：</b>聘请翰林名师开蒙，待哥儿年满十四便需相看世家名门，结成朱门奥援。</p>'+
    '</div></div>');
}

function restartGame(){
  if(confirm('是否从新妇过门之日重新开启高门掌家录？')){
    G = getDefaultState();
    render();
    toast('新妇过门，从头执掌定远侯府中馈！');
  }
}

/* ================= 12. 初始化启动 ================= */
window.onload = function(){
  try{
    var raw = localStorage.getItem('gaomen_save_auto');
    if(raw) G = JSON.parse(raw);
    else G = getDefaultState();
  }catch(e){
    G = getDefaultState();
  }
  render();
};
</script>
</body>
</html>
