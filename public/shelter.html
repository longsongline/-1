<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>方舟纪元 · 废土避难所经营录 (纯原生单文件典藏典雅版)</title>
<style>
/* ================= 废土工业与微光温情 · 色彩与基础系统 ================= */
:root {
  --bg-core: #101316;
  --bg-card: #181d22;
  --bg-sub: #21272f;
  --bg-hover: #29313a;
  --border-main: #2f3742;
  --border-glow: #e06c75;
  --text-main: #e6edf3;
  --text-sub: #8b949e;
  --text-dim: #6e7681;
  --accent-amber: #d29922;
  --accent-emerald: #3fb950;
  --accent-cyan: #38bdf8;
  --accent-rose: #f43f5e;
  --accent-rust: #ea580c;
  --accent-gold: #f59e0b;
  --accent-purple: #a855f7;
  --panel-radius: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg-core);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 1.5;
  font-size: 13px;
  overflow-x: hidden;
  min-height: 100vh;
}

/* 顶部微光粒子与辐射烟雾 */
#dustCanvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; opacity: 0.35;
}

.wrap {
  position: relative; z-index: 2;
  max-width: 1120px; margin: 0 auto;
  min-height: 100vh; display: flex; flex-direction: column;
  padding: 10px 12px 64px;
}

/* ================= 顶部状态栏 ================= */
.topbar {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 8px 12px;
  margin-bottom: 10px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.brand-row {
  display: flex; justify-content: space-between; align-items: center;
}
.brand-title {
  font-size: 15px; font-weight: bold; color: #fff;
  display: flex; align-items: center; gap: 8px;
}
.brand-title small {
  font-size: 11px; font-weight: normal; color: var(--accent-amber);
  background: rgba(210, 153, 34, 0.15); padding: 2px 6px; border-radius: 4px;
  border: 1px solid rgba(210, 153, 34, 0.3);
}
.brand-right {
  display: flex; gap: 6px; align-items: center;
}

/* 紧凑状态微标矩阵 */
.chips-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
@media (max-width: 640px) {
  .chips-grid { grid-template-columns: repeat(2, 1fr); }
}
.chip {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 4px 8px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px;
}
.chip-lbl { color: var(--text-sub); }
.chip-val { font-weight: bold; color: var(--text-main); }
.chip-val.green { color: var(--accent-emerald); }
.chip-val.amber { color: var(--accent-amber); }
.chip-val.cyan { color: var(--accent-cyan); }
.chip-val.rose { color: var(--accent-rose); }
.chip-val.purple { color: var(--accent-purple); }
.chip.btn {
  cursor: pointer; transition: all 0.2s;
  justify-content: center; font-weight: bold;
}
.chip.btn:hover { border-color: var(--accent-amber); }
.chip.btn:active { transform: scale(0.97); }

/* 主线剧情进度横幅 */
.story-milestone-banner {
  background: linear-gradient(90deg, rgba(210,153,34,0.12), rgba(56,189,248,0.1));
  border: 1px solid rgba(210,153,34,0.3);
  border-radius: 6px;
  padding: 6px 10px;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px;
}
.story-milestone-banner b { color: var(--accent-amber); }
.story-milestone-banner .banner-btn {
  background: var(--bg-sub); border: 1px solid var(--border-main);
  color: var(--accent-cyan); padding: 2px 8px; border-radius: 4px;
  cursor: pointer; font-size: 11px;
}

/* ================= 移动端视图切换条 ================= */
.m-dock-switch {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 3px;
  margin-bottom: 8px;
}
@media (max-width: 768px) {
  .m-dock-switch { display: flex; gap: 4px; }
}
.m-switch-btn {
  flex: 1; padding: 6px 0; border: none; background: transparent;
  color: var(--text-sub); font-size: 12px; font-weight: bold;
  border-radius: 6px; cursor: pointer; text-align: center;
}
.m-switch-btn.on {
  background: var(--bg-sub); color: var(--accent-cyan);
  border: 1px solid var(--border-main);
}

/* ================= 主布局分栏 ================= */
.main-cols {
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 10px;
  flex: 1;
}
@media (max-width: 768px) {
  .main-cols { grid-template-columns: 1fr; }
  .col-hidden-mobile { display: none !important; }
}

/* 左侧栏：避难所状态、幸存者名册、起居日志 */
.left-col {
  display: flex; flex-direction: column; gap: 10px;
}
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 10px 12px;
}
.panel-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border-main);
  font-size: 13px; font-weight: bold; color: #fff;
}
.panel-head small { font-size: 11px; color: var(--text-dim); font-weight: normal; }

/* 幸存者列表 */
.survivors-list {
  display: flex; flex-direction: column; gap: 6px;
}
.survivor-item {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 6px 8px;
  display: flex; align-items: center; gap: 8px;
}
.survivor-avatar {
  width: 34px; height: 34px; border-radius: 6px;
  background: #111; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.survivor-info { flex: 1; min-width: 0; }
.survivor-name {
  display: flex; justify-content: space-between; font-weight: bold; font-size: 12px;
}
.survivor-role { font-size: 11px; color: var(--text-sub); margin-top: 1px; }
.survivor-bar {
  height: 4px; background: #161b22; border-radius: 2px; margin-top: 4px; overflow: hidden;
}
.survivor-bar-inner {
  height: 100%; background: var(--accent-emerald); border-radius: 2px;
}

/* 避难所日志流 */
.log-box {
  background: #0d1117;
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 8px;
  height: 180px;
  overflow-y: auto;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11.5px;
  line-height: 1.6;
}
.log-row { margin-bottom: 4px; display: flex; gap: 6px; }
.log-time { color: var(--text-dim); flex-shrink: 0; }
.log-green { color: var(--accent-emerald); }
.log-amber { color: var(--accent-amber); }
.log-cyan { color: var(--accent-cyan); }
.log-rose { color: var(--accent-rose); }
.log-purple { color: var(--accent-purple); }

/* 右侧栏：主交互区 */
.right-col {
  display: flex; flex-direction: column; gap: 10px;
}
.tab-nav {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
}
.tab-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  color: var(--text-sub);
  padding: 7px 12px;
  border-radius: var(--panel-radius);
  cursor: pointer; font-size: 12.5px; font-weight: bold;
  white-space: nowrap; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn:hover { border-color: var(--text-sub); color: #fff; }
.tab-btn.on {
  background: var(--bg-sub);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
}

/* 场景横幅环境卡 */
.scene-intro {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--text-sub);
  line-height: 1.6;
}

/* 操作选项卡列表 */
.acts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (max-width: 640px) {
  .acts-grid { grid-template-columns: 1fr; }
}

.act-card {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 10px;
  display: flex; gap: 10px;
  cursor: pointer; transition: all 0.2s;
  position: relative;
}
.act-card:hover {
  border-color: var(--accent-amber);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.act-card:active { transform: scale(0.98); }
.act-card.off {
  opacity: 0.55; cursor: not-allowed;
}
.act-card.off:hover { transform: none; border-color: var(--border-main); }
.act-ic {
  width: 38px; height: 38px; border-radius: 6px;
  background: var(--bg-sub); display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.act-bd { flex: 1; min-width: 0; }
.act-title-row {
  display: flex; justify-content: space-between; align-items: center;
}
.act-title { font-weight: bold; font-size: 13px; color: #fff; }
.act-cost { font-size: 11px; color: var(--accent-amber); font-weight: bold; }
.act-desc { font-size: 11.5px; color: var(--text-sub); margin-top: 2px; line-height: 1.4; }

/* 底部常驻停靠栏 */
.bottom-dock {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(18, 21, 24, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-main);
  padding: 8px 12px;
  display: flex; justify-content: center; gap: 8px;
}
.dock-btn {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  color: var(--text-main);
  padding: 8px 14px;
  border-radius: 6px;
  font-size: 12px; font-weight: bold;
  cursor: pointer; transition: all 0.2s;
}
.dock-btn.primary {
  background: linear-gradient(135deg, #b91c1c, #991b1b);
  border-color: #ef4444; color: #fff;
}
.dock-btn:hover { border-color: var(--accent-amber); }
.dock-btn:active { transform: scale(0.97); }

/* 弹窗系统 */
.modal-mask {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 12px;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  max-width: 600px; width: 100%; max-height: 85vh;
  overflow-y: auto;
  padding: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-main);
}
.modal-title { font-size: 15px; font-weight: bold; color: #fff; }
.modal-close {
  background: transparent; border: none; color: var(--text-sub);
  font-size: 16px; cursor: pointer; padding: 4px;
}
.story-box {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 12px;
  line-height: 1.6;
  font-size: 12.5px;
  margin-bottom: 12px;
}
.story-choices {
  display: flex; flex-direction: column; gap: 8px;
}
.choice-btn {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  color: var(--text-main);
  padding: 10px 12px;
  border-radius: 6px;
  cursor: pointer; text-align: left;
  font-size: 12.5px; transition: all 0.2s;
}
.choice-btn:hover {
  background: #28303b; border-color: var(--accent-cyan);
}

/* 提示 Toast */
#toast {
  position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: #fff;
  padding: 6px 14px; border-radius: 20px; font-size: 12px;
  border: 1px solid var(--border-main);
  pointer-events: none; z-index: 300; opacity: 0;
  transition: opacity 0.3s;
}
#toast.show { opacity: 1; }


/* 水培槽位可视化卡片 */
.crops-preview-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-main);
  border-radius: var(--panel-radius);
  padding: 10px;
  margin-bottom: 8px;
}
.crops-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.crop-bed {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.crop-bed-top {
  display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: bold;
}
.crop-bed-bar {
  height: 6px; background: #121518; border-radius: 3px; overflow: hidden;
}
.crop-bed-bar-inner {
  height: 100%; background: linear-gradient(90deg, #3fb950, #2ea043); border-radius: 3px;
}
.crop-bed-status {
  font-size: 10.5px; color: var(--text-dim); display: flex; justify-content: space-between;
}

/* 战备装备网格 */
.gear-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 8px;
}
@media (max-width: 600px) { .gear-grid { grid-template-columns: 1fr; } }
.gear-card {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 10px;
  display: flex; gap: 8px; align-items: center;
}
.gear-icon {
  font-size: 24px; width: 40px; height: 40px; background: #121518; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.gear-info { flex: 1; min-width: 0; }
.gear-name { font-weight: bold; font-size: 12px; color: #fff; }
.gear-desc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

/* 广播旋钮交互界面 */
.radio-console {
  background: #0d1217;
  border: 2px solid #23303c;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}
.radio-screen {
  background: #06100c;
  border: 1px solid #144933;
  color: #39e58c;
  font-family: monospace;
  padding: 10px;
  border-radius: 4px;
  min-height: 54px;
  box-shadow: inset 0 0 10px rgba(57,229,140,0.2);
  margin-bottom: 10px;
  line-height: 1.4;
}
.radio-dials {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.dial-btn {
  background: #19222b;
  border: 1px solid #334455;
  color: #c9d1d9;
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 11.5px;
  cursor: pointer;
  font-weight: bold;
}
.dial-btn.active {
  background: #1b3a2f;
  border-color: #39e58c;
  color: #39e58c;
}

/* 避难所手记卡片 */
.diary-card {
  background: var(--bg-sub);
  border: 1px solid var(--border-main);
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
}
.diary-author {
  display: flex; justify-content: space-between; font-weight: bold; font-size: 12px;
  margin-bottom: 4px;
}
.diary-content {
  font-size: 12px; color: var(--text-sub); line-height: 1.6;
}

/* 温馨装潢卡 */
.decor-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: bold;
}
</style>
</head>
<body>

<canvas id="dustCanvas"></canvas>

<div class="wrap">
  <!-- 顶部状态栏 -->
  <header class="topbar">
    <div class="brand-row">
      <div class="brand-title">
        <span>🛡️ 方舟纪元 · 废土避难所</span>
        <small id="shelterGrade">第101号深地地宫</small>
      </div>
      <div class="brand-right">
        <button class="chip btn" id="btnAudio" onclick="toggleAudio()">🎵 废土清音</button>
        <button class="chip btn" onclick="openChronicleModal()">📖 编年史</button>
        <button class="chip btn" onclick="openEndingsModal()">🏆 终局图鉴</button>
      </div>
    </div>

    <!-- 主线剧情进度横幅 -->
    <div class="story-milestone-banner" id="milestoneBanner">
      <div><b>当前主线：</b><span id="milestoneText">【第一幕 · 寒夜微光】加固避难所铅门，保障温室与电力供给</span></div>
      <button class="banner-btn" onclick="openStoryMilestoneModal()">查看纪元目标</button>
    </div>

    <!-- 资源与生存指数矩阵 -->
    <div class="chips-grid" id="chipsGrid"></div>
  </header>

  <!-- 移动端视图切换条 -->
  <div class="m-dock-switch">
    <button class="m-switch-btn on" id="btnTabMain" onclick="setMobileView('main')">🏢 避难所中枢与工坊</button>
    <button class="m-switch-btn" id="btnTabSide" onclick="setMobileView('side')">👥 同伴状态与生息手记</button>
  </div>

  <!-- 主布局分栏 -->
  <div class="main-cols">
    <!-- 左侧栏：幸存者名册、避难所设施、起居日志 -->
    <div class="left-col" id="leftCol">
      <!-- 避难所温馨度与生活指数 -->
      <div class="panel">
        <div class="panel-head">
          <span>🏡 避难所温馨度</span>
          <small id="cozyLevelText">微温庇护所 (0/100)</small>
        </div>
        <div class="survivor-bar" style="height:6px;margin-bottom:8px;">
          <div class="survivor-bar-inner" id="cozyBarInner" style="width:10%;background:linear-gradient(90deg, #d29922, #3fb950);"></div>
        </div>
        <div style="font-size:11px;color:var(--text-sub);line-height:1.4;" id="cozyBuffText">
          ✨ 当前增益：每日夜间精力额外+0，全员心境流失减缓0%。
        </div>
      </div>

      <!-- 幸存者名单与忠犬 -->
      <div class="panel">
        <div class="panel-head">
          <span>👥 同行同伴 & 忠犬</span>
          <small id="dateIndicator">晴朗干爽 · 融雪初春</small>
        </div>
        <div class="survivors-list" id="survivorList"></div>
      </div>

      <!-- 避难所起居运行日志 -->
      <div class="panel">
        <div class="panel-head">
          <span>📟 避难所终端日志</span>
          <small>系统指令流</small>
        </div>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>

    <!-- 右侧栏：避难所核心中枢与场景操作 -->
    <div class="right-col" id="rightCol">
      <!-- 场景选项卡 -->
      <nav class="tab-nav" id="tabNav"></nav>

      <!-- 场景环境描写 -->
      <div class="scene-intro" id="sceneIntro"></div>

      <!-- 操作卡网格 -->
      <div class="acts-grid" id="actsGrid"></div>
    </div>
  </div>
</div>

<!-- 底部常驻操作栏 -->
<div class="bottom-dock">
  <button class="dock-btn primary" onclick="nextDayCycle()">⏳ 度过今日 (结算生存消耗)</button>
  <button class="dock-btn" onclick="openSaveModal()">💾 存读档</button>
  <button class="dock-btn" onclick="openDiaryModal()">📝 幸存者日记</button>
  <button class="dock-btn" onclick="showHelpModal()">❓ 生存法则</button>
  <button class="dock-btn" onclick="doRestart()">🔄 重新开局</button>
</div>

<!-- 模态弹窗系统 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">标题</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script>

/* ================= 3. 通用辅助函数 ================= */
function ri(min, max){ return Math.floor(Math.random()*(max - min + 1)) + min; }
function cl(n, min, max){ return Math.min(Math.max(n, min||0), max||100); }

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el.t);
  el.t = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

function addLog(text, cls){
  var timeStr = '第'+G.day+'日';
  G.logs.unshift({ time: timeStr, text: text, cls: cls||'' });
  if(G.logs.length > 40) G.logs.pop();
  renderLogs();
}

function useEnergy(n){
  if(G.energy < n){ toast('体力精力已耗尽，请进入下一日休整！'); return false; }
  G.energy -= n; playBeep(520, 'sine', 0.15); render(); return true;
}

/* ================= 4. Web Audio 废土空灵和弦引擎 ================= */
var audioCtx = null;
var audioOn = false;
var bgmInterval = null;

function toggleAudio(){
  audioOn = !audioOn;
  var btn = document.getElementById('btnAudio');
  if(audioOn){
    initAudio();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    playWastelandChords();
    if(!bgmInterval) bgmInterval = setInterval(playWastelandChords, 5600);
    btn.textContent = '🎵 废土清音已启';
    btn.style.borderColor = 'var(--accent-cyan)';
    toast('📻 避难所空灵吉他弦音已开启');
  } else {
    if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
    btn.textContent = '🔇 废土静音';
    btn.style.borderColor = 'var(--border-main)';
    toast('已静音');
  }
}

function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playWastelandChords(){
  if(!audioOn || !audioCtx) return;
  var chords = [
    [220.00, 261.63, 329.63, 392.00, 110.00], // Am7 + Bass
    [174.61, 220.00, 261.63, 329.63, 87.31],  // Fmaj7 + Bass
    [196.00, 246.94, 293.66, 392.00, 98.00],  // G + Bass
    [164.81, 196.00, 246.94, 329.63, 82.41]   // Em + Bass
  ];
  var c = chords[Math.floor(Math.random()*chords.length)];
  for(var i=0; i<c.length; i++){
    playTone(c[i], i === 4 ? 'sine' : 'triangle', 3.2, i*0.24, i === 4 ? 0.05 : 0.032);
  }
}

function playTone(freq, type, dur, delay, gainVal){
  if(!audioCtx) return;
  setTimeout(function(){
    try {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(gainVal||0.04, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }, delay*1000);
}

function playBeep(freq, type, dur){
  initAudio();
  if(!audioCtx) return;
  try {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

  if(G.day <= 15){
    G.act = 1;
    document.getElementById('milestoneText').innerHTML = '【第一幕 · 寒夜微光】稳固地下工农业生产，给小朵和伙伴们一个温暖庇护所 (进行中: '+G.day+'/15日)';
  } else if(G.day <= 35){
    G.act = 2;
    document.getElementById('milestoneText').innerHTML = '【第二幕 · 荒原回响】化解铁颅匪帮危机，突破老陈抗毒血清，搭建地热暖泉 (进行中: '+G.day+'/35日)';

}

function tuneRadio(f){
  G.radioFreq = f;
  playBeep(880, 'sine', 0.08);
  if(f === '94.2'){
    initAudio();
    playWastelandChords();
    toast('📻 接收到温暖的极光民谣弦音');
  } else {
    toast('电台调谐至 ' + f + ' MHz');
  }
  render();
}

function createAct(icon, title, desc, cost, fnStr){

}

/* ================= 7. 详细玩法动作实现 ================= */

/* —— 温室农耕 —— */
function actHarvestCrops(){
  if(!useEnergy(1)) return;
  var harvestedFood = 0;
  for(var i=0; i<G.crops.length; i++){
    var c = G.crops[i];
    if(c.growth >= c.mature){
      var yieldBase = ri(10, 16);
      if(G.flags.greenhouseUpgraded) yieldBase = Math.floor(yieldBase * 1.35);
      harvestedFood += yieldBase;
      c.growth = 0;
      c.watered = false;
    } else {
      c.growth++;
    }
  }
  if(harvestedFood > 0){
    G.food += harvestedFood;
    var descs = [
      '🍅 你与小朵提着柳条编织的菜篮走进温室。掀开水培保温薄膜，红彤彤、沉甸甸的抗辐射番茄沾着水雾，散发着浓郁纯粹的草木甘香！小朵摘下一颗擦了擦，笑盈盈塞进你嘴里，清甜多汁！（口粮+'+harvestedFood+'）',
      '🥔 挖起一窝窝水培生长的变异马铃薯，个个大如沙田柚，淀粉饱满细腻！老陈笑得合不拢嘴：“有了这批好土豆，全避难所一个冬天都不愁断粮了！”（口粮+'+harvestedFood+'）',
      '🌱 翠绿欲滴的水芹菜与无土生菜水灵饱满，水培循环泵发出欢快的咕嘟声。在这深不见底的冰冷岩穴中，这片郁郁葱葱的绿意就是人类最顽强的生命礼赞！（口粮+'+harvestedFood+'）'
    ];
    addLog(descs[Math.floor(Math.random()*descs.length)], 'log-green');
    toast('采收口粮 +'+harvestedFood);
  } else {
    addLog('🌱 作物正在温室内茁壮拔节生根，幼苗贪婪吸收着多光谱生长光，稍候即可迎来新一轮采摘成熟。', '');
    toast('作物生长中');
  }
  render();
}

function actWaterCrops(){
  if(G.water < 2){ toast('纯净水不足2升，快去工坊滤水或后厨！'); return; }
  if(!useEnergy(1)) return;
  G.water -= 2;
  for(var i=0; i<G.crops.length; i++){
    G.crops[i].watered = true;
    G.crops[i].growth = Math.min(G.crops[i].mature, G.crops[i].growth + 1);
  }
  addLog('💧 喷淋系统将珍贵清甜水源洒向温室，幼苗贪婪吸收，生长速度加快！', 'log-cyan');
  toast('温室喷淋完成');
  render();
}

function actPlantMushrooms(){
  if(!useEnergy(1)) return;
  var yieldMed = ri(3, 5);
  G.med += yieldMed;
  addLog('🍄 采下岩壁缝隙间晶莹发光的雪蘑菇菌褶，萃取出高纯抗辐射原浆，药品+'+yieldMed+'份！', 'log-green');
  toast('获得药品原浆 +'+yieldMed);
  render();
}

function actBuildBeehive(){
  if(G.flags.hasBeehive){
    if(!useEnergy(1)) return;
    G.flags.honey = (G.flags.honey||0) + 2;
    addLog('🐝 从地底蜂箱中摇出两瓶金黄透亮的纯净野蜂蜜！散发着迷人的野花香气。', 'log-amber');
    toast('获得纯野蜂蜜 +2瓶');
    render();
    return;
  }
  if(G.scrap < 15){ toast('废料零件不足15件'); return; }
  if(!useEnergy(2)) return;
  G.scrap -= 15;
  G.flags.hasBeehive = true;
  G.flags.honey = 3;
  addLog('🐝 成功在温室顶角搭建起生态蜂箱！小蜜蜂穿梭在番茄与草莓花丛中授粉，温室作物更加繁茂！', 'log-green');
  toast('生态蜂箱搭建成功！');
  render();
}

function actPlantStrawberry(){
  if(G.flags.hasStrawberry){
    if(!useEnergy(1)) return;
    var foodGain = ri(6, 10);
    G.food += foodGain;
    var duo = G.survivors.find(function(x){ return x.id==='duo'; });
    if(duo){ duo.mood = cl(duo.mood + 15); duo.affection = cl(duo.affection + 8); }
    addLog('🍓 摘下一篮红艳欲滴、香气扑鼻的高糖草莓！小朵吃得满嘴通红，笑得像朵花一样！（口粮+'+foodGain+'，小朵心境大涨）', 'log-green');
    toast('采摘红心草莓！');
    render();
    return;
  }
  if(G.scrap < 18){ toast('零件不足18件'); return; }
  if(!useEnergy(2)) return;
  G.scrap -= 18;
  G.flags.hasStrawberry = true;
  G.crops.push({ id:G.crops.length+1, name:'高糖红心草莓', mature:3, growth:2, watered:true, icon:'🍓' });
  addLog('🍓 你与小朵亲手种下了一整排高糖草莓苗，细心架上竹竿，温室里多了一抹清新的甜香！', 'log-green');
  toast('成功繁育高糖草莓水培床');
  render();
}

function actUpgradeGreenhouse(){
  if(G.scrap < 25){ toast('废料零件不足25件'); return; }
  if(!useEnergy(2)) return;
  G.scrap -= 25;
  G.flags.greenhouseUpgraded = true;
  G.facilities.greenhouse++;
  addLog('🔬 安娜为你安装了全光谱多频植物补光灯与恒温热液泵，全温室作物生长效率永久提升35%！', 'log-amber');
  toast('温室基因与光合升级达成！');
  render();
}

  if(G.food < 4 || G.water < 2){ toast('食材不足 (需口粮×4, 纯净水×2)'); return; }
  if(!useEnergy(1)) return;
  G.food -= 4; G.water -= 2;
  for(var i=0; i<G.survivors.length; i++){
    G.survivors[i].mood = cl(G.survivors[i].mood + 15);
    G.survivors[i].health = cl(G.survivors[i].health + 8);

/* ================= 8. 每日结算与生存危机判定 ================= */
function nextDayCycle(){
  // 1. 消耗日常食物与水
  var totalPeople = G.survivors.length + 1; // 加上主角自己
  var reqFood = totalPeople * 2;
  var reqWater = totalPeople * 2;
  var reqPower = 5;

  G.food -= reqFood;
  G.water -= reqWater;
  G.power -= reqPower;

  // 滤网衰减
  G.airFilter = Math.max(0, G.airFilter - 3);
  if(G.airFilter < 20) G.radiation = cl(G.radiation + 10);

  // 作物自长
  for(var i=0; i<G.crops.length; i++){
    if(G.crops[i].watered) G.crops[i].growth = Math.min(G.crops[i].mature, G.crops[i].growth + 1);
  }

  // 时间推进
  G.day++;
  if(G.day % 15 === 0){
    G.seasonIdx = (G.seasonIdx + 1) % 4;
    addLog('🍂 四季流转！废土气候迈入【'+SEASONS[G.seasonIdx]+'】！', 'log-amber');
  }
  G.weather = WEATHER_LIST[Math.floor(Math.random()*WEATHER_LIST.length)];
  
  // 温馨度回血与精力计算
  var bonusEnergy = G.cozyScore >= 60 ? 1 : 0;
  G.energy = G.maxEnergy + bonusEnergy;

  // 随机日记记录
  recordDailyDiary();

  // 危机事件检查
  checkSurviveState();
  addLog('⏳ 第'+G.day+'日黎明破晓。全员消耗口粮'+reqFood+'、净水'+reqWater+'、电力'+reqPower+'度。天气：'+G.weather+'。', '');
  toast('新的一天开始了');
  render();
}

function checkSurviveState(){
  // 断粮危机
  if(G.food < 0){
    G.food = 0;
    for(var i=0; i<G.survivors.length; i++){
      G.survivors[i].health = cl(G.survivors[i].health - 18);
      G.survivors[i].mood = cl(G.survivors[i].mood - 20);
    }
    addLog('⚠️【严重饥荒】避难所断粮！同伴们饥肠辘辘，健康与心境受损！', 'log-rose');
  }
  // 断水危机
  if(G.water < 0){
    G.water = 0;
    for(var j=0; j<G.survivors.length; j++) G.survivors[j].health = cl(G.survivors[j].health - 22);
    addLog('⚠️【重度脱水】纯净水告罄！喉咙干裂，健康急剧受损！', 'log-rose');
  }
  // 断电危机
  if(G.power <= 0){
    G.power = 0;
    G.radiation = cl(G.radiation + 16);
    addLog('⚠️【全所断电】发电机燃料耗尽停机！地下温室与空气循环瘫痪，辐射涌入！', 'log-rose');
  }

  // 剧情阶段事件检查 (Act 1, 2, 3)
  checkStoryEvents();

  // 终局判定
  if(G.day >= 60 || (G.facilities.greenhouse >= 2 && G.flags.satelliteDecoded && G.cozyScore >= 50)){
    triggerVictoryCheck();
  }
}

// 废土微光尘埃浮动画布动画
function initDustCanvas(){
  var cvs = document.getElementById('dustCanvas');
  var ctx = cvs.getContext('2d');
  var w = cvs.width = window.innerWidth;
  var h = cvs.height = window.innerHeight;
  var particles = [];
  for(var i=0; i<35; i++){
    particles.push({
      x: Math.random()*w, y: Math.random()*h,
      r: Math.random()*1.8 + 0.5,
      vx: (Math.random()-0.5)*0.3, vy: -Math.random()*0.4 - 0.1,
      alpha: Math.random()*0.5 + 0.2
    });
  }
  function loop(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#d29922';
    for(var j=0; j<particles.length; j++){
      var p = particles[j];
      ctx.globalAlpha = p.alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if(p.y < 0) { p.y = h; p.x = Math.random()*w; }
      if(p.x < 0) p.x = w;
      if(p.x > w) p.x = 0;
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ================= 示波器波形画布动画 ================= */
var waveCanvasAnim = null;
function initWaveformCanvas(){
  var cvs = document.getElementById('radioWaveCanvas');
  if(!cvs) return;
  var ctx = cvs.getContext('2d');
  var w = cvs.width;
  var h = cvs.height;
  var step = 0;

  if(waveCanvasAnim) cancelAnimationFrame(waveCanvasAnim);

  function drawWave(){
    if(!document.getElementById('radioWaveCanvas')) return;
    ctx.fillStyle = 'rgba(3, 10, 6, 0.3)';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = audioOn ? '#39e58c' : '#1e7e4e';
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    var mid = h / 2;
    step += 0.08;
    for(var x = 0; x < w; x++){
      var amp = audioOn ? 10 : 3;
      var y = mid + Math.sin(x * 0.05 + step) * amp * Math.cos(x * 0.02);
      if(Math.random() < 0.02) y += (Math.random() - 0.5) * 6; // 微噪音
      if(x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    waveCanvasAnim = requestAnimationFrame(drawWave);
  }
  drawWave();
}

    '<button class="choice-btn" onclick="doGiftCompanion(\'ray\')">🥩 赠送雷诺：香煎厚切纯肉排（雷诺心境+20，今夜亲自值夜守卫）</button>'+
    '<button class="choice-btn" onclick="doGiftCompanion(\'dog\')">🍖 赠送大黑：整根带肉大棒骨（饱食+40，翻肚皮疯狂踩奶，精力+1）</button>'+
    '<button class="choice-btn" onclick="closeModal()">返回</button></div>';
  openModal('🎁 避难所温情赠礼', html);
}

function doGiftCompanion(cid){
  closeModal();
  if(cid === 'duo'){
    var duo = G.survivors.find(function(x){ return x.id==='duo'; });
    if(duo){ duo.mood = 100; duo.affection = cl(duo.affection + 15); }
    addLog('🍓 小朵咬着甜甜的草莓，大眼睛笑成了弯弯的月牙。小姑娘飞快地用彩色蜡笔画了一张你和她的画送给你：「哥哥最好了！」（小朵心境回满！）', 'log-green');
    toast('小朵开心地抱住了你');
  } else if(cid === 'anna'){
    var anna = G.survivors.find(function(x){ return x.id==='anna'; });
    if(anna){ anna.mood = cl(anna.mood + 22); anna.affection = cl(anna.affection + 12); }
    G.power = cl(G.power + 15);
    addLog('🔧 安娜眼里满是惊喜与光芒，红着脸收下齿轮，当晚便拿起扳手把整个避难所的线路重新梳理了一遍！（安娜心境+22，储备电力+15）', 'log-amber');
    toast('安娜精心维护了避难所');
  } else if(cid === 'chen'){
    var chen = G.survivors.find(function(x){ return x.id==='chen'; });
    if(chen){ chen.mood = cl(chen.mood + 20); chen.affection = cl(chen.affection + 12); }
    G.med = cl(G.med + 3);
    addLog('🍄 老陈欣慰抚须：「这可是难得的纯净药材！」老军医连夜用砂锅为你熬出一小瓶高效防辐射清露（药品+3）。', 'log-green');
    toast('老陈回赠防辐射药浆');
  } else if(cid === 'ray'){
    var ray = G.survivors.find(function(x){ return x.id==='ray'; });
    if(ray){ ray.mood = cl(ray.mood + 20); ray.affection = cl(ray.affection + 12); }
    G.flags.nightGuardActive = true;
    addLog('🥩 雷诺大口嚼着肉排，沉稳地握住战术弓：「队长，今夜由我雷诺全权守夜，保证连只变异蚊子都飞不进避难所。」（今夜必定安全无虞）', 'log-amber');
    toast('雷诺担任今夜警戒哨兵');
  } else {
    G.dog.hunger = 100;
    G.dog.love = cl(G.dog.love + 20);
    G.energy = Math.min(G.maxEnergy, G.energy + 1);
    addLog('🍖 大黑叼着大肉骨头开心地呜呜直叫，吃完跳上沙发把脑袋埋在你怀里蹭来蹭去，呼噜声响彻房间！（精力+1，黑子爱意满格）', 'log-green');
    toast('黑子开心极了！');
  }
  render();
}

/* ================= 战术夜袭互动防御指挥 ================= */
function triggerNightBattleModal(eventTitle, eventDesc, dmgPotential){
  if(G.flags.nightGuardActive){
    G.flags.nightGuardActive = false;
    addLog('🏹【哨兵狙杀】深夜外层有变异兽群接近，雷诺在视窗后三箭连珠精准狙杀头领，黑子发出震慑怒吼，敌群惊恐四散，未损分毫！', 'log-green');
    return;
  }

  var html = '<div class="story-box">'+
    '<b>🚨【深夜遭遇警报 · '+eventTitle+'】</b><br><br>'+
    eventDesc+'<br><br><b>防爆指挥官，请下达紧急防御部署指令：</b>'+
    '</div><div class="story-choices">'+
    '<button class="choice-btn" onclick="doNightDefend(\'emp\', '+dmgPotential+')">⚡ 启动外围高压电网与电磁冲击（消耗4度电，零损伤击退）</button>'+
    '<button class="choice-btn" onclick="doNightDefend(\'snipe\', '+dmgPotential+')">🎯 雷诺与黑子开启哨戒探照灯精准反击（精准击退，概率缴获战利品）</button>'+
    '<button class="choice-btn" onclick="doNightDefend(\'lock\', '+dmgPotential+')">🛡️ 锁死三道重型铅钢防爆门死守（工事吸收冲击，大门轻微受损）</button>'+
    '</div>';
  openModal('🚨 避难所紧急遭遇战', html);
}

function doNightDefend(type, dmgBase){
  closeModal();
  if(type === 'emp'){
    if(G.power >= 4){
      G.power -= 4;
      G.scrap += 15;
      addLog('⚡ 高压电弧与强电磁脉冲瞬间贯穿外围！夜袭兽群被当场电晕瘫痪，避难所毫发无损，顺手回收废料+15！', 'log-green');
      toast('电网全歼夜袭');
    } else {
      var d = Math.round(dmgBase * 0.5);
      G.shelterHp = Math.max(0, G.shelterHp - d);
      addLog('⚡ 储备电量不足，电网未能完全激发，防爆铅门承受了撞击（耐久损耗-'+d+'%）！', 'log-amber');
    }
  } else if(type === 'snipe'){
    var foodGain = ri(8, 14);
    G.food += foodGain;
    addLog('🎯 雷诺居高临下箭不虚发，大黑紧随其后猛冲捕猎！全歼夜袭狂兽，缴获高能新鲜口粮+'+foodGain+'份！', 'log-green');
    toast('战术反击大捷！');
  } else {
    var loss = Math.min(10, Math.round(dmgBase * 0.4));
    G.shelterHp = Math.max(0, G.shelterHp - loss);
    addLog('🛡️ 沉重防爆铅门牢牢挡住了外部疯狂撞击。除了外层装甲轻微凹陷（-'+loss+'%），全避难所安然度过危机。', 'log-cyan');
    toast('防爆闸门屹立不倒');
  }
  render();
}

</script>
