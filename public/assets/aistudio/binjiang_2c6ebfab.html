<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e9eef3">
<meta name="color-scheme" content="light">
<title>滨江市 · 打工人生</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:#2b3440;background:#e9eef3;line-height:1.55;font-size:14px;
  height:100%;overflow:hidden;}
body.s-spring{background:#eef7fb;}
body.s-summer{background:#eef9f1;}
body.s-autumn{background:#fbf3e9;}
body.s-winter{background:#eef2f8;}
.wrap{position:relative;max-width:1080px;margin:0 auto;
  padding:6px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:6px;overflow:hidden;}
.topbar{background:#fff;border:1px solid #cdd8e3;border-radius:12px;
  padding:8px 13px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 10px rgba(40,70,110,.08);}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:2px;color:#2f6fb0;}
.topbar h1 small{font-size:10px;color:#8a99a8;letter-spacing:1px;font-weight:normal;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:#eef3f8;border:1px solid #cdd8e3;border-radius:20px;
  padding:2px 10px;font-size:11.5px;color:#5a6a7a;white-space:nowrap;}
.chip b{color:#2f6fb0;font-weight:600;font-size:13px;}
.chip.warn{background:#fdeeee;border-color:#e0a0a0;color:#a03030;}
.main{flex:1;min-height:0;display:flex;gap:6px;overflow:hidden;}
.side{flex:0 0 250px;min-height:0;display:flex;overflow:hidden;}
.content{flex:1;min-height:0;display:flex;overflow:hidden;}
.panel{background:#fff;border:1px solid #cdd8e3;border-radius:12px;
  padding:10px 12px;box-shadow:0 2px 8px rgba(40,70,110,.07);
  display:flex;flex-direction:column;min-height:0;width:100%;}
.panel h3{font-size:12.5px;font-weight:600;letter-spacing:2px;color:#2f6fb0;
  border-bottom:1px dashed #cdd8e3;padding-bottom:5px;margin-bottom:7px;
  flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
.panel h3 em{font-style:normal;font-size:10.5px;color:#8a99a8;letter-spacing:0;}
.scene-mood{font-size:11px;color:#8a9bb0;margin:-3px 0 8px;line-height:1.5;flex-shrink:0;font-style:italic;}
.log-panel{flex:1;min-height:0;overflow:hidden;}
.log-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:12px;line-height:1.6;color:#4a5a6a;}
.log-body p{padding:2px 0;border-bottom:1px dotted #e4ecf3;word-break:break-word;}
.log-body p:last-child{border-bottom:none;}
.log-body .dt{color:#8a99a8;font-size:10.5px;margin-right:5px;}
.log-body .gd{color:#2e8b57;}
.log-body .bd{color:#c0392b;}
.log-body .gd2{color:#2f6fb0;}
.acts{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:6px;align-content:start;}
.act{display:flex;gap:7px;align-items:flex-start;
  background:#f7fafc;border:1px solid #cdd8e3;border-radius:10px;
  padding:8px 10px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:13px;color:#2b3440;transition:all .15s;-webkit-appearance:none;}
.act:hover{border-color:#4aa3df;background:#eef6fc;}
.act:active{transform:scale(.97);}
.act.off{opacity:.38;pointer-events:none;}
.act .ic{font-size:17px;line-height:1.1;flex-shrink:0;}
.act .bd2{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.act .t1{font-size:13px;letter-spacing:1px;}
.act .t2{font-size:10.5px;color:#8a99a8;line-height:1.3;}
.person{background:#f7fafc;border:1px solid #cdd8e3;border-radius:10px;
  padding:8px 10px;margin-bottom:6px;font-size:12.5px;}
.person .nm{display:flex;justify-content:space-between;margin-bottom:3px;}
.person .nm b{color:#2f6fb0;font-weight:600;}
.person .nm span{color:#8a99a8;font-size:11px;}
.bar{height:6px;background:#e4ecf3;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;background:#e15b8a;border-radius:4px;transition:width .3s;}
.nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;flex-shrink:0;
  background:#fff;border:1px solid #cdd8e3;border-radius:12px;
  padding:6px;box-shadow:0 2px 8px rgba(40,70,110,.07);}
.nav button{flex:1 1 auto;min-width:60px;font-family:inherit;font-size:12.5px;
  letter-spacing:1px;padding:8px 4px;border-radius:9px;cursor:pointer;
  background:#eef4fb;border:1px solid #cdd8e3;color:#4a5a6a;
  -webkit-appearance:none;transition:all .15s;}
.nav button:active{transform:scale(.96);}
.nav button.util{background:#e4ecf3;}
.mask{position:fixed;inset:0;background:rgba(30,45,60,.5);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border:1px solid #cdd8e3;border-radius:16px;
  padding:18px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto;
  box-shadow:0 10px 30px rgba(20,40,60,.25);}
.modal h2{font-size:15px;color:#2f6fb0;letter-spacing:2px;margin-bottom:10px;font-weight:600;}
.modal .desc{font-size:13px;color:#4a5a6a;margin-bottom:10px;}
.modal button.main-btn{font-family:inherit;font-size:14px;letter-spacing:2px;padding:11px 16px;
  cursor:pointer;background:#2f6fb0;color:#fff;border:none;border-radius:10px;width:100%;}
.story-choice{display:block;width:100%;font-family:inherit;font-size:13.5px;padding:12px 16px;text-align:left;
  background:linear-gradient(90deg,rgba(74,163,223,.12),rgba(74,163,223,.04));
  border:1px solid #cdd8e3;border-radius:10px;cursor:pointer;color:#2b3440;margin-bottom:8px;-webkit-appearance:none;}
.story-choice:active{background:rgba(74,163,223,.25);}
.qty-input{width:100%;padding:10px;border:1px solid #cdd8e3;border-radius:10px;
  font-family:inherit;font-size:16px;text-align:center;background:#f7fafc;color:#2b3440;}
#toastRoot{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:99;pointer-events:none;}
#toastRoot div{background:rgba(35,50,65,.93);color:#fff;font-size:13px;padding:9px 20px;
  border-radius:20px;opacity:0;transition:opacity .2s;margin-top:6px;}
#toastRoot div.show{opacity:1;}
#toastRoot div:not(.show){display:none;}
html,body{overscroll-behavior:none;}
.act,.nav button,.story-choice,.main-btn,input{touch-action:manipulation;}
/* ================= 移动端适配（手机优先） ================= */
@media (max-width:760px){
  .wrap{padding:4px;gap:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
  .topbar{padding:6px 9px;gap:4px 5px;flex-wrap:wrap;}
  .topbar h1{font-size:13px;letter-spacing:1px;flex-shrink:0;}
  .topbar h1 small{display:none;}
  /* 状态栏：多行完整显示，不再横向滚动 */
  .chips{flex:1 1 100%;flex-wrap:wrap;overflow:visible;min-width:0;
    justify-content:flex-start;align-content:flex-start;gap:4px;padding-bottom:0;}
  .chip{font-size:10.5px;padding:1px 7px;line-height:1.5;}
  .chip b{font-size:11.5px;}
  .main{flex-direction:column;gap:4px;}
  .content{order:1;flex:1;min-height:0;}
  .side{order:2;flex:0 0 24vh;max-height:24vh;}
  .panel{padding:7px 8px;}
  .panel h3{font-size:11.5px;margin-bottom:4px;padding-bottom:4px;letter-spacing:1px;}
  .panel h3 em{font-size:9.5px;}
  #actHead em{display:none;}
  .act .t2{white-space:normal;word-break:break-word;}
  .scene-mood{font-size:10px;margin:-2px 0 5px;}
  .acts{grid-template-columns:repeat(2,1fr);gap:4px;}
  .act{padding:6px 7px;gap:5px;border-radius:9px;}
  .act .ic{font-size:15px;}
  .act .t1{font-size:12px;letter-spacing:0;}
  .act .t2{font-size:9.5px;line-height:1.25;}
  #peoplePanel{max-height:24vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .person{padding:6px 8px;font-size:11.5px;margin-bottom:5px;}
  .log-body{font-size:11px;line-height:1.5;}
  .log-body p{padding:1px 0;}
  .nav{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;
    gap:4px;padding:5px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav button{flex:0 0 auto;min-width:0;white-space:nowrap;font-size:11.5px;
    padding:7px 10px;letter-spacing:0;}
  .modal{max-width:94vw;max-height:80vh;padding:14px;border-radius:14px;}
  .modal h2{font-size:14px;margin-bottom:8px;}
  .modal .desc{font-size:12.5px;margin-bottom:8px;}
  .story-choice{font-size:12.5px;padding:11px 13px;}
  #toastRoot{bottom:calc(84px + env(safe-area-inset-bottom));}
  #toastRoot div{font-size:12px;padding:8px 16px;}
}
/* 横屏 / 超矮屏 */
@media (max-height:480px){
  .side{flex:0 0 20vh;max-height:20vh;}
  #peoplePanel{max-height:20vh;}
  .nav button{padding:5px 8px;font-size:11px;}
}
/* 手机横屏：状态栏多行时再压缩一点，避免挤压内容区 */
@media (max-width:760px) and (max-height:480px){
  .topbar{padding:4px 8px;gap:3px 4px;}
  .topbar h1{font-size:12px;}
  .chip{font-size:9.5px;padding:0 6px;line-height:1.45;}
  .chip b{font-size:10.5px;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>滨江市 · 打工人生 <small>都市生存模拟</small></h1>
    <div class="chips" id="chips"></div>
  </div>
  <div class="main">
    <div class="side">
      <div class="panel log-panel">
        <h3>生活日志 <em id="cDate"></em></h3>
        <div class="log-body" id="logBody"></div>
      </div>
    </div>
    <div class="content">
      <div class="panel">
        <h3 id="actHead"></h3>
        <div class="scene-mood" id="sceneMood"></div>
        <div class="acts" id="actGrid"></div>
        <div id="peoplePanel" style="margin-top:8px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
  <div class="nav" id="nav"></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* ================= 工具 ================= */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pk(a){return a[Math.floor(Math.random()*a.length)];}
function cl(v,a,b){if(a===undefined)a=0;if(b===undefined)b=100;return Math.max(a,Math.min(b,v));}
function num(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
var XUN_NAME=['上旬','中旬','下旬'];
var SEASON={1:'winter',2:'winter',3:'spring',4:'spring',5:'spring',6:'summer',7:'summer',8:'summer',9:'autumn',10:'autumn',11:'autumn',12:'winter'};
var FLAVOR={
  work:['你把一个卡了三天的 bug 修好了，组长拍了下你肩膀。','你把需求文档重写了第三遍，终于过审。','你在会上硬着头皮汇报，手心全是汗。','你顺手帮实习生改了段代码，对方千恩万谢。','你把工位收拾了一遍，效率莫名高了些。','你替同事顶了一个下午的会，回来嗓子都哑了。'],
  study:['你把错题本翻到卷边。','你啃下了最难的那一章。','你对着网课记满三页笔记，手指发酸。','你在图书馆坐了一整天，抬头天都黑了。','你把一道题算了五遍，终于在第六遍算对。'],
  side:['你接了单代排队的活，站到腿麻。','你帮人代写了份材料，改到凌晨。','你跑了几趟同城急送，电动车半路没电了。','你摆摊卖了两小时，遇到个砍价的。','你替人搬了次家，腰差点闪了。'],
  rest:['你把攒了半年的剧一口气刷完。','你睡了个昏天黑地，醒来下午四点。','你窝在沙发上打了半天游戏，真爽。','你点了份外卖，边吃边看综艺，笑出声。'],
  gym:['你出了一身汗，感觉整个人都轻了。','你把器械区练了个遍，第二天酸得下不来床。','你在跑步机上跑完五公里，歌单循环了两遍。','你跟隔壁的人轮流用深蹲架，聊了两句。']
};
function flav(k){return FLAVOR[k]?pk(FLAVOR[k]):'';}
var SCENE_SEASON={
  home:{spring:'窗台的多肉抽出新芽，屋里飘着淡淡的花香。',summer:'空调嗡嗡响，桌上的西瓜切了一半。',autumn:'阳光斜斜照进来，楼下桂花的香气顺着窗缝钻进来。',winter:'暖气片烫手，窗外阴沉，你不太想出门。'},
  company:{spring:'窗外的玉兰开了，会议室里却还是那股速溶咖啡味。',summer:'空调开得很足，前台小姑娘穿着短袖喊冷。',autumn:'落地窗外银杏黄了，你却没空看一眼。',winter:'暖气烘得人犯困，键盘上的手有点僵。'},
  street:{spring:'街边的樱花开了，咖啡馆把桌椅搬到了人行道上。',summer:'蝉鸣震天，便利店门口的冰柜被抢空了一半。',autumn:'梧桐叶落了一地，踩上去沙沙响。',winter:'冷风往领口里钻，行人都缩着脖子快步走。'},
  wealth:{spring:'中介门店的玻璃上贴着新盘广告，销售笑得格外热情。',summer:'大厅冷气充足，看房的人却不多。',autumn:'门口摆着「金九银十」的易拉宝，中介嘴皮子磨得飞快。',winter:'年底了，中介说「现在不买，明年就涨」。'},
  hospital:{spring:'走廊里飘着消毒水味，挂号窗口排着长队。',summer:'空调开得很低，候诊区坐满了人。',autumn:'换季流感高发，儿科门口哭声一片。',winter:'急诊灯火通明，走廊里都是加床。'},
  hometown:{spring:'田埂上油菜花开了，爸妈在门口晒着太阳等你。',summer:'院子里的葡萄架结满了果，蝉在树上叫个不停。',autumn:'晒谷场上堆满金黄，空气里是稻香。',winter:'屋檐下挂着腊肉，灶膛的火烧得正旺。'},
  trip:{spring:'目的地漫山花海，朋友圈九宫格都不够发。',summer:'海边人挤人，但海风一吹什么都不想管了。',autumn:'层林尽染，随手一拍都是壁纸。',winter:'你去了个下雪的地方，第一次看见那么大的雪。'}
};
function sceneMood(p){var o=SCENE_SEASON[p];return o?(o[SEASON[G.month]]||''):'';}
function setPhase(p){G.phase=p;render();}

/* ================= 数据表 ================= */
var JOBS=[
  {name:'实习生',   salary:4000,  need:0},
  {name:'正式员工', salary:6500,  need:50},
  {name:'主管',     salary:9500,  need:70},
  {name:'经理',     salary:13500, need:92},
  {name:'总监',     salary:19000, need:115},
  {name:'高管',     salary:27000, need:140}
];
var HOUSE_PRICE=300000;
var INDUSTRIES=[
  {name:'互联网', mult:1.0},
  {name:'金融',   mult:1.3},
  {name:'制造业', mult:0.8},
  {name:'教培',   mult:0.95},
  {name:'国企',   mult:0.9}
];
function salaryNow(){return Math.round(JOBS[G.level].salary*G.indMult*(G.salaryPenalty||1));}
function c0(){return G.children.length?G.children[0].name:'孩子';}
function childName(){return pk(['小满','豆豆','糖糖','乐乐','康康','安安','一一','果果','年年','团团']);}
var NPC_DEFS=[
  {id:'lin', name:'林晓', title:'同组同事', via:'work',
   s15:'刚入职那周，她主动带你认了全组的工位和咖啡机：「以后有事喊我。」',
   s30:'项目熬夜时她递给你一杯热咖啡，说「别硬撑，效率比时长重要。」',
   s50:'项目庆功宴上，她悄悄把你不爱吃的香菜挑走了：「这个我帮你解决。」',
   s60:'下班路上她忽然说：「其实每次加班，我都是为了能和你多待一会儿。」',
   s75:'某个加完班的深夜，她问你：「如果有一天我们都累了，还能一起坐下来吃顿饭吗？」',
   s90:'她把一把钥匙放进你手心：「我租的房子到期了。要不要……一起找个更大的家？」',
   sMarried:'婚后你们约好：再忙也每周五一起做饭。哪怕只是煮泡面，也要面对面坐着吃。',
   sPet:'婚后你们一起给宠物铲屎、遛弯，拌嘴的次数反而少了：「家里有它，总能听见动静。」'},
  {id:'su',  name:'苏芮', title:'楼下咖啡师', via:'social',
   s15:'你第一次忘带手机，她帮你收好了：「下次别这么马大哈。」',
   s30:'你常点的那杯拿铁，杯套上多了一行手写字：「今天也要加油鸭。」',
   s50:'下雨天她多给你拉了一杯：「今天这杯算我请，看你淋的。」',
   s60:'打烊后她留在店里陪你聊天到深夜：「认识你之后，打烊的时间都变快了。」',
   s75:'她把店里的备用钥匙塞给你：「打烊后想坐坐就来，不用非得消费。」',
   s90:'她在你的拿铁拉花里画了一枚戒指：「这杯不要钱。但往后的人生，想请你多关照。」',
   sMarried:'婚后她辞了店里的班，和你合伙盘下了那家小店，招牌换成了你们俩的名字。',
   sPet:'婚后她把咖啡馆的角落留给你们的宠物，熟客都知道「那是老板娘的心头肉」。'},
  {id:'chen',name:'陈默', title:'健身教练', via:'gym',
   s15:'第一次上课他记错了你的名字，红着脸道歉了半天。',
   s30:'你卧推力竭时他稳稳护住杠铃：「没事，有我在。」',
   s50:'看你总吃外卖，他甩给你一份食谱：「照着吃，别再糊弄自己。」',
   s60:'深夜他发来消息：「看你最近状态不对。有事别一个人扛，我请你吃夜宵。」',
   s75:'他难得没提训练：「今天不练了。陪我去趟江边走走？」',
   s90:'他在私教课结束时单膝跪地，掏出戒指：「这辈子，让我一直护着你好吗？」',
   sMarried:'婚后的清晨，他不再当你是学员，而是把牛奶燕麦端到你床头。',
   sPet:'婚后他每天带你俩（你+宠物）一起去跑步，说「一家人都要健康」，谁也赖不掉。'},
  {id:'xu',  name:'许念', title:'图书馆常客', via:'study',
   s15:'你打瞌睡时，她轻轻把你滑落的笔帽盖好，没吵醒你。',
   s30:'你两道题卡了半小时，旁边的她递来一张写满推导过程的草稿纸：「这样会快一点。」',

/* ================= 日志/弹窗 ================= */
function addLog(msg,cls){
  if(!cls)cls='';
  var d=G.year+'年'+G.month+'月'+XUN_NAME[G.xun];
  G.logs.push({d:d,m:msg,c:cls});
  if(G.logs.length>400)G.logs.shift();
}
function drawLog(){
  var h='';
  for(var i=G.logs.length-1;i>=0;i--){
    var l=G.logs[i];
    h+='<p><span class="dt">'+l.d+'</span><span class="'+l.c+'">'+l.m+'</span></p>';
  }
  document.getElementById('logBody').innerHTML=h;
  var lb=document.getElementById('logBody');lb.scrollTop=0;
}
function toast(msg){
  var r=document.getElementById('toastRoot');
  var t=document.createElement('div');t.textContent=msg;t.className='show';
  r.appendChild(t);
  setTimeout(function(){t.className='';},1600);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},1900);
}
var modalOpen=false;
function openModal(title,html){
  modalOpen=true;
  document.getElementById('modalRoot').innerHTML=
    '<div class="mask"><div class="modal"><h2>'+title+'</h2>'+html+'</div></div>';
}
function closeModal(){modalOpen=false;document.getElementById('modalRoot').innerHTML='';render();}

/* ================= 开局取名 ================= */
function startGameNaming(){
  var html='<div class="desc">你只身来到滨江市。</div>'+
    '<div class="desc">看着逼仄的出租屋、拥挤的通勤地铁和陌生的一切，你深吸了一口气。</div>'+
    '<div class="desc">从今天起，你要在这座城市站稳脚跟。</div>'+
    '<div class="desc">请给自己取一个名字吧：</div>'+
    '<input type="text" id="playerNameInput" class="qty-input" maxlength="6" value="小滨">'+
    '<button class="main-btn" style="margin-top:10px" onclick="confirmPlayerName()">✅ 确 定</button>';
  openModal('【取 名】',html);
  setTimeout(function(){
    var inp=document.getElementById('playerNameInput');
    if(inp){inp.focus();inp.select();}
  },50);
}
function confirmPlayerName(){
  var inp=document.getElementById('playerNameInput');
  var nm=inp?inp.value.trim():'';
  if(!nm){toast('请输入名字');return;}
  if(nm.length>6)nm=nm.substring(0,6);
  G.me.name=nm;
  closeModal();render();autoSave();
}

function doAction(k){
  if(G.over||modalOpen)return;
  var a=ACTS[k];
  if(!a)return;
  if(a.cost&&G.money<a.cost){toast('钱不够（需'+num(a.cost)+'元）');return;}
  if(a.cost)G.money-=a.cost;
  a.run();
}
function findJob(){
  if(!G.unemployed||modalOpen)return;
  var m=G.me;
  m.mood=cl(m.mood-5);
  var need=JOBS[G.level].need;
  if(m.ability>=need){
    G.unemployed=false;G.warned=0;
    addLog('📨 面试通过！你回到了'+JOBS[G.level].name+'岗位（月薪'+num(JOBS[G.level].salary)+'元）。','gd2');
  }else if(G.level>0&&m.ability>=JOBS[G.level-1].need){
    G.level--;G.unemployed=false;G.warned=0;
    addLog('📨 几轮面试后，你接受了降一级的'+JOBS[G.level].name+'岗位（月薪'+num(JOBS[G.level].salary)+'元）。','gd2');
  }else{
    G.level=0;G.unemployed=false;G.warned=0;
    addLog('📨 投了几十份简历，最后只能从实习生重新做起。','bd');
  }
  advanceXun();
}
function pickSocialTarget(){
  var c=G.npcs.filter(function(n){return n.met&&!n.lover&&n.aff<100;});
  if(!c.length)return null;
  c.sort(function(a,b){return a.aff-b.aff;});
  return c[0];
}
function tryMeet(via){
  if(G.spouse)return;
  var pool=NPC_DEFS.filter(function(d){return d.via===via;});
  for(var i=0;i<pool.length;i++){
    var d=pool[i];
    var known=G.npcs.some(function(n){return n.id===d.id;});
    if(!known&&Math.random()<0.35){
      G.npcs.push({id:d.id,name:d.name,title:d.title,aff:10,met:true,lover:false});
      addLog('✨ 你认识了'+d.title+d.name+'。','gd2');
      openModal('【初识 · '+d.name+'】',
        '<div class="desc">'+d.name+'（'+d.title+'）走进了你的生活。</div>'+
        '<div class="desc">「初次见面，请多关照。」</div>'+
        '<button class="main-btn" onclick="closeModal()">🙂 认识一下</button>');
      return;
    }
  }
}

/* ================= 时间推进 ================= */
function advanceXun(){
  G.xun++;
  if(G.xun>2){
    G.xun=0;G.month++;
    monthSettle();
    if(G.month>12){G.month=1;G.year++;yearSettle();}
  }
  G.totalXun++;
  G.me.mood=cl(G.me.mood-1);
  checkBad();
  if(!G.over&&G.year>30)triggerEnd();
  render();autoSave();
}
function lifeCost(){return 1000+G.year*100+G.children.length*600;}
function monthSettle(){
  if(!G.unemployed){
    var base=salaryNow();
    var pay=base+G.perf*20;
    G.money+=pay;
    addLog('💰 发工资了（'+G.indName+'）：底薪'+num(base)+'+绩效'+num(G.perf*20)+'='+num(pay)+'元。','gd2');
    if(G.onProbation>0){
      if(G.perf<8){
        G.onProbation=0;G.level=Math.max(0,G.level-1);
        G.money-=salaryNow();
        addLog('⏳ 试用期没通过，你被退回'+JOBS[G.level].name+'岗位，还赔了违约金。','bd');
      }else{
        G.onProbation--;
        addLog('⏳ 试用期还剩'+G.onProbation+'个月，稳住了。','gd');
      }
    }
    if(G.perf<10){
      if(G.warned){
        fire('绩效连续垫底');
      }else{
        G.warned=1;
        addLog('⚠️ 领导找你谈话：这个月绩效太低，再这样下去要走「优化流程」了。','bd');
      }
    }else{
      G.warned=0;
    }
  }else{
    addLog('📉 你还在失业中，没有任何收入。','bd');
  }
  G.perf=0;
  if(G.house){
    addLog('🏠 自己的房子，不用交房租。','');
  }else{
    G.money-=G.rent;
    addLog('🏠 交房租 -'+num(G.rent)+'元。','bd');
  }
  var lc=lifeCost();
  G.money-=lc;
  addLog('🍜 日常生活开支 -'+num(lc)+'元。','');
  if(G.spouse){G.me.mood=cl(G.me.mood+5);}
  if(G.pregnant)G.me.mood=cl(G.me.mood+3);
  if(Math.random()<0.5)randomEvent();
  if(G.spouse&&!G.flags.crisisDone&&Math.random()<0.06)marriageCrisis();
  if(G.spouse&&G.children.length>0&&Math.random()<0.04)parentingEvent();
  if(G.pet){
    G.pet.hunger=cl(G.pet.hunger-18);
    if(G.pet.hunger<20){G.me.mood=cl(G.me.mood-5);addLog('😿 '+G.pet.name+'饿得直叫，你才想起没添粮。（心情-5）','bd');}
    else if(G.pet.love>=60){G.me.mood=cl(G.me.mood+3);}
    if(G.pet.love<20){G.me.mood=cl(G.me.mood-3);addLog('😔 '+G.pet.name+'最近有点躲着你。（心情-3）','bd');}
    G.pet.exp=(G.pet.exp||0)+2;
    var oStage=G.pet.stage||0;
    if(G.pet.exp>=120)G.pet.stage=2;else if(G.pet.exp>=40)G.pet.stage=1;
    if(G.pet.stage>oStage){G.me.mood=cl(G.me.mood+6);addLog('✨ '+G.pet.name+'好像更通人性了，眼睛里有了光。（成长 · 心情+6）','gd2');}
    if(G.pet.pregnant){
      G.pet.pregMonths=(G.pet.pregMonths||0)+1;
      if(G.pet.pregMonths>=3){
        G.pet.pregnant=false;G.pet.pregMonths=0;G.pet.love=cl(G.pet.love+15);G.pet.exp+=30;
        var bm=ri(500,1500);G.money+=bm;
        addLog('🐣 '+G.pet.name+'生了！一窝小'+G.pet.kind+'，你留一只作伴，其余送人还收了红包 +'+num(bm)+'元。','gd2');
      }
    }
  }
  if(G.spouse&&G.pet&&!G.flags.petSpouseDone&&Math.random()<0.12)petSpouseEvent();
}
function fire(reason){
  G.unemployed=true;G.warned=0;G.perf=0;
  G.me.mood=cl(G.me.mood-15);
  addLog('📦 '+reason+'，你被辞退了。收拾工位那天，没人敢跟你对视。（心情-15）','bd');
  addLog('⚠️ 失业期间没有工资，但房租和开销照旧。快找工作！','bd');
}
function yearSettle(){
  G.me.age++;
  if(!G.house){G.rent=Math.round(G.rent*1.05);addLog('📈 房东通知：明年房租涨到'+num(G.rent)+'元/月。','bd');}
  var base=salaryNow();
  var bonus=Math.round(base*Math.min(2,G.perfYear/40));
  if(bonus>0){G.money+=bonus;addLog('🧧 年终奖+'+num(bonus)+'元！','gd2');}
  G.perfYear=0;G.salaryPenalty=1;
  if(G.fixed>0){var fx=Math.round(G.fixed*0.025);G.money+=fx;addLog('🏦 定期存款利息 +'+num(fx)+'元。','gd');}
  if(G.pet){G.pet.age++;if(G.pet.age===12)addLog('🐾 '+G.pet.name+'不知不觉陪了你十二年，动作慢了些，却还是每天等你回家。','gd');}
  var lucky=ri(0,2000);
  if(lucky>0){G.money+=lucky;addLog('🎰 公司年会抽中'+num(lucky)+'元红包。','gd2');}
  else addLog('🎰 年会什么也没抽中，好歹吃了顿好的。（心情+4）','gd');
  G.me.mood=cl(G.me.mood+4);

}

function randomEvent(){
  var pool=EVENTS.filter(function(e){try{return e.c();}catch(err){return false;}});
  if(!pool.length)return;
  pk(pool).f();
}

/* ================= 风险与结局 ================= */
function checkBad(){
  if(G.over)return;
  if(G.me.health<10){
    G.over=true;
    showEnd('身体亮红灯','长年透支，你倒在了工位上。<br>病床上你终于想明白：<b>身体才是1，其余都是0。</b><br><br><b>—— 健康崩坏 · 游戏结束 ——</b>');
    return;
  }
  if(G.money<-20000){
    G.over=true;
    showEnd('债务危机','信用卡、网贷、借呗……窟窿再也填不上了。<br>你收拾行李，黯然离开了滨江市。<br><br><b>—— 负债离场 · 游戏结束 ——</b>');
    return;
  }
  if(G.me.mood<8){
    G.me.mood=35;G.money-=2000;
    addLog('🧠 你情绪崩溃了，请假看了心理医生（-2000元）。要注意休息。','bd');
  }
}
function triggerEnd(){
  G.over=true;
  var m=G.me;
  var spouseLine=G.spouse?('身边是'+G.spouse.name+'。'):'';
  if(G.money>=1000000){
    showEnd('财务自由','三十年，你从一间出租屋起家，攒下了'+num(G.money)+'元存款。<br>滨江市的车水马龙里，终于有了一盏真正属于你的灯。<br>'+spouseLine+'<br><br><b>—— 结局一 · 财务自由 ——</b>');
  }else if(G.level>=5){
    showEnd('打工人巅峰','你做到了'+JOBS[G.level].name+'，站在了写字楼的顶层。<br>只是偶尔路过便利店，还是会想起刚来那年吃过的热包子。<br>'+spouseLine+'<br><br><b>—— 结局二 · 打工人巅峰 ——</b>');
  }else if(G.house&&G.spouse&&G.children.length>0){
    showEnd('阖家美满','房子是你们的，家是你们的，孩子'+G.children.map(function(c){return c.name;}).join('、')+'也是你们的。<br>周末的菜市场和深夜的沙发，都装着实实在在的幸福。<br><br><b>—— 结局三 · 阖家美满 ——</b>');
  }else if(G.house&&G.spouse){
    showEnd('人生赢家','房子是你们的，家是你们的，存款'+num(G.money)+'元也是你们的。<br>周末的菜市场和深夜的沙发，都装着实实在在的幸福。<br><br><b>—— 结局四 · 人生赢家 ——</b>');
  }else if(G.house){
    showEnd('安家立业','你在这座城市有了自己的房子，存款'+num(G.money)+'元。<br>装修花了大半积蓄，但晚上回家亮起的那盏灯，值。<br><br><b>—— 结局四 · 安家立业 ——</b>');
  }else if(G.spouse&&G.money>=200000){
    showEnd('稳稳的幸福','没有大富大贵，但你们有小家、有存款'+num(G.money)+'元、有彼此。<br>周末逛逛菜市场，日子平平常常，也踏踏实实。<br><br><b>—— 结局五 · 稳稳的幸福 ——</b>');
  }else if(G.money>=300000){
    showEnd('孤身贵族','存款'+num(G.money)+'元，一个人也过得有声有色。<br>只是搬家的时候，没人帮你抬那张沙发。<br><br><b>—— 结局六 · 孤身贵族 ——</b>');
  }else if(G.level>=3){
    showEnd('中层骨干','你做到了'+JOBS[G.level].name+'，带起了自己的团队。<br>不上不下，但好歹在这座城市有了自己的位置。<br><br><b>—— 结局七 · 中层骨干 ——</b>');
  }else{
    showEnd('城市过客','三十年过去，你依然在租房，存款'+num(G.money)+'元。<br>滨江市很大，你来了，努力过，但好像从未真正留下。<br><br><b>—— 结局八 · 城市过客 ——</b>');
  }
}
function showEnd(title,text){
  G.over=true;
  document.getElementById('modalRoot').innerHTML=
    '<div class="mask"><div class="modal"><h2>'+title+'</h2><div class="desc">'+text+'</div>'+
    '<button class="main-btn" onclick="doRestart()">🔄 重 新 开 始</button></div></div>';
}

/* ================= 渲染 ================= */
function drawTop(){
  var jobChip=G.unemployed?'💼 <b>失业中</b>':'💼 <b>'+JOBS[G.level].name+'</b> 月薪'+num(JOBS[G.level].salary);
  var chips=[
    '💰 <b>'+num(G.money)+'</b>元',
    jobChip,
    '🏭 <b>'+G.indName+'</b>',
    '🧠 能力<b>'+G.me.ability+'</b>',
    '❤️ 健康<b>'+G.me.health+'</b>',
    '😊 心情<b>'+G.me.mood+'</b>',
    '🎂 '+G.me.age+'岁',
    '👵 父母<b>'+G.parents.health+'</b>',
    '👶 孩子×'+G.children.length,
    G.pet?('🐾 '+G.pet.name):'',
    G.house?'🏠 有房':'🏠 房租'+num(G.rent)
  ];
  chips=chips.filter(function(x){return x;});
  var h='';
  for(var i=0;i<chips.length;i++){
    var cls='chip';
    if(chips[i].indexOf('健康')>=0&&G.me.health<40)cls='chip warn';
    if(chips[i].indexOf('心情')>=0&&G.me.mood<25)cls='chip warn';
    if(chips[i].indexOf('失业')>=0)cls='chip warn';
    if(chips[i].indexOf('父母')>=0&&G.parents.health<40)cls='chip warn';
    h+='<span class="'+cls+'">'+chips[i]+'</span>';
  }
  document.getElementById('chips').innerHTML=h;
  document.getElementById('cDate').textContent='第'+G.year+'年 '+G.month+'月 '+XUN_NAME[G.xun];
  document.body.className='s-'+SEASON[G.month];
}
function drawNav(){
  var h='';
  for(var k in PAGES){
    h+='<button class="'+(G.page===k?'on':'')+'" onclick="go(\''+k+'\')">'+PAGES[k].icon+' '+PAGES[k].title+'</button>';
  }
  h+='<button class="util" onclick="showHelp()">❓</button>';
  h+='<button class="util" onclick="showGoal()">🎯</button>';
  h+='<button class="util" onclick="doRestart()">🔄</button>';
  document.getElementById('nav').innerHTML=h;
}
function drawActs(){
  var pg=PAGES[G.page];
  var phSuf=(G.page==='street')?(' · '+(G.phase==='day'?'☀️ 白天':'🌙 夜晚')):'';
  document.getElementById('actHead').innerHTML=pg.icon+' '+pg.title+' <em>'+pg.sub+phSuf+'</em>';
  var sm=document.getElementById('sceneMood');if(sm)sm.textContent=sceneMood(G.page);
  var h='';
  if(G.page==='street'){
    h+='<button class="act" onclick="setPhase(\'day\')"><span class="ic">☀️</span><span class="bd2"><span class="t1">白天出门</span><span class="t2">晨跑、逛商场</span></span></button>';
    h+='<button class="act" onclick="setPhase(\'night\')"><span class="ic">🌙</span><span class="bd2"><span class="t1">夜晚出门</span><span class="t2">夜市、江边夜景、酒吧</span></span></button>';
  }
  for(var k in ACTS){
    var a=ACTS[k];
    if(a.page!==G.page&&PAGE_ALIAS[a.page]!==G.page)continue;
    if(a.can&&!a.can())continue;
    if(a.ph&&a.ph!==G.phase)continue;
    var off=(a.cost&&G.money<a.cost)?' off':'';
    h+='<button class="act'+off+'" onclick="doAction(\''+k+'\')">'+
      '<span class="ic">'+a.ic+'</span><span class="bd2"><span class="t1">'+a.t1+'</span><span class="t2">'+a.t2+'</span></span></button>';
  }
  if(G.unemployed){
    h+='<button class="act" onclick="findJob()"><span class="ic">📨</span><span class="bd2">'+
      '<span class="t1">投简历找工作</span><span class="t2">花费一旬 · 能力决定能否复职</span></span></button>';
  }
  if(G.me.health<40){
    h+='<button class="act" onclick="seeDoctor()"><span class="ic">🏥</span><span class="bd2">'+
      '<span class="t1">去医院</span><span class="t2">健康+25 · '+(G.ins?'800':'2000')+'元</span></span></button>';
  }
  if(!G.house&&G.money>=HOUSE_PRICE){
    h+='<button class="act" onclick="buyHouse()"><span class="ic">🏠</span><span class="bd2">'+
      '<span class="t1">买房安家</span><span class="t2">全款'+num(HOUSE_PRICE)+'元，从此告别房租</span></span></button>';
  }
  document.getElementById('actGrid').innerHTML=h;
}
function drawPeople(){
  var h='<h3 style="margin-top:4px">人际关系</h3>';
  if(G.spouse){
    h+='<div class="person"><div class="nm"><b>💍 '+G.spouse.name+'</b><span>配偶 · '+G.spouse.title+'</span></div>'+
      '<div class="bar"><i style="width:100%"></i></div></div>';
  }
  if(G.pet){
    var pic=G.pet.kind==='猫'?'🐱':(G.pet.kind==='狗'?'🐶':'🐹');
    h+='<div class="person"><div class="nm"><b>'+pic+' '+G.pet.name+'</b><span>'+G.pet.kind+' · '+G.pet.age+'岁</span></div>'+
      '<div class="bar"><i style="width:'+cl(G.pet.love)+'%"></i></div>'+
      '<div style="font-size:10.5px;color:#8a99a8;margin-top:2px">好感 '+G.pet.love+'/100 · 饱食 '+G.pet.hunger+'/100</div></div>';
  }
  var met=G.npcs.filter(function(n){return n.met;});
  if(!met.length&&!G.spouse){
    h+='<div class="person" style="color:#8a99a8">还没有认识什么人。工作、学习、健身、副业、社交都可能遇见TA。</div>';
  }
  if(G.children.length){
    h+='<h3 style="margin-top:8px">孩子（'+G.children.length+'）</h3>';
    for(var k=0;k<G.children.length;k++){
      var c=G.children[k];
      h+='<div class="person"><div class="nm"><b>👶 '+c.name+'</b><span>'+(c.schoolChosen?'已上学':'学龄前')+' · '+c.age+'岁</span></div></div>';
    }
  }
  for(var i=0;i<met.length;i++){
    var n=met[i];
    var rel=n.lover?'恋人':(G.spouse&&G.spouse.name===n.name?'配偶':'朋友');
    h+='<div class="person"><div class="nm"><b>'+n.name+'</b><span>'+n.title+' · '+rel+'</span></div>'+
      '<div class="bar"><i style="width:'+cl(n.aff)+'%"></i></div>'+
      '<div style="font-size:10.5px;color:#8a99a8;margin-top:2px">好感 '+n.aff+'/100'+(n.aff>=60&&!n.lover&&!G.spouse?' · 可以表白了':'')+'</div></div>';
  }
  document.getElementById('peoplePanel').innerHTML=h;
}
function render(){
  drawTop();drawNav();drawActs();drawPeople();drawLog();
}
