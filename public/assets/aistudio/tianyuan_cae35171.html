<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="color-scheme" content="light">
<title>桃花村 · 古代田园经营</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{font-family:"KaiTi","STKaiti","Songti SC","PingFang SC","Microsoft YaHei",serif;
  color:#3d3228;background:#f2ece0;line-height:1.55;font-size:14px;
  height:100%;overflow:hidden;}
body.s-spring{background:#fdf2f5;}
body.s-summer{background:#eff8ec;}
body.s-autumn{background:#fdf3e2;}
body.s-winter{background:#eef3f9;}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#fx span{position:absolute;top:-40px;animation:fall linear infinite;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;
  padding:6px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:6px;overflow:hidden;}
.topbar{background:#fffcf7;border:1px solid #e2d5c1;border-radius:12px;
  padding:8px 13px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:space-between;
  box-shadow:0 2px 10px rgba(140,110,80,.08);flex-shrink:0;}
.topbar h1{font-size:16px;font-weight:normal;letter-spacing:3px;color:#8a5a3a;}
.topbar h1 small{font-size:10px;color:#a08e7c;letter-spacing:1px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{background:#f6efe3;border:1px solid #e2d5c1;border-radius:20px;
  padding:2px 10px;font-size:11.5px;color:#7a6552;white-space:nowrap;}
.chip b{color:#8a5a3a;font-weight:normal;font-size:13px;}
.chip.dad{background:#fdf0e0;border-color:#e8c890;color:#a87020;}
#musicBtn{cursor:pointer;user-select:none;}
#musicBtn:active{transform:scale(.95);}
.main{flex:1;min-height:0;display:flex;gap:6px;overflow:hidden;}
.side{flex:0 0 250px;min-height:0;display:flex;overflow:hidden;}
.content{flex:1;min-height:0;display:flex;overflow:hidden;}
.panel{background:#fffcf7;border:1px solid #e2d5c1;border-radius:12px;
  padding:10px 12px;box-shadow:0 2px 8px rgba(140,110,80,.07);
  display:flex;flex-direction:column;min-height:0;}
.panel h3{font-size:12.5px;font-weight:normal;letter-spacing:3px;color:#8a5a3a;
  border-bottom:1px dashed #e2d5c1;padding-bottom:5px;margin-bottom:7px;
  flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
.panel h3 em{font-style:normal;font-size:10.5px;color:#a08e7c;letter-spacing:0;}
.log-panel{flex:1;min-height:0;overflow:hidden;}
.log-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:12px;line-height:1.6;color:#5a4a3c;}
.log-body p{padding:2px 0;border-bottom:1px dotted #f0e8db;word-break:break-word;}
.log-body p:last-child{border-bottom:none;}
.log-body .dt{color:#a08e7c;font-size:10.5px;margin-right:5px;}
.log-body .gd{color:#3d8b4a;}
.log-body .bd{color:#c0392b;}
.log-body .gd2{color:#a06a1a;}
.log-body .pink{color:#c9618a;}
.log-body .gold{color:#b8834a;}
.acts-panel{flex:1;min-height:0;overflow:hidden;}
.acts-panel #pageHead{flex-shrink:0;}
.page-title{font-size:15px;letter-spacing:3px;color:#8a5a3a;margin-bottom:2px;}
.page-sub{font-size:11.5px;color:#a08e7c;margin-bottom:9px;letter-spacing:1px;}
.acts{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
  gap:6px;align-content:start;}
.act{display:flex;gap:7px;align-items:flex-start;
  background:#fffefb;border:1px solid #e2d5c1;border-radius:10px;
  padding:8px 10px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:13px;color:#3d3228;transition:all .15s;-webkit-appearance:none;}
.act:hover{border-color:#c9a88a;background:#fff9f0;}
.act:active{transform:scale(.97);}
.act.off{opacity:.38;pointer-events:none;}
.act .ic{font-size:17px;line-height:1.1;flex-shrink:0;}
.act .bd{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;}
.act .t1{font-size:13px;letter-spacing:1px;}
.act .t2{font-size:10.5px;color:#a08e7c;line-height:1.3;}
.act .t3{font-size:9.5px;color:#c08a5a;margin-top:1px;}
.plot-card{grid-column:1/-1;background:#fffefb;border:1px solid #e2d5c1;
  border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:6px;}
.plot-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
.plot-head b{font-weight:normal;color:#5a4a3c;letter-spacing:1px;}
.plot-head .stage{font-size:11px;color:#a08e7c;}
.plot-bar{height:7px;background:#ece2d3;border-radius:4px;overflow:hidden;}
.plot-bar i{display:block;height:100%;background:#7cb87c;border-radius:4px;transition:width .3s;}
.plot-acts{display:flex;gap:6px;flex-wrap:wrap;}
.plot-acts button{flex:1 1 auto;min-width:100px;font-family:inherit;font-size:12.5px;
  padding:7px 10px;border-radius:9px;border:1px solid #e2d5c1;background:#f6efe3;
  color:#5a4a3c;cursor:pointer;-webkit-appearance:none;}
.plot-acts button:active{background:#a86b3a;color:#fff;}
.plot-acts button.ready{background:#7a9a7a;color:#fff;border-color:#7a9a7a;}
.plot-acts button:disabled{opacity:.4;}
.acts-panel.special-mode #pageHead{flex:1;min-height:0;overflow-y:auto;padding-right:4px;}
.acts-panel.special-mode .acts{display:none!important;}
.acts-panel.special-mode #pageHead .panel{margin-bottom:8px;padding:10px 12px;}
.acts-panel.special-mode #pageHead .panel:last-child{margin-bottom:0;}
.family-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.family-actions .act{flex:1 1 140px;min-width:130px;}
.res-panel{flex-shrink:0;max-height:110px;overflow:hidden;}
.res-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:12px;}
.money{font-size:12px;color:#a06a1a;margin-bottom:6px;}
.money b{font-size:17px;font-weight:normal;}
.tags{display:flex;flex-wrap:wrap;gap:4px;}
.tags span{background:#f6efe3;border:1px solid #e2d5c1;border-radius:9px;
  padding:1px 8px;font-size:11px;color:#5a4a3c;}
.info-line{margin-top:5px;font-size:11px;color:#a08e7c;}
.nav{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
  background:#fffcf7;border:1px solid #e2d5c1;border-radius:12px;
  padding:6px;box-shadow:0 2px 8px rgba(140,110,80,.07);flex-shrink:0;}
.nav button{flex:1 1 auto;min-width:60px;font-family:inherit;font-size:12.5px;
  letter-spacing:1px;padding:8px 4px;border-radius:9px;cursor:pointer;
  background:#fbf5eb;border:1px solid #e2d5c1;color:#5a4a3c;
  -webkit-appearance:none;transition:all .15s;}
.nav button:active{transform:scale(.96);}
.nav button.on{background:#a86b3a;color:#fff;border-color:#a86b3a;}
.nav button.end{background:#7a9a7a;color:#fff;border-color:#7a9a7a;}
.nav button.util{background:#e8ddd0;border-color:#d6c8b8;}
.name-row{font-size:14.5px;letter-spacing:2px;color:#5a4a3c;margin-bottom:8px;}
.name-row .tag{font-size:10px;padding:1px 7px;border-radius:8px;
  background:#f6efe3;border:1px solid #e2d5c1;color:#8a5a3a;margin-left:5px;letter-spacing:0;}
.attr{margin-bottom:6px;}
.attr .lb{display:flex;justify-content:space-between;font-size:11.5px;color:#7a6552;margin-bottom:2px;}
.attr .lb b{color:#3d3228;font-weight:normal;font-size:12.5px;}
.bar{height:6px;background:#ece2d3;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s;}
.fam{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  font-size:12px;border-bottom:1px dotted #ece2d3;}
.fam:last-child{border-bottom:none;}
.fam .nm{color:#5a4a3c;min-width:60px;}
.fam .vt{display:flex;gap:8px;font-size:11px;color:#8a7a6a;}
.fam .vt b{font-weight:normal;}
.fam.gone{opacity:.5;}
.mask{position:fixed;inset:0;background:rgba(40,28,18,.5);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:14px;}
.modal{background:#fffdf8;border:1px solid #e2d5c1;border-radius:16px;
  max-width:520px;width:100%;max-height:84vh;overflow-y:auto;
  padding:18px 20px;box-shadow:0 18px 50px rgba(50,30,15,.4);}
.modal h2{font-size:17px;font-weight:normal;color:#8a5a3a;letter-spacing:4px;margin-bottom:12px;text-align:center;}
.modal .desc{font-size:12.5px;color:#8a7a6a;line-height:1.8;margin-bottom:10px;}
.shop-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 2px;border-bottom:1px dotted #ece2d3;font-size:13.5px;flex-wrap:wrap;gap:6px;}
.shop-row:last-of-type{border-bottom:none;}
.shop-row .pr{color:#a06a1a;font-size:12.5px;margin-right:8px;}
.shop-row .nm{flex:1;min-width:120px;}
.shop-row .btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.modal button.buy{font-family:inherit;font-size:12px;padding:4px 11px;border-radius:9px;
  cursor:pointer;background:#f6efe3;border:1px solid #e2d5c1;color:#5a4a3c;-webkit-appearance:none;}
.modal button.buy:active{background:#a86b3a;color:#fff;}
.modal button.buy:disabled{opacity:.35;cursor:not-allowed;}
.modal button.close{display:block;margin:14px auto 0;padding:8px 30px;border-radius:10px;
  cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:2px;
  background:#a86b3a;color:#fff;border:none;-webkit-appearance:none;}
.result-line{font-size:13px;padding:6px 0;border-bottom:1px dotted #ece2d3;line-height:1.6;}
.story-panel{background:linear-gradient(160deg,#fffdf8,#fdf5e8);
  border:1px solid #e8c890;border-radius:14px;padding:16px;margin-bottom:8px;}
.story-title{font-size:15px;color:#b8834a;letter-spacing:3px;
  text-align:center;margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px dashed #e8c890;}
.story-text{font-size:13.5px;color:#5a4a3c;line-height:2;letter-spacing:.5px;}
.story-text p{margin-bottom:8px;}
.story-text .em{color:#c9618a;}
.story-choices{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
.story-choice{font-family:inherit;font-size:13.5px;padding:12px 16px;text-align:left;
  background:linear-gradient(90deg,rgba(232,200,144,.15),rgba(232,200,144,.05));
  border:1px solid #e8c890;border-radius:10px;color:#5a4a3c;
  cursor:pointer;-webkit-appearance:none;transition:all .2s;position:relative;padding-left:32px;}
.story-choice::before{content:"▸";position:absolute;left:14px;color:#b8834a;}
.story-choice:hover,.story-choice:active{
  background:linear-gradient(90deg,rgba(232,200,144,.3),rgba(232,200,144,.15));
  border-color:#c9a860;}
.dad-panel{background:linear-gradient(160deg,#fff8ec,#fdf0d8);
  border:1px solid #d4a860;border-radius:14px;padding:16px;margin-bottom:8px;}
.dad-title{font-size:15px;color:#a87020;letter-spacing:3px;
  text-align:center;margin-bottom:10px;padding-bottom:8px;
  border-bottom:1px dashed #d4a860;}
.dad-text{font-size:13.5px;color:#5a4a3c;line-height:2;letter-spacing:.5px;}
.dad-text p{margin-bottom:8px;}
.dad-text .em{color:#a87020;font-weight:bold;}
.ending{text-align:center;padding:22px 8px;}
.ending h2{font-size:22px;letter-spacing:8px;color:#8a5a3a;margin-bottom:16px;font-weight:normal;}
.ending .sub{font-size:14px;color:#7a6552;line-height:2.1;letter-spacing:1px;}
#toast{position:fixed;left:50%;top:12%;transform:translate(-50%,-12px);
  background:rgba(55,38,25,.93);color:#fff;font-size:13px;padding:9px 20px;
  border-radius:20px;z-index:99;opacity:0;pointer-events:none;transition:all .25s;
  letter-spacing:1px;white-space:nowrap;}
#toast.show{opacity:1;transform:translate(-50%,0);}
.save-slot{border:1px solid #e2d5c1;border-radius:10px;padding:10px;margin-bottom:8px;
  background:#fdfaf4;display:flex;justify-content:space-between;align-items:center;
  gap:8px;font-size:12.5px;flex-wrap:wrap;}
.save-slot .info{flex:1;min-width:120px;}
.save-slot .info b{color:#8a5a3a;}
.save-slot button{font-family:inherit;font-size:12px;padding:4px 12px;border-radius:8px;
  border:1px solid #e2d5c1;background:#fff;cursor:pointer;}
.save-slot button:active{background:#a86b3a;color:#fff;}
.save-slot.auto{background:linear-gradient(160deg,#fdf5e0,#faeccc);border-color:#e8c890;}
.save-slot.auto .info b{color:#a87020;}
.npc-card{border:1px solid #e2d5c1;border-radius:12px;padding:11px 13px;
  margin-bottom:10px;background:#fffefb;}
.npc-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.npc-card .head b{font-size:14.5px;font-weight:normal;color:#8a5a3a;letter-spacing:1px;}
.npc-card .head .tt{font-size:11px;color:#a08e7c;}
.npc-card .info{font-size:11.5px;color:#8a7a6a;margin-bottom:8px;line-height:1.6;}
.npc-card .btns{display:flex;gap:6px;flex-wrap:wrap;}
.npc-card .btns button{flex:1 1 auto;min-width:80px;font-family:inherit;font-size:12px;
  padding:6px 8px;border-radius:9px;border:1px solid #e2d5c1;background:#f6efe3;
  color:#5a4a3c;cursor:pointer;-webkit-appearance:none;}
.npc-card .btns button:active{background:#a86b3a;color:#fff;}
.pet-card{border:1px solid #e2d5c1;border-radius:12px;padding:11px 13px;
  margin-bottom:10px;background:#fffefb;text-align:center;}
.pet-card .head{font-size:14.5px;color:#8a5a3a;margin-bottom:6px;}
.pet-card .pet-icon{font-size:36px;margin:6px 0;}
.pet-card .info{font-size:11.5px;color:#8a7a6a;line-height:1.6;margin-bottom:8px;}
.pet-card .btns{display:flex;gap:6px;flex-wrap:wrap;}
.pet-card .btns button{flex:1 1 auto;min-width:70px;font-family:inherit;font-size:12px;
  padding:6px 8px;border-radius:9px;border:1px solid #e2d5c1;background:#f6efe3;
  color:#5a4a3c;cursor:pointer;-webkit-appearance:none;}
.pet-card .btns button:active{background:#a86b3a;color:#fff;}
.qty-input{width:100%;padding:10px;font-size:16px;border:1px solid #e2d5c1;
  border-radius:8px;background:#fdfaf4;text-align:center;font-family:inherit;
  box-sizing:border-box;margin:6px 0;}
.qty-total{font-size:13px;color:#a87020;text-align:center;margin:10px 0;}
.qty-total b{font-size:15px;}
@media (max-width:700px){
  .wrap{padding:5px;gap:5px;}
  .topbar{padding:7px 11px;gap:5px;}
  .topbar h1{font-size:14px;letter-spacing:2px;}
  .topbar h1 small{font-size:9px;}
  .chip{font-size:10.5px;padding:2px 8px;}
  .chip b{font-size:12px;}
  .main{flex-direction:column;gap:5px;overflow:hidden;}
  .side{flex:0 0 auto;max-height:120px;overflow:hidden;}
  .content{flex:1;min-height:0;overflow:hidden;}
  .log-panel{max-height:120px;padding:8px 10px;overflow:hidden;}
  .acts-panel{padding:8px 10px;overflow:hidden;}
  .log-body{font-size:11px;line-height:1.5;}
  .page-title{font-size:14px;}
  .page-sub{font-size:11px;margin-bottom:7px;}
  .acts{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:5px;}
  .act{padding:7px 8px;gap:6px;}
  .act .ic{font-size:15px;}
  .act .t1{font-size:12px;}
  .act .t2{font-size:10px;}
  .act .t3{font-size:9px;}
  .res-panel{max-height:95px;padding:7px 10px;}
  .res-panel h3{font-size:11.5px;margin-bottom:5px;padding-bottom:4px;}
  .money{font-size:11px;margin-bottom:4px;}
  .money b{font-size:15px;}
  .tags span{font-size:10.5px;padding:1px 7px;}
  .info-line{font-size:10px;margin-top:3px;}
  .nav{padding:5px;gap:4px;}
  .nav button{font-size:11.5px;padding:7px 3px;min-width:54px;}
  .panel{border-radius:10px;}
}
@media (max-width:380px){
  .acts{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body class="s-winter">
<div id="fx"></div>
<div class="wrap">
  <div class="topbar">
    <h1>桃 花 村<small> 田园经营录</small></h1>
    <div class="chips">
      <span class="chip" id="cDate">第一年 一月 上旬</span>
      <span class="chip" id="cSeason">冬季</span>
      <span class="chip">饱腹 <b id="cSat">60</b></span>
      <span class="chip" id="cAction">活动 <b>0</b>/8</span>
      <span class="chip dad" id="cDad" style="display:none;">📜 寻父 <b>0</b>/5</span>
      <span class="chip" id="cJunZhu" style="display:none;">👑 明华郡主</span>
      <span class="chip" id="musicBtn" onclick="toggleMusic()" style="cursor:pointer;">🎵 音乐开</span>
    </div>
  </div>

  <div class="main">
    <div class="side">
      <div class="panel log-panel">
        <h3>事 迹 记 录</h3>
        <div class="log-body" id="logBox"></div>
      </div>
    </div>
    <div class="content">
      <div class="panel acts-panel" id="actsPanel">
        <div id="pageHead"></div>
        <div class="acts" id="acts"></div>
      </div>
    </div>
  </div>

  <div class="panel res-panel">
    <h3>物 资</h3>
    <div class="res-body" id="pRes"></div>
  </div>

  <div class="nav" id="nav"></div>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<audio id="bgm" src="https://pdftourl.net/audio/1792830438962-3a72cef3-2063-4781-9bc9-871c14625791.mp3" loop></audio>
<script>
/* ========== 音乐控制 ========== */
var musicOn = true;
var bgmAudio = null;
function initBGM(){
  bgmAudio = document.getElementById('bgm');
  if(bgmAudio){
    bgmAudio.volume = 0.35;
    bgmAudio.loop = true;
  }
}
function startBGM(){
  if(!musicOn) return;
  if(!bgmAudio) initBGM();
  if(bgmAudio){
    var p = bgmAudio.play();
    if(p && p.catch) p.catch(function(){});
  }
}
function stopBGM(){
  if(bgmAudio){
    bgmAudio.pause();
  }
}
function toggleMusic(){
  musicOn = !musicOn;
  if(musicOn){ startBGM(); } else { stopBGM(); }
  updateMusicBtn();
}
function updateMusicBtn(){
  var btn = document.getElementById('musicBtn');
  if(btn){
    btn.textContent = musicOn ? '🎵 音乐开' : '🔇 音乐关';
  }
}
initBGM();
updateMusicBtn();

/* ========== 工具 ========== */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pk(a){return a[Math.floor(Math.random()*a.length)];}
function cl(v,a,b){if(a===undefined)a=0;if(b===undefined)b=100;return Math.max(a,Math.min(b,v));}
function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
var SEASON_NAME={spring:'春季',summer:'夏季',autumn:'秋季',winter:'冬季'};
var XUN_NAME=['上旬','中旬','下旬'];
var MAX_ACTIONS_PER_XUN=8;
var XUN_PER_YEAR=12;
function seasonOf(m){if(m>=3&&m<=5)return 'spring';if(m>=6&&m<=8)return 'summer';if(m>=9&&m<=11)return 'autumn';return 'winter';}

/* ========== 剧情队列（修复剧情覆盖） ========== */
var StoryQueue = [];
var _storyProcessing = false;
function pushStory(fn){
  StoryQueue.push(fn);
  setTimeout(processStoryQueue, 30);
}
function processStoryQueue(){
  if(_storyProcessing) return;
  if(!StoryQueue.length) return;
  if(G && G.over){ StoryQueue = []; return; }
  if(document.getElementById('modalRoot').innerHTML) return;
  _storyProcessing = true;
  var fn = StoryQueue.shift();
  try{ fn(); }catch(e){}
  _storyProcessing = false;
  if(StoryQueue.length) setTimeout(processStoryQueue, 50);
}

/* ========== 常量 ========== */
var ANIMAL_INFO={
  chicken:{name:'鸡',icon:'🐔',mature:2},
  cow:{name:'牛',icon:'🐮',mature:4},
  sheep:{name:'羊',icon:'🐑',mature:3},
  pig:{name:'猪',icon:'🐷',mature:5}
};

      text:'李元宝站在你家门口，手里攥着什么东西，脸涨得通红。<br><br>「你、你出来一下。」<br><br>你走出去。<br><br>他深吸一口气，像是用了很大的力气：「我、我喜欢你。」<br><br>说完赶紧低下头，声音小得几乎听不见：「我知道我傻。我知道我配不上你。可我……」<br><br>他忽然抬起头，眼睛亮晶晶的：「可我会对你好。一辈子。谁欺负你我打谁。你让我干什么我干什么。」<br><br>「元宝……」<br><br>「你别急着拒绝我。」他把手里的东西塞给你——是一块小小的、刻着"宝"字的木牌，「你拿着。什么时候想好了，什么时候告诉我。」<br><br>说完转身就跑了，跑得飞快，背影里透着傻气，也透着真心。',
      choices:[{text:'握着木牌，笑了。',aff:8,iq:2,health:2},{text:'「元宝，别跑，我又没说不答应。」',aff:10,iq:2,health:2}]},
    preg:{title:'给孩子打一把小木马',
      text:'你把消息告诉李元宝，他先是愣愣地看你，又看了看你的肚子，忽然一屁股坐在地上，哇哇大哭起来。<br><br>「你怎么了？」你慌了。<br><br>「我、我太高兴了。」他抹着眼泪，鼻涕都出来了，「从来没人这么喜欢过我，你还愿意跟我生孩子……」<br><br>他哭够了，忽然爬起来就往外跑。<br><br>「你去哪？」<br><br>「去镇上！我要给娃娃买木头！」<br><br>第二天，他抱着一大捆木料回来，在院子里叮叮当当敲了一整天。到晚上，举着一个歪歪扭扭的小木马跑进来，献宝似的递到你面前。<br><br>「你看！给孩子的！」<br><br>你接过来看，木马雕得四只脚都不一样长，马头歪到一边。你忍不住笑。<br><br>「难看是不是？」他挠头，有些泄气。<br><br>「好看。」你把木马抱在怀里，「是天下最好看的小木马。」<br><br>他立刻又咧嘴笑了，傻里傻气的：「那我再雕一个！给娃娃雕一整个木马阵！」',
      choices:[{text:'「好，慢慢雕，不着急。」',aff:10,iq:1,health:2},{text:'「元宝，你以后一定是个好爹。」',aff:8,iq:1,health:2}]}
  },
  '柳三郎':{
    s30:{title:'醉后真言',
      text:'你在村口的老酒馆里找到柳三郎。<br><br>他喝得半醉，衣冠不整，平时那副风流公子的模样荡然无存。<br><br>「你怎么来了？」他斜眼看你，笑得敷衍。<br><br>「路过。」<br><br>他嗤笑一声，又给自己倒了一杯：「你们都觉得我是个纨绔。是啊，我是。家里把我送来这犄角旮旯的地方，美其名曰养病。其实就是嫌我碍事。」<br><br>他仰头饮尽：「我这辈子，大概就这么废了。」<br><br>你没接话，只是把他手边的酒壶拿开了。<br><br>他愣了一下，看着空荡荡的手，忽然就安静了。',
      choices:[{text:'「酒喝多了伤身。」',aff:5,iq:0,health:0},{text:'「你还没废，只是你自己先放弃了。」',aff:8,iq:1,health:0}]},
    s60:{title:'家族之痛',
      text:'柳三郎今天罕见地清醒。<br><br>他坐在村口的大石头上，望着远处的山。<br><br>「我是家里第三个儿子。」他忽然开口，「上头有能干的大哥二哥，轮不到我。我娘去得早，没人管我。我爹……他连骂我都懒得骂。」<br><br>他转过头看你：「你知道最难受的是什么吗？不是不被爱，是根本没人在乎你是谁。」<br><br>你静静地听着。<br><br>他忽然笑了，笑得有些自嘲：「所以我干脆破罐子破摔。反正怎么样都没人在乎。」<br><br>「我在乎。」你说。<br><br>他愣住，随即别过脸去，声音闷闷的：「……别胡说。」',
      choices:[{text:'「我说的是真的。」',aff:8,iq:2,health:1},{text:'「所以你也别放弃自己。」',aff:10,iq:2,health:0}]},
    s90:{title:'表白',
      text:'柳三郎一改往日那副懒散的样子，穿得整整齐齐站在你门前。<br><br>「有事？」你问。<br><br>他把一个檀木盒子递过来，打开——里面是一支金步摇，做工极精，一看就是京城里才能买到的东西。<br><br>「这是我让人从京城带来的。」他说，声音比平时认真许多，「我知道你不在乎这些。但我想给你。」<br><br>「柳三郎……」<br><br>「你听我说完。」他打断你，「我这辈子浑浑噩噩过了二十年。除了喝酒、逗趣、惹是生非，什么都不会。」<br><br>他看着你：「可遇见你以后，我想做点正经事了。想让人看得起我，也想……配得上你。」<br><br>他顿了顿，低声问：「你说，我来得及吗？」',
      choices:[{text:'「来得及。慢慢来。」',aff:8,iq:2,health:2},{text:'「柳三郎，你早该这么说了。」',aff:10,iq:2,health:2}]},
    preg:{title:'浪子回头',
      text:'柳三郎听说你有了身孕，先是发呆，然后猛地站起来，在屋里来回踱步，忽然又停下，瞪着你。<br><br>「真的？」<br><br>「真的。」<br><br>他张了张嘴，忽然骂了一句：「操。」<br><br>你愣住了。柳三郎一向慵懒，从不这样失态。他背过身，肩膀抖了一下，再转回来时，眼睛有些红。<br><br>「我这个人，什么都不会。」他声音低哑，「喝花酒会，赌钱会，惹我爹生气会。当爹……不会。」<br><br>他忽然把桌上的酒壶拿起来，走到门口，狠狠摔在地上。<br><br>啪的一声脆响，屋里静了下来。<br><br>「从今天起，我柳三郎戒酒。」他回头看你，一字一顿，「我要当爹了。孩子不能有个醉鬼爹。」<br><br>「你……」<br><br>他忽然又变回那个爱开玩笑的柳三郎，只是这回笑里带着认真：「怎么，不信？我说到做到。往后谁再叫我纨绔，我跟他急。」',
      choices:[{text:'「我信你一回。」',aff:10,iq:2,health:2},{text:'「戒不掉也不要紧。」',aff:8,iq:1,health:1}]}
  },
  '赵铁柱':{
    s30:{title:'山中遇险',
      text:'你进山采药，不小心滑下山坡，扭伤了脚。<br><br>天色渐暗，你挣扎着爬不起来。<br><br>就在这时，一个高大的身影从树丛里钻出来——是赵铁柱。<br><br>「你怎么在这儿？」他眉头一皱，蹲下身查看你的脚踝，动作却轻柔得很。<br><br>「别动。」他把你背到背上，「山里晚上有野兽，你一个人太危险。」<br><br>你趴在他背上，闻到他衣服上松木和草木的味道。<br><br>一路无言，到了村口他才把你放下，憋出一句：「以后别一个人进山。」<br><br>说完转身就走，耳朵有点红。',
      choices:[{text:'「谢谢你。」',aff:5,iq:0,health:1},{text:'「下次进山，叫上我。」',aff:8,iq:1,health:1}]},
    s60:{title:'铁汉柔情',
      text:'赵铁柱今天没去打猎。<br><br>他坐在你家院门口劈柴，一下一下，动作沉稳。<br><br>「今天怎么不去了？」你问。<br><br>他停下手里的动作：「你家的柴快没了。」<br><br>你愣了一下。<br><br>他低着头继续劈柴，声音闷闷的：「你一个女人，带着生病的娘，还有弟弟妹妹。我……反正我也是一个人。」<br><br>他顿了顿：「我一个人打猎，打多少是多少。多劈点柴给你，也不耽误什么。」<br><br>你看着他结实的背影，忽然觉得心里很暖。',
      choices:[{text:'「那我陪你一起劈。」',aff:8,iq:1,health:1},{text:'「以后我们搭伙过日子吧。」',aff:10,iq:1,health:2}]},
    s90:{title:'表白',
      text:'赵铁柱在你家院门口站了很久，才敲了敲门。<br><br>他手里拎着一只野兔，是刚打的。<br><br>「给你。」他把兔子塞给你，转身要走。<br><br>「赵铁柱。」你叫住他。<br><br>他停住脚步，没转身。<br><br>「你是不是有话要说？」<br><br>他背对着你，肩膀绷得紧紧的。半晌，他才闷声说：「我不会说话。」<br><br>「那你就慢慢说。」<br><br>他转过身，脸上是难得的认真：「我想照顾你。一辈子。我没什么本事，但我有力气。能打猎，能劈柴，能护着你。」<br><br>「你愿意吗？」<br><br>他问得笨拙，耳朵红透了。',
      choices:[{text:'「愿意。」',aff:8,iq:2,health:2},{text:'「赵铁柱，你早该说了。」',aff:10,iq:2,health:2}]},
    preg:{title:'猎一只鹿来',
      text:'赵铁柱听你说完，一个字都没说，转身就出了门。<br><br>你追到门口，他已经提着弓进了山。<br><br>天黑了，他还没回来。你坐在灯下等，心里发慌。<br><br>半夜，门被推开。赵铁柱扛着一头鹿进来，肩上还有一道血口子，脸上的泥都没擦。<br><br>「你疯了？这么晚进山！」<br><br>他把鹿放下，挠了挠头，难得有些局促：「我……我不知道该说什么。」<br><br>「所以你就去猎鹿？」<br><br>「我想着，」他低着头，声音闷闷的，「有孕的人得补身子。我娘当年怀着我的时候，我爹就给她猎鹿吃。」<br><br>他顿了顿，抬起眼看你：「我没什么别的东西给你。鹿肉，管够。」<br><br>你看着他肩上那道口子，忽然说不出话。<br><br>他以为你不高兴，慌了：「我、我明天就把鹿处理好，肉都留给你，鹿皮给你做件袄子，鹿角……」<br><br>「赵铁柱。」<br><br>「嗯？」<br><br>「先把你自己的伤治了。」',
      choices:[{text:'拉他坐下，替他上药。',aff:10,iq:1,health:2},{text:'「以后进山，叫上我。」',aff:8,iq:1,health:1}]}
  },
  '神秘男子':{
    s30:{title:'深夜来访',
      text:'半夜，你被一阵敲门声吵醒。<br><br>打开门，是他。<br><br>风衣上还沾着夜露，脸色不太好。<br><br>「这么晚了，有事吗？」<br><br>他站在门口，许久没有说话。<br><br>「我做了个梦。」他忽然说，「梦里有人叫我另一个名字。我不记得那个人是谁。」<br><br>他抬起头看你：「我总觉得，我忘了什么很重要的事。从很久以前开始。」<br><br>你想说什么，他却忽然摇头：「抱歉，打扰了。」<br><br>转身走进夜色里。<br><br>你在门口站了很久，直到看不见他的身影。',
      choices:[{text:'追出去送盏灯。',aff:7,iq:1,health:0},{text:'「想不起来就算了，慢慢来。」',aff:8,iq:1,health:0}]},
    s60:{title:'身份揭晓',
      text:'他把你叫到了河边。<br><br>手里拿着一块玉牌，上面刻着复杂的纹路。<br><br>「我记起来了。」他声音很轻，「我姓萧，是京城萧家的三公子。三年前被人陷害，流落在外。」<br><br>他抬头看你：「我一直以为自己只是个普通人。可看到你之后，我忽然想起来了。」<br><br>「想起什么？」<br><br>「想起我为什么会走到这个小镇。」他顿了顿，「我在等一个人。」<br><br>「等谁？」<br><br>他摇了摇头：「不是等人。是等一个机会。」<br><br>「我要回去。」他望着河面，声音很稳，「回去拿回本该属于我的东西。这些年，我一直在装傻。」<br><br>他转过头看你，眼里有歉疚：「对不起，我不该把你卷进我的事里。」<br><br>你看着他，忽然明白了——他不是个普通人。他要去的地方，也不是桃花村。',
      choices:[{text:'「那你想回去吗？」',aff:8,iq:2,health:1},{text:'「不管你是谁，我都认得你。」',aff:10,iq:2,health:1}]},
    s90:{title:'表白',
      text:'他来找你，穿得和平时一样——黑色长风衣，身姿挺拔。<br><br>但你注意到他腰间的佩玉换了。是极好的羊脂白玉，一看就是京里的物件。<br><br>「要走了？」你问。<br><br>他摇头。<br><br>「我不走了。」他说。<br><br>你愣住。<br><br>「京城那边的事，我已经处理好了。」他看着你，眼神平静而坚定，「我弟弟能掌事，不需要我。」<br><br>他往前一步，离你很近：「我这一辈子，前半段活在别人的算计里。后半段……」<br><br>他抬起手，轻轻碰了碰你的发梢：「我想活在你身边。」',
      choices:[{text:'「那就留下来吧。」',aff:8,iq:2,health:2},{text:'「我等这句话很久了。」',aff:10,iq:2,health:2}]},
    preg:{title:'从前不敢想的事',
      text:'他听到这个消息的时候，正在窗边看着外面的夜色。<br><br>他沉默了很久，久到你以为他不高兴。<br><br>「我从前……」他终于开口，声音很轻，「不敢想这些。」<br><br>「什么？」<br><br>「家。」他转过身，眼里映着灯火，「萧家三公子，从小见惯了算计，见惯了枕边人也能反目。我以为这辈子就是这样了，孤身一人，把该拿的拿回来，然后了此残生。」<br><br>他顿了顿：「直到遇见你。」<br><br>「如今我要当爹了。」他忽然笑了一下，那笑很浅，却前所未有地真，「说来可笑，我这双手什么风浪没见过，此刻却不知该放在哪里。」<br><br>你走过去，把他的手按在你小腹上。<br><br>他僵了一下，随即慢慢弯下腰，把耳朵贴过去，认真地听着。<br><br>半晌，他低声说：「什么都不用怕了。」<br><br>「嗯？」<br><br>「我萧家三郎，从今往后，只护着你们娘儿俩。」',
      choices:[{text:'「那我就把后半辈子交给你了。」',aff:10,iq:2,health:2},{text:'「萧三郎，记住你今天的话。」',aff:8,iq:2,health:1}]}
  },
  '江湖游侠':{
    s30:{title:'江湖恩怨',
      text:'你在村外的破庙里，看到了他。<br><br>他手臂上有一道伤口，血迹已经发黑。<br><br>「你受伤了。」<br><br>他抬眼看见是你，勉强笑了笑：「小伤。江湖上常有的事。」<br><br>你什么也没说，回家取了伤药来，替他处理伤口。<br><br>他一开始还想推辞，被你瞪了一眼，就乖乖不动了。<br><br>包好伤口，他靠在墙上喘了口气。<br><br>「多谢。」他说，「我叫秦暮。江湖上，没人叫这个名字很久了。」<br><br>「很多年了，我都快忘了自己是谁。」<br><br>你看着他，觉得那双眼睛里装着很多故事。',
      choices:[{text:'「那我就叫你秦暮吧。」',aff:6,iq:1,health:0},{text:'「有一天你会想起来的。」',aff:8,iq:1,health:1}]},
    s60:{title:'剑与远方',
      text:'他今天没带剑。<br><br>他靠在你家院墙上，仰头看着天。<br><br>「我十六岁离开家，跟着师父学剑。」他说，「师父说，剑客要断情。心里有牵挂，剑就慢了。」<br><br>他顿了顿：「可我最近发现，我剑慢了。」<br><br>「为什么？」<br><br>他转过头看你，没答。<br><br>你忽然明白了什么。<br><br>他轻轻笑了笑：「也许是因为，我心里多了个人。」<br><br>说完他起身要走。<br><br>「那你师父知道了会怎么说？」<br><br>他头也不回：「师父已经死了。现在我说了算。」',
      choices:[{text:'「那你就留在这儿吧。」',aff:8,iq:2,health:1},{text:'「剑慢一点，也没什么不好。」',aff:10,iq:2,health:1}]},
    s90:{title:'表白',
      text:'他把剑放在你家门口的石阶上。<br><br>「我决定了。」他说，「以后不走了。」<br><br>「那你的江湖呢？」<br><br>他笑了笑：「江湖就在这儿。有你的地方，就是我的江湖。」<br><br>他从怀里取出一枚玉佩，递给你：「这是我身上唯一值钱的东西。跟了我十几年。现在给你。」<br><br>你接过来，温润的玉在手心里。<br><br>「你不怕我弄丢了？」<br><br>他看着你，认真地说：「丢了也不要紧。我在，就够了。」<br><br>那天的风很温柔。',
      choices:[{text:'「说话算话。」',aff:8,iq:2,health:2},{text:'「秦暮，余生请多指教。」',aff:10,iq:2,health:2}]},
    preg:{title:'把剑收起来',
      text:'你把有孕的消息告诉秦暮，他沉默了一会儿，忽然起身，把挂在墙上的剑摘了下来。<br><br>「你做什么？」<br><br>他把剑仔仔细细擦了一遍，用布包好，塞进床底最里面。<br><br>「江湖上的人要是知道我有了家，有了孩子，就会拿你们来要挟我。」他坐回你身边，语气平静，「这道理我懂。」<br><br>「可你这一辈子都拿剑……」<br><br>「剑是死的。」他打断你，忽然伸手，很轻很轻地抚了抚你的头发，「你们是活的。」<br><br>他顿了顿，难得有些不好意思：「我秦暮闯荡江湖半辈子，刀口舔血，从来不怕。可今日听说你要生孩子，我怕了。」<br><br>「怕什么？」<br><br>「怕护不住你们。」他低声道，「这比什么刀山火海都吓人。」<br><br>说完，他忽然起身，去院子里劈柴了。你从窗口看出去，只见他一下一下劈得极认真，像是在跟什么人较劲。<br><br>那把剑，此后再没取出来过。',
      choices:[{text:'「有你在，我就什么都不怕。」',aff:10,iq:2,health:2},{text:'「秦暮，剑收着，人也收着。」',aff:8,iq:2,health:1}]}
  }

/* ========== 开局取名 ========== */
function startGameNaming(){
  var html = '<div class="story-panel">';
  html += '<div class="story-title">桃 花 村</div>';
  html += '<div class="story-text">';
  html += '<p>你逃荒到了桃花村。</p>';
  html += '<p>看着漏风的破屋，病重的娘亲，还有年幼的弟弟妹妹，你深吸了一口气。</p>';
  html += '<p>从今天起，你要撑起这个家了。</p>';
  html += '<p>请给自己取一个名字吧：</p>';
  html += '</div></div>';
  html += '<input type="text" id="playerNameInput" class="qty-input" maxlength="6" value="苏婉" style="font-size:18px;text-align:center;">';
  html += '<button class="buy" style="width:100%;padding:12px;margin-top:8px;font-size:14px;background:linear-gradient(135deg,#e8b878,#c8944a);color:#fff;border-color:transparent;" onclick="confirmPlayerName()">✅ 确 定</button>';
  openModal('【取 名】', html);
  setTimeout(function(){
    var inp=document.getElementById('playerNameInput');
    if(inp){inp.focus();inp.select();}
  },50);
  startBGM();
}
function confirmPlayerName(){
  var inp = document.getElementById('playerNameInput');
  var nm = inp ? inp.value.trim() : '';
  if(!nm){ toast('请输入名字'); return; }
  if(nm.length > 6) nm = nm.substring(0,6);
  G.me.name = nm;
  closeModal();
  render();
  autoSave();
}

/* ========== 日志 ========== */
function addLog(msg,cls){
  if(!cls)cls='';
  var d=G.year+'年'+G.month+'月'+XUN_NAME[G.xun];
  G.logs.unshift({m:msg,c:cls,d:d});
  if(G.logs.length>80)G.logs.pop();
}
function drawLog(){
  var box=document.getElementById('logBox');if(!box)return;
  var arr=[];
  for(var i=0;i<G.logs.length;i++){
    var L=G.logs[i];
    arr.push('<p><span class="dt">['+L.d+']</span><span class="'+L.c+'">'+L.m+'</span></p>');
  }
  box.innerHTML=arr.join('');
}

/* ========== 特效 ========== */
function spawnFx(season){
  var c=document.getElementById('fx');if(!c)return;c.innerHTML='';
  var map={winter:'❄',spring:'🌸',summer:'✿',autumn:'🍂'};
  var em=map[season]||'❄';var n=season==='summer'?14:22;
  var frag=document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var s=document.createElement('span');s.textContent=em;
    s.style.left=(Math.random()*100)+'%';s.style.animationDuration=(7+Math.random()*9)+'s';
    s.style.animationDelay=(-Math.random()*12)+'s';s.style.fontSize=(8+Math.random()*12)+'px';
    s.style.opacity=(0.25+Math.random()*0.5).toFixed(2);
    if(season==='summer')s.style.color='#e8b93a';
    frag.appendChild(s);
  }
  c.appendChild(frag);
}

/* ========== 吐司 ========== */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.className='show';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},1700);
}

function drawTop(){
  G.season=seasonOf(G.month);document.body.className='s-'+G.season;
  var yn=['一','二','三','四','五','六','七','八','九','十'];
  document.getElementById('cDate').textContent='第'+(yn[G.year-1]||G.year)+'年 '+G.month+'月 '+XUN_NAME[G.xun];
  document.getElementById('cSeason').textContent=SEASON_NAME[G.season];
  document.getElementById('cSat').textContent=G.me.satiety;
  var cAct=document.getElementById('cAction');
  if(cAct)cAct.innerHTML='活动 <b>'+(G.actionsThisXun||0)+'</b>/'+MAX_ACTIONS_PER_XUN;
  var cDad=document.getElementById('cDad');
  if(G.fatherQuest>0&&!G.dad.found){
    cDad.style.display='';
    cDad.innerHTML='📜 寻父 <b>'+G.fatherQuest+'</b>/5';
  }else if(G.dad.found){

  }else{

  }

  updateMusicBtn();
}

/* ========== 资源面板 ========== */
function drawRes(){
  var h='<div class="money">💰 <b>'+num(G.money)+'</b> 文</div>';
  var icons={糙米:'🍚',柴火:'🪵',蔬菜:'🥬',药材:'🌿',绣品:'🧵',鸡蛋:'🥚',兽肉:'🍖',种子:'🌱',肥料:'💩',牛奶:'🥛',羊毛:'🧶',猪肉:'🥩',牛肉:'🍖',羊肉:'🍗',草药种子:'🌿',书籍:'📖',木材:'🪵',石料:'🪨',鱼:'🐟'};
  var tags='';
  for(var k in G.store){if(G.store[k]>0)tags+='<span>'+(icons[k]||'')+k+' '+G.store[k]+'</span>';}
  if(!tags)tags='<span style="color:#c0392b">空空如也</span>';
  h+='<div class="tags">'+tags+'</div>';
  var houseName=(HOUSE_LEVELS[G.house]||HOUSE_LEVELS[0]).name;
  var ah='';
  for(var t in G.animals){
    if(G.animals[t]>0){
      var info=ANIMAL_INFO[t];var g=G.animalGrowth[t]||0;
      ah+=info.icon+info.name+'×'+G.animals[t]+'(成长'+g+'/'+info.mature+') ';
    }
  }
  if(!ah)ah='无';
  h+='<div class="info-line">田 '+G.plots.length+'/5 亩 · 房屋：'+houseName+'</div>';
  h+='<div class="info-line">动物：'+ah+(G.pet?' · 🐱'+G.pet.name+'（好感'+G.pet.affection+'）':'')+'</div>';
  var staff='';
  if(G.workers && G.workers.length) staff+='长工'+G.workers.length+'人 ';
  if(G.servants && G.servants.length) staff+='仆从'+G.servants.length+'人 ';
  if(staff){
    h+='<div class="info-line" style="color:#a87020;">'+staff+'（每旬工钱'+((G.workers.length+G.servants.length)*1000)+'文）</div>';
  }
  document.getElementById('pRes').innerHTML=h;
}

/* ========== 属性相关 ========== */
function attrRow(name,val,color){
  return '<div class="attr"><div class="lb"><span>'+name+'</span><b>'+val+'</b></div>'+
    '<div class="bar"><i style="width:'+cl(val)+'%;background:'+color+'"></i></div></div>';
}
function hpColor(v){if(v<30)return '#c0392b';if(v<60)return '#d68910';return '#3d8b4a';}
function famClickRow(who,nm,hp,iq,aff,dead,gone){
  if(dead)return '<div class="fam"><span class="nm">'+nm+'</span><span style="color:#a08e7c;font-size:11px;">已故</span></div>';
  if(gone)return '<div class="fam gone" style="cursor:default;"><span class="nm">'+nm+' (已离家)</span><span class="vt"><span style="color:#a08e7c;font-size:11px;">每月寄回1000文</span></span></div>';
  return '<div class="fam" style="cursor:pointer;" onclick="go(\''+who+'\')">'+
    '<span class="nm">'+nm+' ▶</span><span class="vt">'+
    '<span>健<b style="color:'+hpColor(hp)+'">'+hp+'</b></span>'+
    '<span>智<b>'+iq+'</b></span>'+
    '<span>情<b>'+aff+'</b></span></span></div>';
}

    for(var i=0;i<G.me.extraSpouses.length;i++) arr.push(G.me.extraSpouses[i]);

function isNpcSpouse(id){
  if(G.me && G.me.spouse && G.me.spouse.id===id) return true;
  if(G.me && G.me.extraSpouses){
    for(var i=0;i<G.me.extraSpouses.length;i++){
      if(G.me.extraSpouses[i].id===id) return true;
    }
  }
  return false;
}
function getSpouseByPageKey(who){
  if(who==='spouse') return G.me.spouse;
  if(/^spouse\d+$/.test(who)){

    if(n===0) return G.me.spouse;
    if(G.me.extraSpouses && G.me.extraSpouses[n-1]) return G.me.extraSpouses[n-1];
  }
  return null;
}

/* ========== 田地 ========== */
function renderPlotCard(idx){
  var p=G.plots[idx];
  var h='<div class="plot-card">';
  h+='<div class="plot-head"><b>🟫 第'+(idx+1)+'亩田</b>';
  if(!p.crop){
    h+='<span class="stage">未播种</span></div>';
    h+='<div class="plot-acts"><button onclick="openPlantPicker('+idx+')">🌱 播种（饱腹-8）</button></div>';
  }else{
    var info=CROP_INFO[p.crop];
    var matured=p.growth>=info.mature;
    if(matured){
      h+='<span class="stage" style="color:#3d8b4a;">✅ 已成熟（'+p.crop+'）</span></div>';
    }else{
      h+='<span class="stage">'+p.crop+' 生长中</span></div>';
      h+='<div class="plot-bar"><i style="width:'+Math.round(p.growth/info.mature*100)+'%"></i></div>';
      h+='<div style="font-size:11px;color:#a08e7c;">生长 '+p.growth+'/'+info.mature+(p.watered?'（已浇水）':'（未浇水）')+'</div>';
    }
    h+='<div class="plot-acts">';
    if(matured){
      h+='<button class="ready" onclick="doHarvest('+idx+')">🌾 收割（饱腹-8）</button>';
    }else if(!p.watered){
      h+='<button onclick="doWater('+idx+')">💧 浇水施肥（饱腹-5）</button>';
    }else{
      h+='<button disabled>等待成熟…</button>';
    }
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function openPlantPicker(idx){
  var canVeg=G.store.种子>=1;
  var canHerb=G.store.草药种子>=1;
  var html='<p class="desc">选择要播种的种子</p>';
  if(!canVeg&&!canHerb){
    html+='<p class="desc" style="color:#c0392b;">你没有任何种子，先去货郎那里买吧。</p>';
  }else{
    if(canVeg){
      html+='<div class="shop-row"><span class="nm">🌱 蔬菜种子（3旬成熟，产3-6份蔬菜）<br><span style="font-size:11px;color:#a08e7c;">现有'+G.store.种子+'份</span></span>'+
        '<button class="buy" onclick="plantPlot('+idx+',\'蔬菜\')">播种</button></div>';
    }
    if(canHerb){
      html+='<div class="shop-row"><span class="nm">🌿 草药种子（5旬成熟，产2-5份草药）<br><span style="font-size:11px;color:#a08e7c;">现有'+G.store.草药种子+'份</span></span>'+
        '<button class="buy" onclick="plantPlot('+idx+',\'草药\')">播种</button></div>';
    }
  }
  html+='<button class="close" onclick="closeModal()">返回</button>';
  openModal('播 种',html);
}
function plantPlot(idx,crop){
  var p=G.plots[idx];
  if(!p||p.crop){toast('这块地已经种了');closeModal();return;}
  if(G.me.satiety<8){toast('饱腹感不够');return;}
  var info=CROP_INFO[crop];
  if((G.store[info.seedKey]||0)<1){toast('没有对应的种子');return;}
  var before=G.logs.length;
  G.store[info.seedKey]--;
  G.me.satiety=cl(G.me.satiety-8);
  p.crop=crop;p.growth=0;p.watered=false;
  addLog('🌱 你在第'+(idx+1)+'亩田种下了'+crop+'。（饱腹-8）','gd');
  var newLogs=G.logs.slice(0,G.logs.length-before);
  closeModal();render();showActionLog(newLogs);
  autoSave();
}
function doWater(idx){
  var p=G.plots[idx];
  if(!p||!p.crop||p.watered){toast('无法浇水');return;}
  if(G.me.satiety<5){toast('饱腹感不够');return;}
  var before=G.logs.length;
  G.me.satiety=cl(G.me.satiety-5);
  p.watered=true;p.growth=Math.min(p.growth+1,CROP_INFO[p.crop].mature);
  addLog('💧 你给第'+(idx+1)+'亩田浇了水、施了肥。（饱腹-5）','gd');
  var newLogs=G.logs.slice(0,G.logs.length-before);
  render();showActionLog(newLogs);
  autoSave();
}
function doHarvest(idx){
  var p=G.plots[idx];
  if(!p||!p.crop)return;
  var info=CROP_INFO[p.crop];
  if(p.growth<info.mature){toast('还没成熟');return;}
  if(G.me.satiety<8){toast('饱腹感不够');return;}
  var before=G.logs.length;
  G.me.satiety=cl(G.me.satiety-8);
  var y=ri(info.yieldMin,info.yieldMax)+Math.floor(G.me.iq/25);
  if(p.crop==='蔬菜')G.store.蔬菜+=y;
  else G.store.药材+=y;
  addLog('🌾 你收割了第'+(idx+1)+'亩田的'+p.crop+'，得'+y+'份。（饱腹-8）','gd');
  p.crop=null;p.growth=0;p.watered=false;
  var newLogs=G.logs.slice(0,G.logs.length-before);
  render();showActionLog(newLogs);
  autoSave();
}
function doClear(){
  if(G.plots.length>=5){toast('最多5亩');return;}
  if(G.me.health<40||G.me.satiety<30){toast('健康或饱腹感不足');return;}
  if((G.actionsThisXun||0)>=MAX_ACTIONS_PER_XUN){toast('本旬活动次数已用完');return;}
  var before=G.logs.length;
  G.me.health=cl(G.me.health-8);
  G.me.satiety=cl(G.me.satiety-20);
  useAction();
  G.plots.push({crop:null,growth:0,watered:false});
  addLog('⛏️ 你挥锄开垦，开出第'+G.plots.length+'亩薄田。（健康-8 饱腹-20）','gd');
  var newLogs=G.logs.slice(0,G.logs.length-before);
  render();showActionLog(newLogs);
  autoSave();
}

/* ========== 行房（多夫支持）+ 怀孕丈夫剧情 ========== */
function doFang(npcIdx){
  var n=G.npcs[npcIdx];
  if(!n){toast('对象不存在');return;}
  if(!isNpcSpouse(n.id)){toast('尚未与对方成亲');return;}
  if(G.me.satiety<5){toast('饱腹感不够');return;}
  var before=G.logs.length;
  G.me.satiety=cl(G.me.satiety-5);
  var allSps=getAllSpouses();
  for(var si=0;si<allSps.length;si++){
    if(allSps[si].id===n.id){ allSps[si].lastIntimacyDay = G.totalXun; break; }
  }
  G.lastFangDay=G.year*36+G.month*3+G.xun;
  G.lastIntimacyDay=G.lastFangDay;
  var wasPregnant = G.me.pregnancy>0;

  if(G.me.pregnancy<=0&&G.me.postpartum<=0&&G.me.health>=20){
    if((G.me.contraception||0)>0){
      addLog('💞 你与'+n.name+'温存了一番。（避孕中，剩余'+G.me.contraception+'旬）','gd');
    }else{
      var chance=G.me.fertility;
      if(Math.random()*100<chance){
        G.me.pregnancy=1;G.me.fertility=0;
        addLog('🤰 你有了身孕。','gd2');
        // 一怀孕立即触发所有丈夫怀孕剧情
        checkPregnancyHusbandStory();
      }else{
        var age=G.me.age;
        var add=age<20?20:age<25?10:age<30?5:1;
        G.me.fertility=cl(G.me.fertility+add);
        addLog('💞 你与'+n.name+'同房，暂时没有怀孕。（孕率+'+add+'）','gd');
      }
    }
  }else{
    addLog('💞 你与'+n.name+'温存了一番。','gd');
  }
  var newLogs=G.logs.slice(0,G.logs.length-before);
  render();showActionLog(newLogs);
  autoSave();
}

/* ========== 怀孕丈夫专属剧情触发 ========== */
function checkPregnancyHusbandStory(){
  if(G.me.pregnancy <= 0) return;
  var sps = getAllSpouses();
  for(var i=0;i<sps.length;i++){
    var sp = sps[i];
    if(!sp.id) continue;
    var flagKey = 'pregStory_' + sp.id;
    if(G.flags[flagKey]) continue;
    var storyName = NPC_STORY_KEY[sp.id];
    if(storyName && NPC_STORIES[storyName] && NPC_STORIES[storyName].preg){
      // 不在这里立即弹，交给队列依次触发
      pushStory((function(sid,sname){return function(){ showPregnancyHusbandStory(sid,sname); };})(sp.id,storyName));
    } else {
      // 没有专属怀孕剧情的丈夫，直接标记，避免重复
      G.flags[flagKey] = true;
    }
  }
}
function showPregnancyHusbandStory(npcId, storyName){
  // 检查是否已经触发过（防止队列重复）
  var flagKey='pregStory_'+npcId;
  if(G.flags[flagKey]) return;
  var story = NPC_STORIES[storyName].preg;
  if(!story) return;
  var sps = getAllSpouses();
  var sp = null;
  for(var i=0;i<sps.length;i++){ if(sps[i].id===npcId){ sp=sps[i]; break; } }
  if(!sp) return;
  G.flags[flagKey] = true;
  var html = '<div class="story-panel">';
  html += '<div class="story-title">' + story.title + '</div>';
  html += '<div class="story-text">';
  var parts = story.text.split('<br><br>');
  for(var i=0;i<parts.length;i++){ html += '<p>'+parts[i]+'</p>'; }
  html += '</div></div>';
  html += '<div class="story-choices">';
  for(var ci=0;ci<story.choices.length;ci++){
    html += '<button class="story-choice" onclick="choosePregnancyStory(\''+npcId+'\',\''+storyName+'\','+ci+')">' + story.choices[ci].text + '</button>';
  }
  html += '</div>';
  openModal('【' + sp.name + ' · ' + story.title + '】', html);
}
function choosePregnancyStory(npcId, storyName, choiceIdx){
  var story = NPC_STORIES[storyName].preg;
  if(!story) return;
  var ch = story.choices[choiceIdx];
  if(!ch) return;
  var sps = getAllSpouses();
  var sp = null;
  for(var i=0;i<sps.length;i++){ if(sps[i].id===npcId){ sp=sps[i]; break; } }
  if(!sp) return;
  var before = G.logs.length;
  sp.affection = cl(sp.affection + (ch.aff||0));
  if(ch.iq) G.me.iq = cl(G.me.iq + ch.iq);
  if(ch.health) G.me.health = cl(G.me.health + ch.health);
  addLog('💕 【' + sp.name + '·' + story.title + '】你有了身孕，' + sp.name + '欢喜不已。（好感+' + (ch.aff||0) + '）', 'pink');
  if(ch.iq) addLog('　（智商+' + ch.iq + '）', 'gd');
  if(ch.health) addLog('　（健康+' + ch.health + '）', 'gd');
  var newLogs = G.logs.slice(0, G.logs.length - before);
  closeModal();
  render();
  showActionLog(newLogs);
  autoSave();
}

function doGift(who,item){
  var p;

  else if(who==='sis')p=G.sis;

  else if(who==='sisspouse')p=G.sis.spouse;

/* ========== 辅助 ========== */
function hasAnimals(){for(var t in G.animals)if(G.animals[t]>0)return true;return false;}
function hasSellable(){var s=G.store;return s.药材>0||s.鸡蛋>0||s.蔬菜>0||s.兽肉>0||s.绣品>0||s.牛奶>0||s.羊毛>0||s.猪肉>0||s.牛肉>0||s.羊肉>0||s.鱼>0;}

         (s.兽肉>=1&&s.柴火>=1)||(s.猪肉>=1&&s.柴火>=1)||(s.牛肉>=1&&s.柴火>=1)||(s.羊肉>=1&&s.柴火>=1)||(s.鱼>=1&&s.柴火>=1);
}
function checkActionLimit(){return (G.actionsThisXun||0)<MAX_ACTIONS_PER_XUN;}
function useAction(){G.actionsThisXun=(G.actionsThisXun||0)+1;}

/* ========== 房屋升级 ========== */
function upgradeHouse(){
  if(G.house>=5){toast('房屋已满级');return;}
  var cost=HOUSE_UPGRADE_COST[G.house];
  var nextName=HOUSE_LEVELS[G.house+1].name;
  var moneyOk = G.money >= cost.money;
  var woodOk = (G.store.木材||0) >= cost.wood;
  var stoneOk = (G.store.石料||0) >= cost.stone;
  var allOk = moneyOk && woodOk && stoneOk;
  var html='<p class="desc">将房屋升级为「'+nextName+'」</p>';
  html+='<div style="font-size:13px;color:#6a5a4c;line-height:2;margin-bottom:10px;">';
  html+='需要：<b style="color:'+(moneyOk?'#3d8b4a':'#c0392b')+';">铜钱 '+cost.money+'</b> · '+
        '<b style="color:'+(woodOk?'#3d8b4a':'#c0392b')+';">木材 '+cost.wood+'</b> · '+
        '<b style="color:'+(stoneOk?'#3d8b4a':'#c0392b')+';">石料 '+cost.stone+'</b><br>';
  html+='现有：铜钱 '+G.money+' 文 · 木材 '+(G.store.木材||0)+' 份 · 石料 '+(G.store.石料||0)+' 份';
  html+='</div>';
  html+='<div style="display:flex;gap:10px;margin-top:14px;">';
  html+='<button class="buy" style="flex:1;padding:10px;" onclick="closeModal()">取消</button>';
  if(allOk){
    html+='<button class="buy" style="flex:1;padding:10px;background:linear-gradient(135deg,#7a9a7a,#4b7a52);color:#fff;border-color:transparent;" onclick="doUpgradeHouse('+cost.money+','+cost.wood+','+cost.stone+')">升级</button>';
  }else{
    html+='<button class="buy" style="flex:1;padding:10px;" disabled>材料不足</button>';
  }
  html+='</div>';
  openModal('修缮房屋',html);
}
function doUpgradeHouse(money,wood,stone){
  if(G.money<money||(G.store.木材||0)<wood||(G.store.石料||0)<stone){toast('材料不足');return;}
  if(!checkActionLimit()){toast('本旬活动次数已用完，升级需消耗1次行动');return;}
  if(G.me.satiety<10){toast('饱腹感不够，升级需消耗饱腹-10');return;}
  G.me.satiety=cl(G.me.satiety-10);
  useAction();
  G.money-=money;G.store.木材-=wood;G.store.石料-=stone;
  G.house++;
  var newName=HOUSE_LEVELS[G.house].name;
  addLog('🏠 房屋升级为「'+newName+'」！（'+money+'文 + 木材'+wood+' + 石料'+stone+' 饱腹-10）','gd2');
  if(G.house===2){addLog('🐱 砖瓦房落成，这下可以养只猫了。','gd2');}
  closeModal();render();
  showActionLog([{m:'🏠 房屋升级为「'+newName+'」',c:'gd2'}]);
  autoSave();
}

/* ========== 导航 ========== */
function drawNav(){
  var h='';
  for(var k in PAGES){
    if(k==='love'&&!G.npcs.length)continue;
    h+='<button class="'+(G.page===k?'on':'')+'" onclick="go(\''+k+'\')">'+PAGES[k].icon+' '+PAGES[k].title+'</button>';
  }
  h+='<button class="end" onclick="endXun()">⏳ 结束本旬</button>';
  h+='<button class="util" onclick="openSave()">💾 存档</button>';
  h+='<button class="util" onclick="restart()">🔄 重开</button>';
  document.getElementById('nav').innerHTML=h;
}
function go(p){G.page=p;render();}

var _renderTimer=null;
function render(){
  if(_renderTimer) clearTimeout(_renderTimer);
  _renderTimer=setTimeout(function(){
    _renderTimer=null;
    try{drawTop();}catch(e){}
    try{drawRes();}catch(e){}
    try{drawPage();}catch(e){}
    try{drawNav();}catch(e){}
    try{drawLog();}catch(e){}
  },10);
}

/* ========== 行动结果弹窗 ========== */
function showActionLog(newLogs){
  if(!newLogs||!newLogs.length)return;
  var html='';
  for(var i=0;i<newLogs.length;i++){
    var L=newLogs[i];
    var color=L.c==='bd'?'#c0392b':L.c==='gd'?'#3d8b4a':L.c==='gd2'?'#a06a1a':L.c==='pink'?'#c9618a':'#5a4a3c';
    html+='<div class="result-line" style="color:'+color+'">'+L.m+'</div>';
  }
  html+='<button class="close" onclick="closeModal()">确 认</button>';
  openModal('行 动 结 果',html);
}

/* ========== 执行行动 ========== */
function doAct(key){
  if(G.over)return;
  if(G.me.satiety<=0){toast('太饿了，先吃饭或结束本旬吧');return;}
  var a=ACTS[key];
  if(!a||!a.can()){toast('条件不足');return;}
  if(!a.noActionCost && !checkActionLimit()){toast('本旬活动次数已用完（8/8）');return;}
  if(a.cost>G.me.satiety){toast('饱腹感不够');return;}
  var beforeLogs=G.logs.length;
  G.me.satiety=cl(G.me.satiety-a.cost);
  if(!a.noActionCost) useAction();
  try{a.run();}catch(e){}
  var newLogs=G.logs.slice(0,G.logs.length-beforeLogs);
  render();checkDead();
  var mr=document.getElementById('modalRoot');
  if(!G.over&&mr&&!mr.innerHTML&&newLogs.length>0)showActionLog(newLogs);
  autoSave();
}

/* ========== 确认弹窗 ========== */
function showConfirm(title, desc, onYes){

}

/* ========== 烹饪 ========== */
function openCook(){
  var s=G.store;
  var menu=[
    {name:'糙米粥',need:{糙米:1,柴火:1},sat:30},
    {name:'蔬菜汤',need:{蔬菜:2,柴火:1},sat:40},
    {name:'炒时蔬',need:{蔬菜:3,柴火:1},sat:50},
    {name:'鸡蛋羹',need:{鸡蛋:1,柴火:1},sat:35},
    {name:'鱼汤',need:{鱼:1,柴火:1},sat:45},
    {name:'肉糜粥',need:{糙米:1,兽肉:1,柴火:1},sat:70},
    {name:'红烧肉',need:{猪肉:2,柴火:1},sat:80},
    {name:'牛肉汤',need:{牛肉:1,蔬菜:1,柴火:1},sat:75},
    {name:'羊肉汤',need:{羊肉:1,蔬菜:1,柴火:1},sat:75}
  ];
  window._cookMenu=menu;
  var html='<p class="desc">选一道菜做给全家吃。（全家人受益，做饭不受活动次数限制）</p>';
  for(var i=0;i<menu.length;i++){
    var m=menu[i];var can=true;
    for(var k in m.need){if((s[k]||0)<m.need[k])can=false;}
    var needStr=[];for(var k2 in m.need){needStr.push(k2+'×'+m.need[k2]);}
    html+='<div class="shop-row"><span class="nm">'+m.name+'（饱腹+'+m.sat+'）<br>'+
      '<span style="font-size:11px;color:#a08e7c;">需要：'+needStr.join('、')+'</span></span>'+
      '<button class="buy" '+(can?'onclick="cookDish('+i+')"':'disabled style="opacity:.4"')+'>做</button></div>';
  }
  html+='<button class="close" onclick="closeModal()">返回</button>';
  openModal('做 饭',html);
}
function cookDish(idx){
  var menu=window._cookMenu;
  if(!menu||!menu[idx]){toast('出错了');return;}
  var m=menu[idx];var s=G.store;
  for(var k in m.need){if((s[k]||0)<m.need[k]){toast('材料不足');return;}}
  var before=G.logs.length;
  for(var k2 in m.need){s[k2]-=m.need[k2];}
  G.me.satiety=cl(G.me.satiety+m.sat);
  G.me.health=cl(G.me.health+2);
  if(!G.mom.dead){G.mom.health=cl(G.mom.health+2);G.mom.affection=cl(G.mom.affection+1);}
  G.bro.health=cl(G.bro.health+2);G.sis.health=cl(G.sis.health+2);
  var sps=getAllSpouses();
  for(var si=0;si<sps.length;si++) sps[si].health=cl(sps[si].health+2);
  if(G.dad.found)G.dad.health=cl(G.dad.health+2);
  for(var ci=0;ci<G.children.length;ci++){
    if(!G.children[ci].runaway)G.children[ci].health=cl(G.children[ci].health+2);
  }
  addLog('🍲 你做了'+m.name+'，全家吃得很满足。（饱腹+'+m.sat+'）','gd');
  var newLogs=G.logs.slice(0,G.logs.length-before);
  closeModal();render();showActionLog(newLogs);
  autoSave();
}

  render();openSell();
  autoSave();
}

/* ========== 学堂 ========== */
function openSchool(){
  var html='<p class="desc">送孩子去学堂读书，每月学费2两银子（2000文），每月增加智商8点。</p>';
  function st(passed, schooling){
    if(passed)return '<span style="color:#a87020">已入朝为官</span>';
    if(schooling)return '<span style="color:#3d8b4a">在读</span>';
    return '<span style="color:#a08e7c">未入学</span>';
  }
  html+='<div class="shop-row"><span class="nm">小弟（'+G.bro.age+'岁 智商'+G.bro.iq+'）'+st(G.flags.broPassed,G.flags.broSchool)+'</span><span class="btns">';
  if(!G.flags.broPassed){
    if(G.flags.broSchool)html+='<button class="buy" onclick="schoolToggle(\'bro\',false)">退学</button>';
    else html+='<button class="buy" onclick="schoolToggle(\'bro\',true)">入学</button>';
  }
  html+='</span></div>';
  html+='<div class="shop-row"><span class="nm">小妹（'+G.sis.age+'岁 智商'+G.sis.iq+'）'+st(G.flags.sisPassed,G.flags.sisSchool)+'</span><span class="btns">';
  if(!G.flags.sisPassed){
    if(G.flags.sisSchool)html+='<button class="buy" onclick="schoolToggle(\'sis\',false)">退学</button>';
    else html+='<button class="buy" onclick="schoolToggle(\'sis\',true)">入学</button>';
  }
  html+='</span></div>';
  for(var ci=0;ci<G.children.length;ci++){
    var c=G.children[ci];
    if(c.runaway){
      html+='<div class="shop-row"><span class="nm">'+c.name+'（'+c.age+'岁）<span style="color:#c9618a">已离家</span></span><span class="btns"></span></div>';
      continue;
    }
    if(c.pendingName){
      html+='<div class="shop-row"><span class="nm">（待取名 · '+c.age+'岁）</span><span class="btns"></span></div>';
      continue;
    }
    var canSchool=c.age>=6;

function schoolToggle(who,on){

function childSchoolToggle(idx,on){

/* ========== 进山 ========== */
function mAct(type){
  closeModal();
  if(G.me.satiety<=0){toast('太饿了');return;}
  if(!checkActionLimit()){toast('本旬活动次数已用完（8/8）');return;}
  var cost=type==='hunt'?20:10;
  if(G.me.satiety<cost){toast('饱腹感不够');return;}
  var before=G.logs.length;
  G.me.satiety=cl(G.me.satiety-cost);
  useAction();
  if(type==='wood'){
    var n=ri(2,4);G.store.柴火=(G.store.柴火||0)+n;
    addLog('🪵 你砍了'+n+'捆柴回来。（柴火+'+n+'，饱腹-10）','gd');
    if(Math.random()<0.12){G.me.health=cl(G.me.health-10);addLog('🩸 枯枝划破了你的手。（健康-10）','bd');}
  }else if(type==='herb'){
    var base=G.season==='spring'?0.75:G.season==='summer'?0.6:G.season==='autumn'?0.5:0.2;
    if(Math.random()<base){var n2=ri(1,2);G.store.药材=(G.store.药材||0)+n2;addLog('🌿 你采到'+n2+'株草药。（药材+'+n2+'，饱腹-10）','gd');}
    else addLog('🌿 你翻遍了山坡，也没找到像样的草药。（饱腹-10）','');
    if(Math.random()<0.18){G.me.health=cl(G.me.health-12);addLog('🐍 蛇咬了你一口！（健康-12）','bd');}
  }else if(type==='hunt'){
    if(Math.random()<0.5){
      var n3=ri(2,4);G.store.兽肉=(G.store.兽肉||0)+n3;
      addLog('🏹 你套住一只野兔，得了'+n3+'份肉。（兽肉+'+n3+'，饱腹-20）','gd');
      if(!findNpc('hunter')&&Math.random()<0.4){
        addNpc({id:'hunter',name:'赵铁柱',title:'憨厚猎户',affection:25,health:82,iq:35,appearance:62,money:800,age:24});
        addLog('🏹 一个猎户从林子里走出来，帮你解了套子。','gd');
      }
    }else{G.me.health=cl(G.me.health-15);addLog('🐗 野猪冲出来，你被獠牙划伤。（健康-15）','bd');}
  }
  var newLogs=G.logs.slice(0,G.logs.length-before);
  render();checkDead();
  if(!G.over&&newLogs.length>0)showActionLog(newLogs);
  autoSave();
}

function findNpc(id){for(var i=0;i<G.npcs.length;i++)if(G.npcs[i].id===id)return G.npcs[i];return null;}

}

/* ========== 父亲剧情 ========== */
function showFatherStage(stageIdx){
  var stage=FATHER_STAGES[stageIdx-1];
  if(!stage)return;
  var html='<div class="dad-panel">';
  html+='<div class="dad-title">📜 '+stage.title+'</div>';
  html+='<div class="dad-text">';
  var parts=stage.text.split('<br><br>');
  for(var i=0;i<parts.length;i++){html+='<p>'+parts[i]+'</p>';}
  html+='</div></div>';
  html+='<div class="story-choices">';
  for(var ci=0;ci<stage.choices.length;ci++){
    html+='<button class="story-choice" onclick="chooseFather('+stageIdx+','+ci+')">'+stage.choices[ci].text+'</button>';
  }
  html+='</div>';
  openModal('寻 父 · '+stage.title, html);
}
function chooseFather(stageIdx, choiceIdx){
  var stage=FATHER_STAGES[stageIdx-1];
  if(!stage)return;
  var ch=stage.choices[choiceIdx];
  if(!ch)return;
  G.fatherQuest=stageIdx;
  if(ch.flag) G.flags[ch.flag]=true;
  closeModal();
  var hint=FATHER_HINTS[ch.next];
  if(hint){addLog('📜 父亲线进度：'+stageIdx+'/5 —— '+hint,'gold');}
  if(stageIdx===4){
    G.flags.f4_done=true;
    addLog('📜 你已经知道了父亲的下落。下一旬，你将做出抉择……','gold');
  }
  render();autoSave();
}
function checkFatherChoice(){
  if(G.fatherQuest!==4) return;
  if(!G.flags.f4_done) return;
  if(G.fatherResult) return;
  var html='<div class="dad-panel">';
  html+='<div class="dad-title">📜 寻父 · 抉择</div>';
  html+='<div class="dad-text">';
  html+='<p>老者的仆从告诉你：你的父亲就在京城，如今已是朝中重臣。</p>';
  html+='<p>「但他身不由己。若要相见，需你亲自北上。」</p>';
  html+='<p>你握着那块完整的凤凰玉佩，久久没有说话。</p>';
  html+='<p><span class="em">（我该……怎么做？）</span></p>';
  html+='</div></div>';
  html+='<div class="story-choices">';
  html+='<button class="story-choice" onclick="fatherChoice(\'a\')">🏃 亲自北上寻父</button>';
  html+='<button class="story-choice" onclick="fatherChoice(\'b\')">📨 托贵人代为打听</button>';
  html+='<button class="story-choice" onclick="fatherChoice(\'c\')">🍃 放下，不再追寻</button>';
  html+='</div>';
  openModal('寻 父 · 抉择', html);
}
function fatherChoice(type){
  closeModal();
  G.fatherQuest=5;
  if(type==='a'){
    G.fatherResult='a';
    G.dad.found=true;
    addLog('📜 你毅然北上，历经千辛万苦，终于在京城见到了父亲。','gold');
    addLog('👨 父亲已两鬓斑白，见到你时老泪纵横：「夏儿，是爹对不住你们……」','gold');
    addLog('🏠 父亲随你回了桃花村，从此一家团圆。','gold');
  }else if(type==='b'){
    G.fatherResult='b';
    addLog('📜 你托贵人代为打听。数月后，一封书信自京城寄来。','gold');
    addLog('📜 是父亲的字迹——他告诉你，他身不由己，无法归来。','gold');

  render();autoSave();
}

  if((G.store.鱼||0)<1 && (G.store.兽肉||0)<1){toast('没有鱼或兽肉可以喂');return;}
  if(G.store.鱼>=1){G.store.鱼--;}
  else {G.store.兽肉--;}
  G.pet.affection=cl(G.pet.affection+3);

    G.pet.growth++;

      addLog('🐈 '+G.pet.name+'长大了，从此能帮你抓老鼠了。','pink');

  render();autoSave();

function doCasinoBet(choice){
  var inp = document.getElementById('casinoAmt');
  var amt = parseInt(inp ? inp.value : 0) || 0;
  if(amt <= 0){ toast('请输入赌注'); return; }
  if(amt > G.money){ toast('铜钱不够'); return; }
  G.money -= amt;
  var win = Math.random() < 0.3;
  var actual = '';
  if(win){ actual = choice; }
  else { actual = (choice === '大') ? '小' : '大'; }
  var before = G.logs.length;
  var html = '';
  if(win){
    var reward = amt * 2;
    G.money += reward;
    G.flags.casinoWins = (G.flags.casinoWins || 0) + 1;
    html += '<p style="font-size:16px;color:#3d8b4a;text-align:center;margin-bottom:8px;">开「' + actual + '」——你赢了！</p>';
    html += '<p style="font-size:13px;color:#a06a1a;text-align:center;">获得 ' + num(reward) + ' 文（净赚 ' + num(amt) + ' 文）</p>';
    addLog('🎲 赌场押' + choice + '，开' + actual + '，赢' + num(reward) + '文。', 'gd2');
    if(G.flags.casinoWins >= 3){
      var confiscated = G.money;
      G.money = 100;
      G.flags.casinoWins = 0;
      html += '<p style="font-size:14px;color:#c0392b;text-align:center;margin-top:10px;">⚠️ 你连赢三次，赌场打手围了上来！</p>';
      html += '<p style="font-size:13px;color:#c0392b;text-align:center;">「出老千！」他们抢走了你所有的钱（共' + num(confiscated) + '文），只留下100文。</p>';
      addLog('⚠️ 你连赢三次被指控出老千，所有铜钱（' + num(confiscated) + '文）被抢走，只留100文。', 'bd');
    }
  } else {
    html += '<p style="font-size:16px;color:#c0392b;text-align:center;margin-bottom:8px;">开「' + actual + '」——你输了。</p>';
    html += '<p style="font-size:13px;color:#8a7a6a;text-align:center;">损失 ' + num(amt) + ' 文</p>';
    addLog('🎲 赌场押' + choice + '，开' + actual + '，输' + num(amt) + '文。', 'bd');
    G.flags.casinoWins = 0;
  }
  html += '<div style="display:flex;gap:8px;margin-top:16px;">';
  html += '<button class="buy" style="flex:1;padding:10px;" onclick="openCasino()">再来一局</button>';
  html += '<button class="buy" style="flex:1;padding:10px;" onclick="closeModal()">离开赌场</button>';
  html += '</div>';
  openModal('🎲 开 盅', html);
  render();
  autoSave();
}

var SERVANT_SKILLS = [
  {key:'feed', name:'喂养畜牧'},
  {key:'egg', name:'捡鸡蛋'},
  {key:'wool', name:'剪羊毛'},
  {key:'milk', name:'挤牛奶'}

function servantSkillName(key){
  for(var i=0;i<SERVANT_SKILLS.length;i++){ if(SERVANT_SKILLS[i].key===key) return SERVANT_SKILLS[i].name; }
  return '';
}
function openHireWorker(){
  var workers = G.workers || [];
  var html = '<p class="desc">长工5万文一人，每旬自动照顾一亩田地（浇水、收割、播种），工资1000文/旬。必须先开垦田地，长工才能分配。</p>';
  html += '<p class="desc">现有田地：' + G.plots.length + ' 亩 · 现有长工：' + workers.length + ' 人（最多5人）</p>';
  var canHire = workers.length < 5 && G.plots.length > 0 && G.money >= 50000;
  html += '<div class="shop-row"><span class="nm">👨‍🌾 雇佣长工（5万文，每旬工资1000文）</span><span class="btns">';
  if(canHire){ html += '<button class="buy" onclick="hireWorker()">雇佣</button>'; }
  else if(G.plots.length === 0){ html += '<button class="buy" disabled>需先开垦田地</button>'; }
  else if(workers.length >= 5){ html += '<button class="buy" disabled>已达上限</button>'; }
  else { html += '<button class="buy" disabled>铜钱不足</button>'; }
  html += '</span></div>';
  if(workers.length){
    html += '<h3 style="font-size:13px;margin-top:14px;color:#8a5a3a;border-bottom:1px dashed #e2d5c1;padding-bottom:4px;">现有长工</h3>';
    for(var i=0;i<workers.length;i++){
      html += '<div class="shop-row"><span class="nm">'+workers[i].name+'（负责第'+(workers[i].plotIndex+1)+'亩田）</span><span class="btns"><button class="buy" onclick="fireWorker('+i+')">辞退</button></span></div>';
    }
  }
  html += '<button class="close" onclick="closeModal()">返回</button>';
  openModal('👨‍🌾 雇 佣 长 工', html);
}
function hireWorker(){
  if(G.money < 50000){ toast('铜钱不够（需5万文）'); return; }
  var workers = G.workers || [];
  if(workers.length >= 5){ toast('最多5位长工'); return; }
  if(G.plots.length === 0){ toast('还没有田地，先开垦荒地吧'); return; }
  G.money -= 50000;
  var usedPlots = [];
  for(var i=0;i<workers.length;i++) usedPlots.push(workers[i].plotIndex);
  var plotIndex = 0;
  for(var j=0;j<5;j++){ if(usedPlots.indexOf(j) < 0){ plotIndex = j; break; } }
  var w = { name: pk(WORKER_NAMES) + ri(1,99), plotIndex: plotIndex };
  workers.push(w);
  G.workers = workers;
  addLog('👨‍🌾 你雇佣了长工'+w.name+'，负责第'+(plotIndex+1)+'亩田。（花费5万文）','gd2');
  closeModal();render();autoSave();openHireWorker();
}
function fireWorker(i){
  var workers = G.workers || [];
  if(!workers[i]) return;
  var name = workers[i].name;
  workers.splice(i, 1);
  G.workers = workers;
  addLog('👨‍🌾 你辞退了长工'+name+'。','');
  closeModal();render();autoSave();openHireWorker();
}

     '<p class="desc" style="font-size:11.5px;">💡 更新代码前，先点「导出存档」把存档码保存到备忘录，更新后再「导入存档」粘贴回来即可继续。</p>'+

function saveSlot(i){

  catch(e){toast('存档失败');}
  openSave();
}
function loadSlot(i){
  var raw=localStorage.getItem('taohuacun_save_'+i);
  if(!raw){toast('该槽位没有存档');return;}
  try{
    var d=JSON.parse(raw);
    applySaveData(d);
    closeModal();render();toast('读档成功');
  }catch(e){toast('读档失败');}
}
function loadAutoSave(){
  var raw=localStorage.getItem('taohuacun_autosave');
  if(!raw){toast('没有自动存档');return;}
  try{
    var d=JSON.parse(raw);
    applySaveData(d);
    closeModal();render();toast('已读取自动存档');
  }catch(e){toast('自动存档损坏');}
}
function applySaveData(d){
  G=d;
  if(!G.animalGrowth)G.animalGrowth={chicken:0,cow:0,sheep:0,pig:0};
  if(!G.children)G.children=[];
  if(!G.plots)G.plots=[];
  if(!G.store)G.store={};
  if(!G.animals)G.animals={chicken:0,cow:0,sheep:0,pig:0};
  if(!G.npcs)G.npcs=[];
  if(!G.logs)G.logs=[];
  if(!G.flags)G.flags={};
  if(!G.workers)G.workers=[];

/* ========== 导出导入存档 ========== */
var _exportData=null;
var _exportTotal=0;
var _exportIdx=0;
var EXPORT_BATCH_SIZE=10000;
function copyTextToClipboard(text){
  var ok=false;
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    ta.setSelectionRange(0,ta.value.length);
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e){ok=false;}
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(text);}catch(e){}
    return true;
  }
  return ok;
}
function exportSave(){
  var data=JSON.stringify(G);
  _exportData=data;
  _exportTotal=Math.ceil(data.length/EXPORT_BATCH_SIZE)||1;
  _exportIdx=0;
  if(data.length<=EXPORT_BATCH_SIZE){
    var html='<p class="desc">点击「全选」按钮，然后长按文本框复制，粘贴到备忘录保存。</p>'+
      '<textarea id="saveCode" style="width:100%;height:130px;font-size:11px;font-family:monospace;padding:8px;border:1px solid #e2d5c1;border-radius:8px;resize:none;background:#fdfaf4;word-break:break-all;">'+data+'</textarea>'+
      '<div style="display:flex;gap:8px;margin-top:10px;">'+
      '<button class="buy" style="flex:1;padding:8px;" onclick="selectSaveCode()">🔍 全选</button>'+
      '<button class="buy" style="flex:1;padding:8px;" onclick="copySaveCode()">📋 复制</button>'+
      '</div>'+
      '<button class="close" onclick="closeModal()">返回</button>';
    openModal('导出存档',html);
  }else{ renderExportBatch(); }
}
function renderExportBatch(){
  var data=_exportData;
  var idx=_exportIdx;
  var total=_exportTotal;
  var start=idx*EXPORT_BATCH_SIZE;
  var end=Math.min(start+EXPORT_BATCH_SIZE,data.length);
  var chunk=data.substring(start,end);
  var isLast=(idx>=total-1);
  var html='<p class="desc" style="color:#c0392b;line-height:1.7;">你的存档码字数已超过一万，共 <b>'+data.length+'</b> 字，需分 <b>'+total+'</b> 批复制。</p>';
  html+='<p class="desc" style="font-size:11.5px;color:#8a7a6a;">请每复制一批后，立刻粘贴到备忘录保存好，再回来复制下一批。粘贴时不要加换行或空格。</p>';
  html+='<p class="desc">当前：<b>第 '+(idx+1)+' / '+total+' 批</b>（本批 '+chunk.length+' 字）</p>';
  html+='<textarea id="saveCode" style="width:100%;height:130px;font-size:11px;font-family:monospace;padding:8px;border:1px solid #e2d5c1;border-radius:8px;resize:none;background:#fdfaf4;word-break:break-all;">'+chunk+'</textarea>';
  html+='<div style="display:flex;gap:8px;margin-top:10px;">';
  if(isLast){
    html+='<button class="buy" style="flex:1;padding:8px;background:linear-gradient(135deg,#7a9a7a,#4b7a52);color:#fff;border-color:transparent;" onclick="copyLastBatch()">📋 复制最后一批</button>';
  }else{
    html+='<button class="buy" style="flex:1;padding:8px;background:linear-gradient(135deg,#e8b878,#c8944a);color:#fff;border-color:transparent;" onclick="copyAndNext()">📋 复制第'+(idx+1)+'批，并查看下一批</button>';
  }
  html+='</div>';
  var prevStyle=(idx<=0)?' style="flex:1;padding:8px;opacity:.4;" disabled':' style="flex:1;padding:8px;"';
  html+='<div style="display:flex;gap:8px;margin-top:6px;">';
  html+='<button class="buy"'+prevStyle+' onclick="prevExportBatch()">⬅ 上一批</button>';
  html+='<button class="buy" style="flex:1;padding:8px;" onclick="selectSaveCode()">🔍 全选本批</button>';
  html+='</div>';
  html+='<button class="close" onclick="closeModal()">关闭</button>';
  openModal('导出存档（分批）',html);
}
function copyAndNext(){
  var t=document.getElementById('saveCode');
  if(!t)return;
  var cur=_exportIdx+1;
  copyTextToClipboard(t.value);
  if(_exportIdx>=_exportTotal-1){toast('第'+cur+'批（最后一批）已复制，全部完成！');return;}
  _exportIdx++;
  renderExportBatch();
  toast('第'+cur+'批已复制，现为第'+(_exportIdx+1)+'批');
}
function copyLastBatch(){
  var t=document.getElementById('saveCode');
  if(!t)return;
  var cur=_exportIdx+1;
  copyTextToClipboard(t.value);
  toast('第'+cur+'批（最后一批）已复制，全部完成！');
}
function prevExportBatch(){
  if(_exportIdx<=0)return;
  _exportIdx--;
  renderExportBatch();
}
function selectSaveCode(){
  var t=document.getElementById('saveCode');
  if(!t)return;
  t.focus();t.select();t.setSelectionRange(0,t.value.length);
  toast('已全选，请长按文本框复制');
}
function copySaveCode(){
  var t=document.getElementById('saveCode');
  if(!t)return;
  t.focus();t.select();t.setSelectionRange(0,t.value.length);
  var ok=copyTextToClipboard(t.value);
  if(ok)toast('已复制到剪贴板');
  else toast('复制失败，请长按文本框手动复制');
}
function importSave(){
  var html='<p class="desc">请将各批次存档码依次粘贴到下方文本框中（不要删除已有内容，全部粘贴完后点「导入存档」）。</p>'+
    '<p class="desc" style="font-size:11.5px;color:#c0392b;">注意：分批粘贴时不要添加换行或空格，直接连续拼接。</p>'+
    '<textarea id="importCode" style="width:100%;height:130px;font-size:11px;font-family:monospace;padding:8px;border:1px solid #e2d5c1;border-radius:8px;resize:none;background:#fdfaf4;word-break:break-all;" placeholder="逐批粘贴到此（不要加换行）..."></textarea>'+
    '<button class="buy" style="width:100%;margin-top:10px;padding:8px;" onclick="doImportSave()">✅ 导入存档</button>'+
    '<button class="close" onclick="closeModal()">返回</button>';
  openModal('导入存档',html);
}
function doImportSave(){
  var t=document.getElementById('importCode');
  if(!t||!t.value.trim()){toast('请先粘贴存档码');return;}
  var raw=t.value.trim();
  try{ var d=JSON.parse(raw); applySaveData(d); closeModal();render();toast('导入成功！'); return; }catch(e){}
  try{
    var cleaned=raw.replace(/[\r\n]+/g,'').trim();
    var d2=JSON.parse(cleaned);
    applySaveData(d2);
    closeModal();render();toast('导入成功！');
  }catch(e2){ toast('存档码格式错误'); }
}

/* ========== 家人协助 ========== */
function familyAssist(){
  var plotsNeedWater=[];
  for(var i=0;i<G.plots.length;i++){
    var p=G.plots[i];
    if(p.crop && !p.watered && p.growth<CROP_INFO[p.crop].mature) plotsNeedWater.push(i);
  }
  if(plotsNeedWater.length>0){
    var helpers=[];
    if(G.bro.health>=60) helpers.push('小弟');
    if(G.sis.health>=60) helpers.push('小妹');
    var sps1=getAllSpouses();
    for(var si=0;si<sps1.length;si++){ if(sps1[si].health>=60) helpers.push('丈夫'+sps1[si].name); }
    if(G.bro.spouse && G.bro.spouse.health>=60) helpers.push('弟媳'+G.bro.spouse.name);
    if(G.sis.spouse && G.sis.spouse.health>=60) helpers.push('妹夫'+G.sis.spouse.name);
    if(helpers.length>0 && Math.random()<0.45){
      var helper=pk(helpers);
      var idx=pk(plotsNeedWater);
      var p=G.plots[idx];
      p.watered=true;
      p.growth=Math.min(p.growth+1,CROP_INFO[p.crop].mature);
      addLog('💧 '+helper+'帮你给第'+(idx+1)+'亩田浇了水、施了肥。（生长+1）','gd');
    }
  }
  if(hasAnimals()){
    var feedHelpers=[];
    if(G.bro.health>=60) feedHelpers.push('小弟');
    if(G.sis.health>=60) feedHelpers.push('小妹');
    var sps2=getAllSpouses();
    for(var si2=0;si2<sps2.length;si2++){ if(sps2[si2].health>=60) feedHelpers.push('丈夫'+sps2[si2].name); }
    if(G.bro.spouse && G.bro.spouse.health>=60) feedHelpers.push('弟媳'+G.bro.spouse.name);
    if(G.sis.spouse && G.sis.spouse.health>=60) feedHelpers.push('妹夫'+G.sis.spouse.name);
    if(feedHelpers.length>0 && Math.random()<0.45){
      var helper2=pk(feedHelpers);
      var count=0;
      for(var t in G.animals){
        if(G.animals[t]>0){ G.animalGrowth[t]=Math.min((G.animalGrowth[t]||0)+1,ANIMAL_INFO[t].mature); count++; }
      }
      if(count>0) addLog('🌽 '+helper2+'帮你喂养了所有家禽。（全部动物成长+1）','gd');
    }
  }
  var sps3=getAllSpouses();
  for(var si3=0;si3<sps3.length;si3++){
    var _sp=sps3[si3];
    if(_sp.health>=60 && Math.random()<0.35){
      var bonus=ri(15,30);
      G.me.satiety=cl(G.me.satiety+bonus);
      if(!G.mom.dead)G.mom.satiety=cl((G.mom.satiety||70)+Math.round(bonus/2));
      G.bro.satiety=cl((G.bro.satiety||70)+Math.round(bonus/2));
      G.sis.satiety=cl((G.sis.satiety||70)+Math.round(bonus/2));
      addLog('🍲 丈夫'+_sp.name+'下厨做了顿好饭，全家饱腹+'+(bonus)+'左右。（饱腹+'+bonus+'）','pink');
      break;
    }
  }
}

/* ========== 情缘专属剧情触发 ========== */
function checkNpcStories(){
  for(var i=0;i<G.npcs.length;i++){
    var n=G.npcs[i];
    var storyKey=NPC_STORY_KEY[n.id];
    if(!storyKey) continue;
    var stories=NPC_STORIES[storyKey];
    if(!stories) continue;
    var checkList=[
      {aff:30, key:'s30'},
      {aff:60, key:'s60'},
      {aff:90, key:'s90'}
    ];
    for(var j=0;j<checkList.length;j++){
      var ck=checkList[j];
      var flagKey='story_'+n.id+'_'+ck.key;
      if(n.affection>=ck.aff && !G.flags[flagKey]){
        G.flags[flagKey]=true;
        pushStory((function(idx,key){return function(){showNpcStory(idx,key);};})(i,ck.key));
        return;
      }
    }
  }
}
function showNpcStory(npcIdx, storyKey){
  var n=G.npcs[npcIdx];
  if(!n) return;
  var storyKeyName=NPC_STORY_KEY[n.id];
  var story=NPC_STORIES[storyKeyName][storyKey];
  if(!story) return;
  var html='<div class="story-panel">';
  html+='<div class="story-title">'+story.title+'</div>';
  html+='<div class="story-text">';
  var parts=story.text.split('<br><br>');
  for(var i=0;i<parts.length;i++){ html+='<p>'+parts[i]+'</p>'; }
  html+='</div></div>';
  html+='<div class="story-choices">';
  for(var ci=0;ci<story.choices.length;ci++){
    html+='<button class="story-choice" onclick="chooseStory('+npcIdx+',\''+storyKey+'\','+ci+')">'+story.choices[ci].text+'</button>';
  }
  html+='</div>';
  openModal('【'+n.name+' · '+story.title+'】', html);
}
function chooseStory(npcIdx, storyKey, choiceIdx){
  var n=G.npcs[npcIdx];
  if(!n) return;
  var storyKeyName=NPC_STORY_KEY[n.id];
  var story=NPC_STORIES[storyKeyName][storyKey];
  if(!story) return;
  var ch=story.choices[choiceIdx];
  if(!ch) return;
  var before=G.logs.length;
  n.affection=cl(n.affection+(ch.aff||0));
  if(ch.iq) G.me.iq=cl(G.me.iq+ch.iq);
  if(ch.health) G.me.health=cl(G.me.health+ch.health);
  var msg='💕 【'+story.title+'】你的选择让'+n.name+'对你的好感';
  if(ch.aff>0) msg+='+' + ch.aff;
  msg+='。';
  addLog(msg,'pink');
  if(ch.iq) addLog('　（智商+'+ch.iq+'）','gd');
  if(ch.health) addLog('　（健康+'+ch.health+'）','gd');
  var newLogs=G.logs.slice(0,G.logs.length-before);
  closeModal();render();showActionLog(newLogs);autoSave();
}

/* ========== 老人病（5%概率） ========== */
function checkElderSick(){
  var elders = [];
  if(!G.mom.dead && (G.mom.age||45) >= 50) elders.push({p:G.mom, name:'娘亲', key:'mom'});
  if(G.dad.found && (G.dad.age||50) >= 50) elders.push({p:G.dad, name:'父亲', key:'dad'});
  var sps = getAllSpouses();
  for(var i=0;i<sps.length;i++){
    if((sps[i].age||20) >= 50) elders.push({p:sps[i], name:'丈夫'+sps[i].name, key:'spouse_'+sps[i].id});
  }
  for(var j=0;j<elders.length;j++){
    if(Math.random() < 0.05){
      var e = elders[j];
      pushStory((function(el){return function(){showElderSickDialog(el);};})(e));
    }
  }
}
function findElderByKey(key){
  if(key === 'mom') return G.mom;
  if(key === 'dad') return G.dad;
  if(key.indexOf('spouse_') === 0){
    var id = key.substring(7);
    var sps = getAllSpouses();
    for(var i=0;i<sps.length;i++){ if(sps[i].id === id) return sps[i]; }
  }
  return null;
}
function showElderSickDialog(e){
  var html = '<p class="desc">' + e.name + '年事已高，突然病倒了。</p>';
  html += '<p class="desc">请大夫需要 <b style="color:#c0392b;">4两银子（4000文）</b>。</p>';
  html += '<p class="desc" style="font-size:11.5px;color:#a08e7c;">若不治，健康会下降15。</p>';
  html += '<div style="display:flex;gap:10px;margin-top:14px;">';
  if(G.money >= 4000){
    html += '<button class="buy" style="flex:1;padding:10px;background:linear-gradient(135deg,#7a9a7a,#4b7a52);color:#fff;border-color:transparent;" onclick="treatElder(\'' + e.key + '\')">花4000文治病</button>';
  } else {
    html += '<button class="buy" style="flex:1;padding:10px;" disabled>铜钱不足</button>';
  }
  html += '<button class="buy" style="flex:1;padding:10px;background:#c0392b;color:#fff;border-color:transparent;" onclick="skipTreatElder(\'' + e.key + '\')">不治（健康-15）</button>';
  html += '</div>';
  openModal('💊 老 人 生 病', html);
}
function treatElder(key){
  if(G.money < 4000){ toast('铜钱不够'); return; }
  G.money -= 4000;
  var e = findElderByKey(key);
  if(e){ e.health = cl(e.health + 20); }
  var name = key==='mom'?'娘亲':(key==='dad'?'父亲':'丈夫');
  addLog('💊 ' + name + '的病治好了，健康+20。（铜钱-4000）','gd');
  closeModal();render();autoSave();
}
function skipTreatElder(key){
  var e = findElderByKey(key);
  if(e){ e.health = cl(e.health - 15); }
  var name = key==='mom'?'娘亲':(key==='dad'?'父亲':'丈夫');
  addLog('💔 你没能给' + name + '治病，健康-15。','bd');
  closeModal();render();autoSave();
}

/* ========== 长工自动工作 ========== */
function workerAuto(){
  if(!G.workers) return;
  for(var wi=0; wi<G.workers.length; wi++){
    var w = G.workers[wi];
    var plotIdx = w.plotIndex;
    if(plotIdx >= G.plots.length) continue;
    var p = G.plots[plotIdx];
    if(!p.crop){
      if((G.store.种子||0) > 0){
        G.store.种子--; p.crop = '蔬菜'; p.growth = 0; p.watered = false;
        addLog('👨‍🌾 长工'+w.name+'在第'+(plotIdx+1)+'亩田播下了菜种。','gd');
      } else if((G.store.草药种子||0) > 0){
        G.store.草药种子--; p.crop = '草药'; p.growth = 0; p.watered = false;
        addLog('👨‍🌾 长工'+w.name+'在第'+(plotIdx+1)+'亩田播下了草药种子。','gd');
      } else {
        addLog('👨‍🌾 长工'+w.name+'想在第'+(plotIdx+1)+'亩田播种，但家中没有种子了，快去货郎那里买吧！','bd');
      }
    } else if(p.growth >= CROP_INFO[p.crop].mature){
      var y = ri(CROP_INFO[p.crop].yieldMin, CROP_INFO[p.crop].yieldMax);
      if(p.crop === '蔬菜') G.store.蔬菜 = (G.store.蔬菜||0) + y;
      else G.store.药材 = (G.store.药材||0) + y;
      addLog('👨‍🌾 长工'+w.name+'收割了第'+(plotIdx+1)+'亩田的'+p.crop+'，得'+y+'份。','gd');
      p.crop = null; p.growth = 0; p.watered = false;
      if((G.store.种子||0) > 0){
        G.store.种子--; p.crop = '蔬菜'; p.growth = 0; p.watered = false;
        addLog('👨‍🌾 长工'+w.name+'马不停蹄地在第'+(plotIdx+1)+'亩田播下了新一轮菜种。','gd');
      } else if((G.store.草药种子||0) > 0){
        G.store.草药种子--; p.crop = '草药'; p.growth = 0; p.watered = false;
        addLog('👨‍🌾 长工'+w.name+'在第'+(plotIdx+1)+'亩田播下了草药种子。','gd');
      } else {
        addLog('👨‍🌾 长工'+w.name+'想播种，但家中没有种子了，快去货郎那里买吧！','bd');
      }
    } else if(!p.watered){
      p.watered = true;
      p.growth = Math.min(p.growth + 1, CROP_INFO[p.crop].mature);
      addLog('👨‍🌾 长工'+w.name+'给第'+(plotIdx+1)+'亩田浇了水、施了肥。','gd');
    }
  }
}

/* ========== 仆从自动工作 ========== */
function servantAuto(){
  if(!G.servants) return;
  for(var i=0;i<G.servants.length;i++){
    var s = G.servants[i];
    if(s.skill === 'feed'){
      if(hasAnimals()){
        var count = 0;
        for(var t in G.animals){
          if(G.animals[t] > 0){ G.animalGrowth[t] = Math.min((G.animalGrowth[t]||0)+1, ANIMAL_INFO[t].mature); count++; }
        }
        if(count) addLog('🧹 仆从'+s.name+'喂养了所有家禽。（全部成长+1）','gd');
      }
    } else if(s.skill === 'egg'){
      if(G.animals.chicken > 0 && G.animalGrowth.chicken >= ANIMAL_INFO.chicken.mature){
        var n = G.animals.chicken;
        G.store.鸡蛋 = (G.store.鸡蛋||0) + n;
        addLog('🧹 仆从'+s.name+'捡了'+n+'个鸡蛋。（鸡蛋+'+n+'）','gd');
      }
    } else if(s.skill === 'wool'){
      if(G.animals.sheep > 0 && G.animalGrowth.sheep >= ANIMAL_INFO.sheep.mature){
        var n2 = G.animals.sheep;
        G.store.羊毛 = (G.store.羊毛||0) + n2;
        addLog('🧹 仆从'+s.name+'剪了'+n2+'份羊毛。（羊毛+'+n2+'）','gd');
      }
    } else if(s.skill === 'milk'){
      if(G.animals.cow > 0 && G.animalGrowth.cow >= ANIMAL_INFO.cow.mature){
        var n3 = G.animals.cow;
        G.store.牛奶 = (G.store.牛奶||0) + n3;

    }
  }
}
