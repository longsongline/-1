/* ========== 结束本旬 ========== */
function endXun(){
  if(G.over)return;
  closeModal();

  G.me.satiety=cl(G.me.satiety-15);
  if(G.me.satiety<=0){
    G.me.satiety=0;
    G.me.health=cl(G.me.health-10);
    addLog('😰 腹中空空如也，头晕眼花。（健康-10）','bd');
  }else if(G.me.satiety<20){
    G.me.health=cl(G.me.health-3);
    addLog('😟 饿着肚子过旬，身体不适。（健康-3）','bd');
  }

  var houseLv=HOUSE_LEVELS[G.house]||HOUSE_LEVELS[0];
  var healthPenalty=houseLv.healthPenalty||0;
  if(healthPenalty>0){
    G.me.health=cl(G.me.health-healthPenalty);
    if(!G.mom.dead)G.mom.health=cl(G.mom.health-healthPenalty);
    G.bro.health=cl(G.bro.health-healthPenalty);G.sis.health=cl(G.sis.health-healthPenalty);
    var spsP1=getAllSpouses();
    for(var si1=0;si1<spsP1.length;si1++) spsP1[si1].health=cl(spsP1[si1].health-healthPenalty);
    if(G.dad.found)G.dad.health=cl(G.dad.health-healthPenalty);
    for(var ci0=0;ci0<G.children.length;ci0++){
      if(!G.children[ci0].runaway)G.children[ci0].health=cl(G.children[ci0].health-healthPenalty);
    }
    addLog('🌬️ '+houseLv.name+'漏风，全家健康-'+healthPenalty+'。','bd');
  }
  if(houseLv.familyBonus){
    if(!G.mom.dead)G.mom.health=cl(G.mom.health+houseLv.familyBonus);
    G.bro.health=cl(G.bro.health+houseLv.familyBonus);
    G.sis.health=cl(G.sis.health+houseLv.familyBonus);
    addLog('🏠 '+houseLv.name+'温暖舒适，家人健康+'+houseLv.familyBonus+'。','gd');
  }
  if(G.season==='winter'){
    if(G.store.柴火>=1){G.store.柴火--;addLog('🔥 生了一盆炭火。（柴火-1）','');}
    else{
      G.me.health=cl(G.me.health-7);G.me.satiety=cl(G.me.satiety-7);
      if(!G.mom.dead)G.mom.health=cl(G.mom.health-7);
      G.bro.health=cl(G.bro.health-7);G.sis.health=cl(G.sis.health-7);
      var spsP2=getAllSpouses();
      for(var si2=0;si2<spsP2.length;si2++) spsP2[si2].health=cl(spsP2[si2].health-7);
      if(G.dad.found)G.dad.health=cl(G.dad.health-7);
      for(var ci1=0;ci1<G.children.length;ci1++){
        if(!G.children[ci1].runaway)G.children[ci1].health=cl(G.children[ci1].health-7);
      }
      addLog('❄️ 无柴取暖，全家冻得发抖。（健康-7 饱腹-7）','bd');
    }
  }
  if(!G.mom.dead&&G.mom.sick){
    G.mom.health=cl(G.mom.health-5);
    if(G.mom.health<30)addLog('💔 娘亲病体沉重……','bd');
    if(G.mom.health<=0){G.mom.health=0;G.mom.dead=true;G.mom.sick=false;addLog('💔 娘亲去了。','bd');}
  }
  if(!G.mom.dead&&G.mom.health>=70){
    var n=ri(1,2);G.store.绣品=(G.store.绣品||0)+n;
    addLog('💗 娘亲身子好了，帮你绣了'+n+'件绣品。（绣品+'+n+'）','gd');
  }
  if(G.bro.health>=60){
    var r=Math.random();
    if(r<0.4){G.store.蔬菜=(G.store.蔬菜||0)+1;addLog('🧸 小弟送来1份蔬菜。（蔬菜+1）','gd');}
    else if(r<0.7){G.store.药材=(G.store.药材||0)+1;addLog('🧸 小弟送来1份药材。（药材+1）','gd');}
    else{G.store.鱼=(G.store.鱼||0)+1;addLog('🧸 小弟送来1条鱼。（鱼+1）','gd');}
  }
  if(G.sis.health>=60){
    var r2=Math.random();
    if(r2<0.4){G.store.蔬菜=(G.store.蔬菜||0)+1;addLog('🧸 小妹送来1份蔬菜。（蔬菜+1）','gd');}
    else if(r2<0.7){G.store.药材=(G.store.药材||0)+1;addLog('🧸 小妹送来1份药材。（药材+1）','gd');}
    else{G.store.鱼=(G.store.鱼||0)+1;addLog('🧸 小妹送来1条鱼。（鱼+1）','gd');}
  }
  var allSps=getAllSpouses();
  for(var si3=0;si3<allSps.length;si3++){
    var _sp=allSps[si3];
    var _incomeTable=HUSBAND_INCOME_UP[_sp.title]||HUSBAND_INCOME[_sp.title]||{min:200,max:400};
    var _got=ri(_incomeTable.min,_incomeTable.max);
    if(houseLv.npcBetter) _got=Math.round(_got*1.15);
    G.money+=_got;
    addLog('💍 丈夫'+_sp.name+'（'+_sp.title+'）给了你'+num(_got)+'文家用。','gd2');
  }
  dadMonthlyGift();
  childSalary();
  runawayChildSupport();
  ratSteal();
  familyAssist();
  workerAuto();
  servantAuto();
  staffSalary();
  junZhuExpense();

  if((G.me.contraception||0)>0){
    G.me.contraception--;
    if(G.me.contraception===0){ addLog('💊 避孕药的药效过去了。',''); }
  }

  for(var i=0;i<G.plots.length;i++){
    var pp=G.plots[i];
    if(pp.crop&&pp.watered){
      var info=CROP_INFO[pp.crop];
      if(pp.growth<info.mature)pp.growth++;
    }
  }
  for(var t in G.animals){
    if(G.animals[t]>0){ G.animalGrowth[t]=Math.min((G.animalGrowth[t]||0)+1,ANIMAL_INFO[t].mature); }
  }

  G.totalXun++;
  if(G.totalXun % 12 === 0){
    ageUpAll();
    addLog('🎂 又是一年春去秋来，全家人都长了一岁。','gold');
  }

  G.xun++;
  if(G.xun>2){ G.xun=0;G.month++; if(G.month>12){G.month=1;G.year++;} }
  var ns=seasonOf(G.month);
  if(ns!==G.season){
    G.season=ns;spawnFx(ns);
    var tips={spring:'🌸 冬去春来，山花开了。',summer:'☀️ 夏日炎炎，蝉鸣阵阵。',
      autumn:'🍂 秋风起，果子红了满山。',winter:'❄️ 大雪封山，最难熬的日子来了。'};
    addLog(tips[ns],'gd2');
  }
  if(G.xun===0)monthSettle();
  if(Math.random()<0.5)randomEvent();
  G.me.satiety=cl(G.me.satiety+30);

  G.actionsThisXun=0;
  G.flags.casinoWins = 0;

  checkAllStories();
  checkDead();
  if(!G.over&&G.year>30)triggerEnd();
  render();
  autoSave();
}

/* ========== 求婚检测 ========== */
function checkProposal(){
  for(var i=0;i<G.npcs.length;i++){
    var n=G.npcs[i];
    if(n.affection>=100 && !isNpcSpouse(n.id)){
      if(!G.flags.junZhu && G.me.spouse) continue;
      pushStory((function(idx){return function(){showProposal(idx);};})(i));
      return;
    }
  }
}
function showProposal(i){
  var n=G.npcs[i];
  if(!n) return;
  var html='<p class="desc">'+n.name+'（'+n.title+'）对你情根深种，托媒人上门提亲……</p>'+
    '<div class="shop-row"><span class="nm">彩礼：'+num(ri(1500,4000))+'文 + 一生一世一双人</span></div>'+
    '<div style="display:flex;gap:10px;margin-top:14px;">'+
    '<button class="buy" style="flex:1;padding:10px" onclick="acceptProposal('+i+')">💍 接受</button>'+
    '<button class="buy" style="flex:1;padding:10px" onclick="rejectProposal('+i+')">💔 拒绝</button></div>';
  openModal('求 亲',html);
}
function acceptProposal(i){
  var n=G.npcs[i];
  if(!n) return;
  var caili=ri(1500,4000);
  G.money+=caili;
  var newSpouse={
    id:n.id, name:n.name, title:n.title, health:n.health, iq:n.iq,
    appearance:n.appearance, affection:n.affection, age:n.age||22,
    lastIntimacyDay: G.totalXun
  };
  if(!G.me.spouse){
    G.me.spouse=newSpouse;
    addLog('💍 你接受了'+n.name+'的求婚，收到彩礼'+num(caili)+'文。（铜钱+'+caili+'）','gd2');
  }else{
    if(!G.me.extraSpouses) G.me.extraSpouses=[];
    G.me.extraSpouses.push(newSpouse);
    addLog('💍 你以郡主身份又纳了'+n.name+'为夫，收到彩礼'+num(caili)+'文。（铜钱+'+caili+'）','gd2');
  }
  G.lastIntimacyDay=G.year*36+G.month*3+G.xun;
  closeModal();render();autoSave();
}
function rejectProposal(i){
  var n=G.npcs[i];if(!n) return;
  n.affection=50;
  addLog('💔 你拒绝了'+n.name+'的求婚，他黯然离去。（好感降至50）','bd');
  closeModal();render();autoSave();
}

/* ========== 月初结算（含龙凤胎/双胞胎） ========== */
function monthSettle(){
  if(G.flags.broPassed)G.flags.broSchool=false;
  if(G.flags.sisPassed)G.flags.sisSchool=false;

  var extra=ri(20,60);
  if(G.money>=extra){G.money-=extra;addLog('📉 本月开销'+extra+'文。','');}
  else{G.money=0;addLog('📉 入不敷出。','bd');}
  if(G.flags.broSchool){
    if(G.money>=2000){G.money-=2000;G.bro.iq=cl(G.bro.iq+8);addLog('📚 小弟在学堂读书，智商+8。（学费-2000文）','gd');}
    else{G.flags.broSchool=false;addLog('📚 没钱交学费，小弟退学了。','bd');}
  }
  if(G.flags.sisSchool){
    if(G.money>=2000){G.money-=2000;G.sis.iq=cl(G.sis.iq+8);addLog('📚 小妹在学堂读书，智商+8。（学费-2000文）','gd');}
    else{G.flags.sisSchool=false;addLog('📚 没钱交学费，小妹退学了。','bd');}
  }
  for(var csi=0;csi<G.children.length;csi++){
    var cs=G.children[csi];
    if(cs.runaway)continue;
    if(cs.pendingName)continue;
    if(cs.school){
      if(G.money>=2000){
        G.money-=2000; cs.iq=cl(cs.iq+8);
        addLog('📚 '+cs.name+'在学堂读书，智商+8。（学费-2000文）','gd');
      }else{
        cs.school=false;
        addLog('📚 没钱交学费，'+cs.name+'退学了。','bd');
      }
    }
  }
  var p=G.me;
  if(p.spouse&&p.pregnancy<=0&&p.postpartum<=0){
    if((p.contraception||0)>0){ /* 避孕中 */ }
    else{ p.fertility=cl(p.fertility+5); }
  }
  if(p.pregnancy>0){
    p.pregnancy++;
    if(p.pregnancy>10){
      var rand=Math.random();
      var babies=[];
      if(rand<0.4){ babies.push('男'); }
      else if(rand<0.8){ babies.push('女'); }
      else if(rand<0.9){ babies.push('男'); babies.push('女'); }
      else { var g=Math.random()<0.5?'男':'女'; babies.push(g); babies.push(g); }

      if(p.health<40&&Math.random()<0.35){ p.health=cl(p.health-25); addLog('⚠️ 生产时血崩。（健康-25）','bd'); }
      p.pregnancy=0;p.postpartum=3;

      // 清空所有丈夫的怀孕剧情标记，下一胎可再触发
      var spsClear=getAllSpouses();
      for(var siC=0;siC<spsClear.length;siC++){
        if(spsClear[siC].id) delete G.flags['pregStory_'+spsClear[siC].id];
      }

      var sp3=p.spouse||{health:60,iq:50};
      var newIndices=[];
      for(var bi=0;bi<babies.length;bi++){
        var cHealth=cl(Math.round((p.health+sp3.health)/2+ri(-10,10)),20,95);
        var cIq=cl(Math.round((p.iq+sp3.iq)/2+ri(-8,8)),5,90);
        G.children.push({
          name:'待取名', gender:babies[bi], age:0, health:cHealth, iq:cIq, affection:60,
          birthMonth:G.month, birthYear:G.year,
          orientation:null, spouse:null, school:false, schoolAsked:false,
          kejuPassed:false, kejuAsked:false, kejuYear:0,
          runaway:false, runawayXun:0, pendingName:true
        });
        newIndices.push(G.children.length-1);
      }
      if(babies.length===1){
        addLog('👶 你生下了一个'+(babies[0]==='男'?'儿子':'女儿')+'，快给'+(babies[0]==='男'?'他':'她')+'取个名字吧！','gd2');
      }else if(babies.length===2 && babies[0]!==babies[1]){
        addLog('👶 你生下了一对龙凤胎！一男一女，快给他们取名字吧！','gd2');
      }else{
        addLog('👶 你生下了一对双胞胎'+(babies[0]==='男'?'儿子':'女儿')+'！快给他们取名字吧！','gd2');
      }
      G.flags.children=(G.flags.children||0)+babies.length;
      for(var ni=0;ni<newIndices.length;ni++){
        pushStory((function(idx){return function(){showBabyNamingDialog(idx);};})(newIndices[ni]));
      }
    }
  }
  if(p.postpartum>0)p.postpartum--;
  if(G.month===9){addLog('🏮 九月庙会到了。','gd2');templeFair();}
}

/* ========== 庙会 ========== */
function templeFair(){
  if(G.fatherQuest===3&&!G.flags.f4){
    addLog('🏮 庙会上，一位衣着考究的老者在你摊位前停下了脚步……','gold');
    pushStory(function(){showFatherStage(4);});
    return;
  }
  var r=Math.random();
  if(r<0.3&&G.npcs.length===0){
    var pool=[
      {id:'teacher',name:'沈墨白',title:'教书先生',affection:30,health:70,iq:78,appearance:70,money:1500,age:25},
      {id:'xiucai',name:'周文远',title:'落魄秀才',affection:28,health:62,iq:80,appearance:66,money:200,age:23},
      {id:'merchant',name:'钱四海',title:'回乡富商',affection:25,health:75,iq:60,appearance:58,money:30000,age:28},
      {id:'mystery',name:'神秘男子',title:'神秘男子',affection:25,health:75,iq:70,appearance:78,money:5000,age:26},
      {id:'swordsman',name:'江湖游侠',title:'江湖游侠',affection:28,health:85,iq:55,appearance:72,money:500,age:27}
    ];
    addNpc(pk(pool));addLog('🏮 庙会上你与一位公子撞了个满怀。','gd');
  }else if(r<0.5){var m=ri(100,250);G.money+=m;addLog('🏮 庙会上你摆摊赚了些铜钱。（铜钱+'+m+'）','gd2');}
  else if(r<0.7){G.me.iq=cl(G.me.iq+3);addLog('🏮 庙会上听说书。（智商+3）','gd');}
  else{G.me.appearance=cl(G.me.appearance+5);addLog('🏮 你在庙会上买了盒胭脂。（容貌+5）','gd');}
}

/* ========== 随机事件 ========== */
function randomEvent(){
  var pool=[];
  if(G.season==='winter'){
    pool.push(function(){G.store.柴火=(G.store.柴火||0)+2;addLog('🎁 邻居送来两捆柴。（柴火+2）','gd');});
    pool.push(function(){G.me.health=cl(G.me.health-6);addLog('❄️ 夜里风雪灌进屋。（健康-6）','bd');});
    pool.push(function(){G.store.糙米=(G.store.糙米||0)+1;addLog('🐇 野兔撞进院子。（糙米+1）','gd');});
  }
  if(G.season==='spring'){
    pool.push(function(){G.store.蔬菜=(G.store.蔬菜||0)+2;addLog('🌱 屋后冒出野荠菜。（蔬菜+2）','gd');});
    pool.push(function(){G.store.药材=(G.store.药材||0)+1;addLog('🌿 田埂边发现药草。（药材+1）','gd');});
    pool.push(function(){G.me.health=cl(G.me.health-5);addLog('🌧️ 春雨连绵，染了风寒。（健康-5）','bd');});
  }
  if(G.season==='summer'){
    pool.push(function(){G.store.蔬菜=(G.store.蔬菜||0)+2;addLog('🪷 采了几个莲蓬。（蔬菜+2）','gd');});
    pool.push(function(){G.me.health=cl(G.me.health-7);addLog('☀️ 中暑了。（健康-7）','bd');});
    pool.push(function(){G.store.鱼=(G.store.鱼||0)+2;addLog('🐟 浅滩摸到两条鱼。（鱼+2）','gd');});
  }
  if(G.season==='autumn'){
    pool.push(function(){G.store.蔬菜=(G.store.蔬菜||0)+3;addLog('🍎 摘了满满一兜野果。（蔬菜+3）','gd');});
    pool.push(function(){G.me.health=cl(G.me.health-5);addLog('🌬️ 早晚温差大，着了凉。（健康-5）','bd');});
    pool.push(function(){G.store.柴火=(G.store.柴火||0)+3;addLog('🍂 扫了一大堆枯枝。（柴火+3）','gd');});
  }
  pool.push(function(){G.me.iq=cl(G.me.iq+2);addLog('📖 翻出一本残破旧书。（智商+2）','gd');});
  if(!G.mom.dead){
    pool.push(function(){G.mom.affection=cl(G.mom.affection+4);addLog('💗 娘亲给你补了衣裳。（娘亲好感+4）','gd');});
  }
  if(G.sis.health>0){
    pool.push(function(){G.sis.affection=cl(G.sis.affection+4);addLog('🧸 小妹把半块饼塞给你。（小妹好感+4）','gd');});
  }
  if(G.bro.health>0){
    pool.push(function(){G.bro.affection=cl(G.bro.affection+4);addLog('🧸 小弟帮你打了半桶水。（小弟好感+4）','gd');});
  }
  pool.push(function(){G.store.鸡蛋=(G.store.鸡蛋||0)+2;addLog('🥚 邻家的鸡跑来下了两个蛋。（鸡蛋+2）','gd');});
  if(G.pet){
    pool.push(function(){G.pet.affection=cl(G.pet.affection+2);addLog('🐱 '+G.pet.name+'蹭了蹭你的腿。（好感+2）','pink');});
  }
  var sps=getAllSpouses();
  if(sps.length){
    pool.push(function(){
      var _sp=pk(sps);
      _sp.affection=cl((_sp.affection||0)+3);
      addLog('💗 丈夫'+_sp.name+'帮你劈了柴。（好感+3）','pink');
    });
  }
  if(G.npcs.length){
    for(var i=0;i<G.npcs.length;i++){
      var n=G.npcs[i];
      if(n.affection>=30&&n.affection<100&&Math.random()<0.22){
        n.affection=cl(n.affection+ri(3,8));
        var acts=[n.name+'帮你挑满了水缸。',n.name+'送来一小袋米。',
          n.name+'在村口替你说了几句好话。',n.name+'托人捎来一方帕子。'];
        addLog('💗 '+pk(acts),'pink');
      }
    }
  }
  if(pool.length)pk(pool)();
}

/* ========== 生死检测 ========== */
function checkDead(){
  if(G.over)return;
  if(G.me.health<10){
    G.over=true;
    showEnd('寒夜孤灯','你终究没能熬过去。<br>那一夜风雪很大，破屋里再没亮起火光。<br><br><b>—— 主控死亡，游戏结束 ——</b>');
    return;
  }
  if(G.bro.health<10){
    G.over=true;
    showEnd('寒夜孤灯','小弟没能熬过这个冬天。<br><br><b>—— 家人离世，游戏结束 ——</b>');
    return;
  }
  if(G.sis.health<10){
    G.over=true;
    showEnd('寒夜孤灯','小妹走了。<br><br><b>—— 家人离世，游戏结束 ——</b>');
    return;
  }
}

/* ========== 结局 ========== */
function triggerEnd(){
  var p=G.me;
  var broPassed=!!G.flags.broPassed;
  var sisPassed=!!G.flags.sisPassed;
  var fatherEnding='';
  if(G.fatherResult==='a'){
    fatherEnding='父亲随你回了桃花村，一家终于团圆。<br>他把当年的事细细讲给你听，说这些年最愧对的就是你们。<br>如今他每旬给你一两银子，还总想帮你做点什么。<br>';
  }else if(G.fatherResult==='b'){
    fatherEnding='你收到了父亲的信。他说他身不由己，但知道你们平安，此生无憾。<br>虽然未能相见，但你知道，他一直在某个地方惦记着你们。<br>';
  }else if(G.fatherResult==='c'){
    fatherEnding='你把凤凰玉佩收进匣子，从此不再提起。<br>有些事，放下了，也是一种答案。<br>';
  }else{
    fatherEnding='父亲的下落，始终成谜。<br>';
  }
  var junZhuLine = G.flags.junZhu ? '你被圣上封为明华郡主，享一夫多夫之权。<br>' : '';
  if(broPassed&&sisPassed){
    showEnd('双喜临门 · 金榜题名',
      '三十年寒窗，小弟和小妹双双科举高中！<br>'+
      '一门双进士，圣上龙颜大悦，特封你为明华郡主。<br>'+
      '苏家光耀门楣，桃花村人人称颂。<br><br>'+
      fatherEnding+
      (p.spouse?('你与'+p.spouse.name+'共享荣华。<br>'):'')+
      '<b>—— 特殊结局 · 双喜临门 ——</b>');
    return;
  }
  var score=G.money
    + G.plots.length*800
    + G.animals.chicken*80 + G.animals.cow*300 + G.animals.sheep*150 + G.animals.pig*120
    + G.house*800
    + p.health*8 + p.iq*6
    + (G.mom.dead?0:G.mom.health*5)
    + G.bro.health*3 + G.sis.health*3
    + (G.flags.children||0)*600
    + (p.spouse?1000:0)
    + (broPassed?2500:0) + (sisPassed?2500:0)
    + (G.pet?500:0)
    + (G.dad.found?3000:0);
  var passedText='';
  if(broPassed)passedText+='小弟科举高中，光耀门楣。<br>';
  if(sisPassed)passedText+='小妹巾帼不让须眉，科举高中。<br>';
  if(score>=15000){
    showEnd('桃花满园','三十年过去，你家的破屋换成了府邸。<br>田里的麦子一年比一年好，鸡鸭成群，仓廪充实。<br>娘亲的身子骨硬朗了，弟妹也都平安长大成人。<br>'+
      junZhuLine+passedText+fatherEnding+
      (p.spouse?('你与'+p.spouse.name+'相敬如宾，膝下承欢。<br>'):'')+
      (G.pet?('🐱 '+G.pet.name+'懒洋洋地趴在窗边晒太阳。<br>'):'')+
      '桃花村的乡亲们都说，苏家出了个了不得的闺女。<br><br><b>—— 结局一 · 桃花满园 ——</b>');
  }else if(score>=6000){
    showEnd('岁月静好','三十年过去，日子虽不富裕，却也饿不着冻不着。<br>家里盖起了小院，好歹能遮风挡雨。<br>娘亲还在，弟妹也平安长大了些。<br>'+
      junZhuLine+passedText+fatherEnding+
      '你站在门口，看着远处的炊烟，觉得这样也挺好。<br><br><b>—— 结局二 · 岁月静好 ——</b>');
  }else{
    showEnd('寒夜孤灯','三十年挣扎，终究没能翻过身来。<br>破屋还是那间破屋，日子还是那样紧巴。<br>你望着窗外的雪，不知道明年春天会不会好一些。<br><br><b>—— 结局三 · 寒夜孤灯 ——</b>');
  }
}
function showEnd(title,text){
  G.over=true;
  document.getElementById('modalRoot').innerHTML=
    '<div class="mask"><div class="modal"><div class="ending">'+
    '<h2>'+title+'</h2><div class="sub">'+text+'</div>'+
    '<button class="close" onclick="restart()">重 新 开 始</button>'+
    '</div></div></div>';
}

/* ========== 启动 ========== */
newGame();
render();
startGameNaming();
document.addEventListener('click', function once(){
  if(musicOn) startBGM();
  document.removeEventListener('click', once);
}, {once:true});
</script>
