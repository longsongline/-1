<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a2332">
<meta name="color-scheme" content="light">
<title>滨江市 · 壮阔人生 (豪华深度版)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{color-scheme:light;height:100%;-webkit-text-size-adjust:100%;}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:#202c39;background:#e9eef5;line-height:1.55;font-size:14px;
  height:100%;overflow:hidden;position:relative;}
body.s-spring{background:#eef6fc;}
body.s-summer{background:#edf8f3;}
body.s-autumn{background:#faf2e8;}
body.s-winter{background:#ebf0f7;}

/* 天气/季节粒子画布 */
#seasonFx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#seasonFx span{position:absolute;top:-30px;animation:fxFall linear infinite;opacity:.7;}
@keyframes fxFall{to{transform:translateY(110vh) rotate(360deg);}}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;
  padding:6px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  gap:6px;overflow:hidden;}

/* 顶栏 */
.topbar{background:#fff;border:1px solid #c9d7e5;border-radius:12px;
  padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;justify-content:space-between;flex-shrink:0;
  box-shadow:0 2px 10px rgba(30,55,90,.07);}
.brand-box{display:flex;align-items:center;gap:6px;}
.topbar h1{font-size:16px;font-weight:700;letter-spacing:1px;color:#1e5b99;}
.topbar h1 small{font-size:10.5px;color:#7e91a5;letter-spacing:0;font-weight:normal;}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.chip{background:#f0f4f9;border:1px solid #c9d7e5;border-radius:20px;
  padding:2px 9px;font-size:11.5px;color:#4f6274;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
.chip b{color:#1e5b99;font-weight:700;font-size:12.5px;}
.chip.warn{background:#fdeeee;border-color:#e09c9c;color:#a82828;}
.chip.gold{background:#fdf8eb;border-color:#e8cb80;color:#9b6b10;}
.chip.clickable{cursor:pointer;user-select:none;transition:transform .15s;}
.chip.clickable:active{transform:scale(.95);}

/* 主体布局 */
.main{flex:1;min-height:0;display:flex;gap:6px;overflow:hidden;}
.side{flex:0 0 260px;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;}
.content{flex:1;min-height:0;display:flex;overflow:hidden;}

.panel{background:#fff;border:1px solid #c9d7e5;border-radius:12px;
  padding:10px 12px;box-shadow:0 2px 8px rgba(30,55,90,.06);
  display:flex;flex-direction:column;min-height:0;width:100%;}
.panel h3{font-size:12.5px;font-weight:700;letter-spacing:1px;color:#1e5b99;
  border-bottom:1px dashed #d6e2ee;padding-bottom:5px;margin-bottom:7px;
  flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
.panel h3 em{font-style:normal;font-size:10.5px;color:#8596a8;letter-spacing:0;font-weight:normal;}

.scene-mood{font-size:11px;color:#7e91a5;margin:-3px 0 8px;line-height:1.5;flex-shrink:0;font-style:italic;}

/* 日志区 */
.log-panel{flex:1;min-height:0;overflow:hidden;}
.log-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;font-size:12px;line-height:1.65;color:#425263;}
.log-body p{padding:2.5px 0;border-bottom:1px dotted #e6edf4;word-break:break-word;}
.log-body p:last-child{border-bottom:none;}
.log-body .dt{color:#8c9eb0;font-size:10.5px;margin-right:5px;}
.log-body .gd{color:#238652;}
.log-body .bd{color:#c53428;}
.log-body .gd2{color:#1e5b99;}
.log-body .gold{color:#b37d14;}
.log-body .pink{color:#c24b7a;}

/* 资产快速预览面板 */
.asset-panel{flex:0 0 auto;max-height:110px;overflow-y:auto;}
.asset-grid{display:flex;flex-wrap:wrap;gap:4px;font-size:11px;}
.asset-tag{background:#f0f5fa;border:1px solid #d0deec;border-radius:6px;padding:2px 6px;color:#395066;}

/* 交互行动列表 */
.acts-wrapper{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;align-content:start;}
.act{display:flex;gap:7px;align-items:flex-start;
  background:#f8fbfd;border:1px solid #c9d7e5;border-radius:10px;
  padding:8px 10px;text-align:left;cursor:pointer;font-family:inherit;
  font-size:13px;color:#202c39;transition:all .15s;-webkit-appearance:none;}
.act:hover{border-color:#3892d8;background:#eef6fc;}
.act:active{transform:scale(.97);}
.act.off{opacity:.4;pointer-events:none;}
.act .ic{font-size:17px;line-height:1.1;flex-shrink:0;}
.act .bd2{display:flex;flex-direction:column;gap:1.5px;flex:1;min-width:0;}
.act .t1{font-size:12.5px;font-weight:600;letter-spacing:.5px;}
.act .t2{font-size:10px;color:#7e91a5;line-height:1.3;}
.act .t3{font-size:9.5px;color:#1e5b99;margin-top:1px;}

/* 产业与店铺独立卡片 */
.biz-card{border:1px solid #c9d7e5;border-radius:10px;padding:9px 11px;background:#fbfdfe;margin-bottom:6px;}
.biz-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#1e5b99;}
.biz-desc{font-size:11px;color:#6b8094;margin:4px 0 6px;}
.biz-acts{display:flex;gap:5px;flex-wrap:wrap;}
.biz-acts button{font-family:inherit;font-size:11.5px;padding:4px 9px;border-radius:7px;border:1px solid #c9d7e5;background:#f0f5fa;color:#35495e;cursor:pointer;}
.biz-acts button:active{background:#1e5b99;color:#fff;}

/* 人际卡片 */
.person{background:#f8fbfd;border:1px solid #c9d7e5;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
.person .nm{display:flex;justify-content:space-between;margin-bottom:3px;}
.person .nm b{color:#1e5b99;font-weight:600;}
.person .nm span{color:#8294a6;font-size:11px;}
.bar{height:6px;background:#e5edf5;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s;}

/* 底部导航 */
.nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;flex-shrink:0;
  background:#fff;border:1px solid #c9d7e5;border-radius:12px;
  padding:5px 6px;box-shadow:0 2px 8px rgba(30,55,90,.06);}
.nav button{flex:1 1 auto;min-width:54px;font-family:inherit;font-size:12px;
  font-weight:500;padding:7px 4px;border-radius:8px;cursor:pointer;
  background:#f1f5fa;border:1px solid #c9d7e5;color:#475a6c;
  -webkit-appearance:none;transition:all .15s;}
.nav button:active{transform:scale(.96);}
.nav button.on{background:#1e5b99;color:#fff;border-color:#1e5b99;}
.nav button.end{background:#238652;color:#fff;border-color:#238652;}
.nav button.util{background:#e7edf5;color:#3a4e61;}

/* 模态弹窗与剧情 */
.mask{position:fixed;inset:0;background:rgba(20,32,48,.55);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px);}
.modal{background:#fff;border:1px solid #c9d7e5;border-radius:16px;
  padding:18px 20px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 18px 45px rgba(15,30,50,.3);}
.modal h2{font-size:16px;color:#1e5b99;letter-spacing:1px;margin-bottom:10px;font-weight:700;text-align:center;}
.modal .desc{font-size:13px;color:#425263;line-height:1.8;margin-bottom:10px;}
.story-panel{background:linear-gradient(160deg,#f9fcff,#edf4fa);border:1px solid #cbdbee;border-radius:12px;padding:14px;margin-bottom:10px;}
.story-title{font-size:14.5px;color:#1e5b99;font-weight:700;letter-spacing:1px;text-align:center;margin-bottom:8px;border-bottom:1px dashed #c8d9eb;padding-bottom:6px;}
.story-text{font-size:13px;color:#354758;line-height:1.9;}
.story-text p{margin-bottom:7px;}
.story-text .em{color:#c24b7a;font-weight:600;}
.story-choices{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
.story-choice{display:block;width:100%;font-family:inherit;font-size:13px;padding:11px 14px;text-align:left;
  background:#f8fbfd;border:1px solid #c9d7e5;border-radius:9px;cursor:pointer;color:#202c39;
  transition:all .15s;-webkit-appearance:none;}
.story-choice:hover{border-color:#3892d8;background:#eef6fc;}
.story-choice:active{background:#dbeaf8;}
.main-btn{display:block;width:100%;font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:1px;
  padding:10px 14px;cursor:pointer;background:#1e5b99;color:#fff;border:none;border-radius:9px;text-align:center;}
.main-btn:active{background:#174777;}
.qty-input{width:100%;padding:9px;border:1px solid #c9d7e5;border-radius:8px;font-family:inherit;font-size:16px;text-align:center;background:#f8fbfd;}

/* 存档槽位UI */
.save-slot{border:1px solid #c9d7e5;border-radius:9px;padding:9px;margin-bottom:7px;background:#f9fbfd;
  display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap;}
.save-slot.auto{background:#f0f7fd;border-color:#a8c7e6;}
.save-slot button{font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:6px;border:1px solid #c9d7e5;background:#fff;cursor:pointer;}
.save-slot button:active{background:#1e5b99;color:#fff;}

/* 吐司 */
#toastRoot{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);z-index:99;pointer-events:none;}
#toastRoot div{background:rgba(25,38,55,.94);color:#fff;font-size:12.5px;padding:8px 18px;border-radius:20px;
  opacity:0;transition:opacity .2s;margin-top:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);white-space:nowrap;}
#toastRoot div.show{opacity:1;}
#toastRoot div:not(.show){display:none;}

/* ================= 移动端适配 ================= */
@media (max-width:760px){
  .wrap{padding:4px;gap:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom));}
  .topbar{padding:6px 8px;gap:4px 5px;}
  .topbar h1{font-size:13px;}
  .topbar h1 small{display:none;}
  .chips{flex:1 1 100%;gap:3px;}
  .chip{font-size:10px;padding:1px 6px;line-height:1.45;}
  .chip b{font-size:11px;}
  .main{flex-direction:column;gap:4px;}
  .content{order:1;flex:1;min-height:0;}
  .side{order:2;flex:0 0 24vh;max-height:24vh;gap:4px;}
  .asset-panel{max-height:75px;}
  .panel{padding:7px 9px;}
  .panel h3{font-size:11px;margin-bottom:4px;padding-bottom:3px;}
  .acts{grid-template-columns:repeat(2,1fr);gap:4px;}
  .act{padding:6px 7px;gap:5px;border-radius:8px;}
  .act .ic{font-size:15px;}
  .act .t1{font-size:11.5px;}
  .act .t2{font-size:9px;}
  .nav{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:4px;-webkit-overflow-scrolling:touch;}
  .nav button{flex:0 0 auto;min-width:0;padding:6px 8px;font-size:11px;}
  .modal{max-width:94vw;padding:14px;border-radius:12px;}
  #toastRoot{bottom:calc(76px + env(safe-area-inset-bottom));}
}
</style>
</head>
<body>
<div id="seasonFx"></div>
<div class="wrap">
  <!-- 顶栏数据 -->
  <div class="topbar">
    <div class="brand-box">
      <h1>滨江市 · 壮阔人生 <small>都市三十年深度模拟</small></h1>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- 主体工作区 -->
  <div class="main">
    <!-- 左侧/下部侧边栏：资产概览 + 日志 -->
    <div class="side">
      <div class="panel asset-panel">
        <h3>资产配置 <em>收租与副业</em></h3>
        <div class="asset-grid" id="assetGrid"></div>
      </div>
      <div class="panel log-panel">
        <h3>生活日志 <em id="cDate"></em></h3>
        <div class="log-body" id="logBody"></div>
      </div>
    </div>

    <!-- 右侧内容主区 -->
    <div class="content">
      <div class="panel">
        <h3 id="actHead"></h3>
        <div class="scene-mood" id="sceneMood"></div>
        <div class="acts-wrapper" id="actsWrapper">
          <div class="acts" id="actGrid"></div>
          <div id="bizContainer"></div>
          <div id="peoplePanel" style="margin-top:6px;overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="nav" id="nav"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ================= 全局工具库 ================= */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pk(a){return a[Math.floor(Math.random()*a.length)];}
function cl(v,a,b){if(a===undefined)a=0;if(b===undefined)b=100;return Math.max(a,Math.min(b,v));}
function num(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
var XUN_NAME=['上旬','中旬','下旬'];
var SEASON={1:'winter',2:'winter',3:'spring',4:'spring',5:'spring',6:'summer',7:'summer',8:'summer',9:'autumn',10:'autumn',11:'autumn',12:'winter'};
var MAX_ACTIONS_PER_XUN=8; // 每旬最大核心行动次数

/* ================= 异步剧情队列 (StoryQueue Engine) =================
   解决多事件连续触发时的弹窗吞噬 Bug，确保每一条重磅剧情按序呈现 */
var StoryQueue = [];
var _storyProcessing = false;
function pushStory(fn){
  StoryQueue.push(fn);
  setTimeout(processStoryQueue, 40);
}
function processStoryQueue(){
  if(_storyProcessing) return;
  if(!StoryQueue.length) return;
  if(G && G.over){ StoryQueue = []; return; }
  var mr = document.getElementById('modalRoot');
  if(mr && mr.innerHTML.trim() !== '') return; // 当前已有弹窗，等待关闭
  _storyProcessing = true;
  var fn = StoryQueue.shift();
  try{ fn(); }catch(e){}
  _storyProcessing = false;
  if(StoryQueue.length) setTimeout(processStoryQueue, 60);
}

/* ================= 现代都市 BGM 音效引擎 ================= */
var musicOn = false;
var audioCtx = null;
var bgmInterval = null;
function toggleMusic(){
  musicOn = !musicOn;
  if(musicOn){
    startCityBGM();
    toast('🎵 都市电台音乐已开启');
  } else {
    stopCityBGM();
    toast('🔇 音乐已关闭');
  }
  render();
}
function startCityBGM(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    playCityChords();
    if(!bgmInterval) bgmInterval = setInterval(playCityChords, 4800);
  }catch(e){}
}
function stopCityBGM(){
  if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
}
function playCityChords(){
  if(!musicOn || !audioCtx) return;
  var chords = [
    [261.63, 329.63, 392.00, 493.88], // Cmaj7
    [220.00, 261.63, 329.63, 392.00], // Am7
    [174.61, 220.00, 261.63, 329.63], // Fmaj7
    [196.00, 246.94, 293.66, 349.23]  // G7
  ];
  var c = pk(chords);
  for(var i=0;i<c.length;i++){
    playTone(c[i], 2.2, 0.035, i*0.08);
  }
}
function playTone(freq, dur, gainVal, delay){
  if(!audioCtx) return;
  setTimeout(function(){
    try{
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(gainVal, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }, delay*1000);
}

/* ================= 季节粒子特效 ================= */
function updateSeasonFx(season){
  var c = document.getElementById('seasonFx'); if(!c) return; c.innerHTML = '';
  var symbols = {spring:'🌸', summer:'🍃', autumn:'🍂', winter:'❄️'};
  var sym = symbols[season] || '✨';
  var frag = document.createDocumentFragment();
  for(var i=0;i<16;i++){
    var s = document.createElement('span');
    s.textContent = sym;
    s.style.left = (Math.random()*100) + '%';
    s.style.animationDuration = (8 + Math.random()*8) + 's';
    s.style.animationDelay = (-Math.random()*10) + 's';
    s.style.fontSize = (10 + Math.random()*10) + 'px';
    frag.appendChild(s);
  }
  c.appendChild(frag);
}

/* 房产阶梯配置（租金与抗通胀资产） */
var REAL_ESTATES = [

var BIZ_TYPES = [

  {id:'express', name:'社区智能驿站', cost:35000, incomeMin:1000, incomeMax:2400, staffWage:600, staffName:'理货站长', desc:'覆盖周边2000户快递代收发，流水稳健'},

/* 5位核心深度NPC（专属小说级多阶段剧情） */
var NPC_DEFS=[
  {id:'lin', name:'林晓', title:'业务搭档', via:'work',
   s30:{title:'加班夜的关东煮',
        text:'深夜十一点半，办公室只剩你们两盏工位灯亮着。<br><br>林晓揉了揉通红的眼睛，把一份改了六版的需求文档保存，忽然从桌底抽出一盒还冒着热气的关东煮推到你面前。<br><br>「吃了再写吧。方案是公司的，胃是自己的。」<br><br>窗外是滨江市灯火不熄的天际线，你们并肩坐着分吃一份热汤，她侧脸的碎发被夜风吹动。',

/* ================= 日志系统 ================= */
function addLog(msg,cls){
  if(!cls)cls='';
  var d=G.year+'年'+G.month+'月'+XUN_NAME[G.xun];
  G.logs.push({d:d,m:msg,c:cls});
  if(G.logs.length>450)G.logs.shift();
}
function drawLog(){
  var h='';
  for(var i=G.logs.length-1;i>=0;i--){
    var l=G.logs[i];
    h+='<p><span class="dt">['+l.d+']</span><span class="'+l.c+'">'+l.m+'</span></p>';
  }
  var lb=document.getElementById('logBody');
  if(lb){lb.innerHTML=h;lb.scrollTop=0;}
}
function toast(msg){
  var r=document.getElementById('toastRoot');if(!r)return;
  var t=document.createElement('div');t.textContent=msg;t.className='show';
  r.appendChild(t);
  setTimeout(function(){t.className='';},1800);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2100);
}

/* ================= 模态弹窗系统 ================= */
var modalOpen=false;
function openModal(title,html){
  modalOpen=true;
  document.getElementById('modalRoot').innerHTML=
    '<div class="mask"><div class="modal"><h2>'+title+'</h2>'+html+'</div></div>';
}
function closeModal(){
  modalOpen=false;
  document.getElementById('modalRoot').innerHTML='';
  render();
  setTimeout(processStoryQueue, 40); // 弹窗关闭后，若队列中还有后续剧情立即弹出
}

/* ================= 开局起名 ================= */
function startGameNaming(){
  var html='<div class="desc">你孤身一人踏入繁华浩大的滨江市。</div>'+
    '<div class="desc">看着穿流的地铁人群、林立的摩天大厦与逼仄合租屋，你暗下决心要在这座城市扎根立业。</div>'+
    '<div class="desc">请给自己确立一个代号或名字：</div>'+
    '<input type="text" id="playerNameInput" class="qty-input" maxlength="6" value="小滨">'+
    '<button class="main-btn" style="margin-top:10px" onclick="confirmPlayerName()">🚀 开启滨江奋斗史</button>';
  openModal('【滨江市 · 初来乍到】',html);
  setTimeout(function(){
    var inp=document.getElementById('playerNameInput');
    if(inp){inp.focus();inp.select();}
  },50);
}
function confirmPlayerName(){
  var inp=document.getElementById('playerNameInput');
  var nm=inp?inp.value.trim():'';
  if(!nm){toast('请输入名字');return;}
  G.me.name=nm.substring(0,6);
  closeModal();render();autoSave();
}

/* ================= 资产与店铺挂机结算 ================= */
function drawAssetPanel(){
  var h='';
  // 房产
  if(G.houseList && G.houseList.length){
    for(var i=0;i<G.houseList.length;i++){
      var ho = G.houseList[i];
      h+='<span class="asset-tag">🏠 '+ho.name+' (月租+'+ho.rent+')</span>';
    }
  } else {
    h+='<span class="asset-tag" style="color:#8596a8;">当前租房中 ('+G.rent+'元/月)</span>';
  }
  // 门店
  if(G.businesses && G.businesses.length){
    for(var j=0;j<G.businesses.length;j++){
      var b = G.businesses[j];
      h+='<span class="asset-tag" style="border-color:#b4d6ee;color:#1e5b99;">🏬 '+b.name+' (员工'+b.staffCount+'人)</span>';
    }
  } else {
    h+='<span class="asset-tag" style="color:#8596a8;">暂无投资门店</span>';
  }
  // 金融
  if(G.fixed>0) h+='<span class="asset-tag">🏦 定存'+num(G.fixed)+'</span>';
  if(G.fund>0) h+='<span class="asset-tag">📊 基金'+num(G.fund)+'</span>';

/* ================= 产业投资开店与雇佣 ================= */
function openInvestModal(){
  var html='<p class="desc">在滨江市投资副业门店，雇佣专业店长运营，每旬躺赚现金流收益（类似长工/仆从系统）：</p>';
  for(var i=0;i<BIZ_TYPES.length;i++){
    var b=BIZ_TYPES[i];
    var has = G.businesses.some(function(x){return x.type===b.id;});
    html+='<div class="biz-card"><div class="biz-head"><span>'+b.name+'</span><span style="color:#1e5b99;">启动资 '+num(b.cost)+'元</span></div>'+
      '<div class="biz-desc">'+b.desc+'<br>每旬收益估算：<b>'+b.incomeMin+'~'+b.incomeMax+'元</b>（员工底薪 '+b.staffWage+'元/旬）</div>'+
      '<div class="biz-acts">';
    if(has){
      html+='<button disabled style="opacity:.5">已开设运营中</button>';
    } else {
      var ok = G.money >= b.cost;
      html+='<button '+(ok?'onclick="doBuyBiz(\''+b.id+'\')"':'disabled style="opacity:.4"')+'>'+(ok?'筹建开业':'资金不足')+'</button>';
    }
    html+='</div></div>';
  }
  html+='<button class="main-btn" style="background:#8596a8;margin-top:10px;" onclick="closeModal()">返回</button>';
  openModal('🏬 投资创业与开设门店',html);
}
function doBuyBiz(typeId){
  var def = BIZ_TYPES.find(function(x){return x.id===typeId;});
  if(!def || G.money < def.cost){toast('资金不足');return;}
  G.money -= def.cost;
  G.businesses.push({
    id: 'biz_' + Date.now(),
    type: def.id,
    name: def.name,
    staffCount: 1,
    staffName: def.staffName,
    staffWage: def.staffWage,
    incomeMin: def.incomeMin,
    incomeMax: def.incomeMax
  });
  addLog('🏬 恭喜！你的新店「'+def.name+'」正式挂牌开业，并雇佣了1位'+def.staffName+'！（花费'+num(def.cost)+'元）','gd2');
  closeModal();render();autoSave();
}
function manageBiz(idx){
  var b = G.businesses[idx];if(!b)return;
  var html='<p class="desc">当前门店：<b>'+b.name+'</b></p>'+
    '<p class="desc">当前在岗员工：<b>'+b.staffCount+' 人（'+b.staffName+'）</b><br>每旬员工工资：'+num(b.staffCount*b.staffWage)+' 元<br>预估每旬流水：'+num(b.incomeMin*b.staffCount)+'~'+num(b.incomeMax*b.staffCount)+' 元</p>'+
    '<div class="biz-acts" style="margin-top:10px;">'+
    '<button onclick="addStaff('+idx+')">➕ 增聘员工（+1人，底薪'+b.staffWage+'）</button>'+
    (b.staffCount>1?'<button onclick="reduceStaff('+idx+')">➖ 优化减员（-1人）</button>':'')+
    '<button style="color:#c53428;" onclick="closeBiz('+idx+')">⚠️ 转让闭店（回血50%）</button>'+
    '</div>'+
    '<button class="main-btn" style="background:#8596a8;margin-top:12px;" onclick="closeModal()">返回</button>';
  openModal('门店管理', html);
}
function addStaff(idx){
  var b=G.businesses[idx];if(!b)return;
  if(b.staffCount>=5){toast('该门店员工已达上限5人');return;}
  b.staffCount++;
  addLog('🏬 '+b.name+'扩招了1位'+b.staffName+'，产能提升。','gd');
  closeModal();manageBiz(idx);render();autoSave();
}
function reduceStaff(idx){
  var b=G.businesses[idx];if(!b)return;
  if(b.staffCount<=1)return;
  b.staffCount--;
  addLog('🏬 '+b.name+'缩减了1位员工开支。','');
  closeModal();manageBiz(idx);render();autoSave();
}
function closeBiz(idx){
  var b=G.businesses[idx];if(!b)return;
  var def = BIZ_TYPES.find(function(x){return x.id===b.type;})||{cost:40000};
  var refund = Math.round(def.cost * 0.5);
  G.money += refund;
  G.businesses.splice(idx,1);
  addLog('🏬 你转让盘出了门店「'+b.name+'」，设备及店面残值回款+'+num(refund)+'元。','bd');
  closeModal();render();autoSave();
}

/* ================= 房产买卖与收租 ================= */
function openEstateModal(){
  var html='<p class="desc">购置滨江市优质资产，可选择自住免房租，也可多套出租坐收租金：</p>';
  for(var i=0;i<REAL_ESTATES.length;i++){
    var re=REAL_ESTATES[i];
    var ownedCount = G.houseList.filter(function(x){return x.id===re.id;}).length;
    var ok = G.money >= re.price;
    html+='<div class="biz-card"><div class="biz-head"><span>'+re.name+'</span><span style="color:#1e5b99;">全款 '+num(re.price)+'元</span></div>'+
      '<div class="biz-desc">'+re.desc+' · 出租租金估算：<b>'+re.rent+'元/月</b>（已持有：'+ownedCount+' 套）</div>'+
      '<div class="biz-acts">'+
      '<button '+(ok?'onclick="doBuyHouse(\''+re.id+'\')"':'disabled style="opacity:.4"')+'>'+(ok?'全款购置':'资金不足')+'</button>'+
      (ownedCount>0?'<button style="color:#c53428;" onclick="doSellHouse(\''+re.id+'\')">按9折转售套现</button>':'')+
      '</div></div>';
  }
  html+='<button class="main-btn" style="background:#8596a8;margin-top:10px;" onclick="closeModal()">返回</button>';
  openModal('🏠 滨江市房产置业中心', html);
}
function doBuyHouse(id){
  var def = REAL_ESTATES.find(function(x){return x.id===id;});
  if(!def || G.money < def.price){toast('资金不足');return;}
  G.money -= def.price;
  G.houseList.push({id:def.id, name:def.name, rent:def.rent});
  G.house = true; // 标志已是有房一族
  addLog('🏠 恭喜！你拿下了「'+def.name+'」的房产证！（花费'+num(def.price)+'元）','gd2');
  closeModal();render();autoSave();
}
function doSellHouse(id){
  var idx = G.houseList.findIndex(function(x){return x.id===id;});
  if(idx<0)return;
  var def = REAL_ESTATES.find(function(x){return x.id===id;});
  var back = Math.round(def.price * 0.9);
  G.money += back;
  G.houseList.splice(idx,1);
  if(G.houseList.length===0) G.house = false;
  addLog('💸 你转售了1套「'+def.name+'」，套现回笼现金+'+num(back)+'元。','');
  closeModal();render();autoSave();
}

function triggerMysteryStage(stg){
  var s = MYSTERY_STAGES[stg-1];if(!s)return;
  var html='<div class="story-panel"><div class="story-title">📜 传奇支线 · '+s.title+'</div>'+
    '<div class="story-text">';
  var lines=s.text.split('<br><br>');
  for(var i=0;i<lines.length;i++) html+='<p>'+lines[i]+'</p>';
  html+='</div></div><div class="story-choices">';
  for(var j=0;j<s.choices.length;j++){
    var c=s.choices[j];
    if(c.opt){
      html+='<button class="story-choice" onclick="chooseMysteryResult(\''+c.opt+'\')">'+c.text+'</button>';
    } else {
      html+='<button class="story-choice" onclick="advanceMystery('+c.next+')">'+c.text+'</button>';

  html+='</div>';
  openModal('【滨江往事 · 恩人主线】',html);
}

/* ================= 情感与NPC互动 ================= */
function pickSocialTarget(){
  var c=G.npcs.filter(function(n){return n.met&&!n.lover&&n.aff<100;});
  if(!c.length)return null;
  c.sort(function(a,b){return a.aff-b.aff;});
  return c[0];
}
function tryMeet(via){
  if(G.spouse)return;
  var pool=NPC_DEFS.filter(function(d){return d.via===via;});
  for(var i=0;i<pool.length;i++){
    var d=pool[i];
    var known=G.npcs.some(function(n){return n.id===d.id;});
    if(!known&&Math.random()<0.38){
      G.npcs.push({id:d.id,name:d.name,title:d.title,aff:15,met:true,lover:false});
      addLog('✨ 机缘巧合下，你结识了'+d.title+'「'+d.name+'」。','gd2');
      pushStory(function(){
        openModal('【心动初遇 · '+d.name+'】',
          '<div class="desc">'+d.name+'（'+d.title+'）走进了你的生活。</div>'+
          '<div class="desc">「你好啊，初次相识，请多关照。」</div>'+
          '<button class="main-btn" onclick="closeModal()">🙂 很高兴认识你</button>');
      });
      return;
    }
  }
}
function npcBeat(n){
  var d=NPC_DEFS.find(function(x){return x.id===n.id;});
  if(!d)return;
  var key=n.id;
  if(n.aff>=30 && !G.flags['s30_'+key] && d.s30){
    G.flags['s30_'+key]=1;
    pushStory(function(){showNpcStoryDialog(n, d.s30);});
    return;
  }
  if(n.aff>=60 && !G.flags['s60_'+key] && d.s60){
    G.flags['s60_'+key]=1;
    pushStory(function(){showNpcStoryDialog(n, d.s60);});
    return;
  }
  if(n.aff>=90 && !n.lover && !G.spouse && !G.flags['s90_'+key] && d.s90){
    G.flags['s90_'+key]=1;
    pushStory(function(){showNpcStoryDialog(n, d.s90, true);});
    return;
  }
}
function showNpcStoryDialog(n, st, isProposal){
  var html='<div class="story-panel"><div class="story-title">💕 '+n.name+' · '+st.title+'</div>'+
    '<div class="story-text">'+st.text+'</div></div><div class="story-choices">';
  if(isProposal){
    html+='<button class="story-choice" onclick="acceptMarryProposal(\''+n.id+'\')">💍 紧紧拥抱TA：「我愿意！」（办婚礼2万元）</button>'+
          '<button class="story-choice" onclick="rejectMarryProposal(\''+n.id+'\')">🕊️ 「我还想再专注于事业，再等等好吗？」</button>';
  } else {
    for(var i=0;i<st.choices.length;i++){
      var c=st.choices[i];
      html+='<button class="story-choice" onclick="chooseNpcOption(\''+n.id+'\','+i+')">'+c.text+'</button>';
    }
  }
  html+='</div>';
  openModal('【情感交响 · '+n.name+'】', html);
}
function chooseNpcOption(npcId, optIdx){
  var n=G.npcs.find(function(x){return x.id===npcId;});
  var d=NPC_DEFS.find(function(x){return x.id===npcId;});
  if(!n||!d)return;
  var st = n.aff>=60?d.s60:d.s30;
  if(st && st.choices[optIdx]){
    var c=st.choices[optIdx];
    n.aff=cl(n.aff+(c.aff||0));
    if(c.mood) G.me.mood=cl(G.me.mood+c.mood);
    if(c.ability) G.me.ability=cl(G.me.ability+c.ability);
    if(c.health) G.me.health=cl(G.me.health+c.health);
    addLog('💕 你与'+n.name+'的真诚选择加深了彼此的羁绊。（好感+'+(c.aff||0)+'）','pink');
  }
  closeModal();render();autoSave();
}
function acceptMarryProposal(npcId){
  var n=G.npcs.find(function(x){return x.id===npcId;});if(!n)return;
  if(G.money<20000){toast('存款不足20,000元，请先筹备婚礼开支');closeModal();return;}
  G.money-=20000;
  G.spouse={name:n.name,title:n.title,id:n.id};
  n.lover=true;G.me.mood=cl(G.me.mood+20);
  G.lastIntimacyDay=G.totalXun;
  addLog('💍 礼炮齐鸣！你与'+n.name+'正式步入婚姻殿堂，从此在滨江有了真正的家！-20,000元。','gd2');
  closeModal();render();autoSave();
}
function rejectMarryProposal(npcId){
  var n=G.npcs.find(function(x){return x.id===npcId;});if(!n)return;
  n.aff=cl(n.aff-15);

/* ================= 旬末时间推进 (Advance Xun) ================= */
function endCurrentXun(){
  if(G.over)return;
  closeModal();
  advanceXunTime();
}
function advanceXunTime(){
  G.xun++;
  G.totalXun++;
  G.actionsLeft = MAX_ACTIONS_PER_XUN; // 恢复每旬精力

  // 1. 产业门店自动化挂机运转 (每旬产生收益并扣除薪酬)
  if(G.businesses && G.businesses.length){
    for(var bi=0;bi<G.businesses.length;bi++){
      var b=G.businesses[bi];
      var turnover = ri(b.incomeMin, b.incomeMax) * b.staffCount;
      var wageCost = b.staffWage * b.staffCount;
      var netProfit = turnover - wageCost;
      G.money += netProfit;
      addLog('🏬 门店运营：'+b.name+' 本旬流水+'+num(turnover)+'元，支付工资-'+num(wageCost)+'元，净收益+'+num(netProfit)+'元。', netProfit>=0?'gd':'bd');
    }
  }

  // 2. 检查夫妻吃醋
  checkSpouseJealous();

  // 3. 月末与年份推进
  if(G.xun>2){
    G.xun=0;
    G.month++;
    monthSettle();
    if(G.month>12){
      G.month=1;
      G.year++;
      yearSettle();
    }
  }

  // 4. 自然损耗与被动状态
  G.me.mood = cl(G.me.mood - 1);
  checkBadState();
  if(!G.over && G.year>30) triggerEndGame();

  render();autoSave();
}

/* ================= 月末结算 ================= */
function monthSettle(){
  // 发薪或失业
  if(!G.unemployed){
    var base=salaryNow();
    var perfBonus = G.perf * 25;
    var totalPay = base + perfBonus;
    G.money += totalPay;
    addLog('💰 月末发薪（'+G.indName+'）：基本底薪'+num(base)+'+绩效奖金'+num(perfBonus)+' = 合计+'+num(totalPay)+'元。','gd2');

    // 试用期机制
    if(G.onProbation>0){
      if(G.perf<8){
        G.onProbation=0;G.level=Math.max(0,G.level-1);
        addLog('⏳ 试用期考评未达标，你被下调回'+JOBS[G.level].name+'岗位。','bd');
      } else {
        G.onProbation--;
        addLog('⏳ 跨行业试用期稳健通过一个月，剩余'+G.onProbation+'个月转正。','gd');
      }
    }

    // 绩效考核与开除
    if(G.perf<10){
      if(G.warned>=1){
        fireFromJob('连续两个月考核排名末尾淘汰');
      } else {
        G.warned=1;
        addLog('⚠️ HR与总监找你进行了绩效警示约谈：本月产出过低，再垫底将进入裁员名单！','bd');
      }
    } else {
      G.warned=0;
    }
  } else {
    addLog('📉 失业待业中，本月无任何薪资进账，唯有支出在持续消耗。','bd');
  }
  G.perf=0;

  // 房租与房产租金收益
  if(G.houseList && G.houseList.length){
    // 第一套自住免房租，其余套收租
    var totalRentIncome = 0;
    for(var hi=1;hi<G.houseList.length;hi++){
      totalRentIncome += G.houseList[hi].rent;
    }
    if(totalRentIncome>0){
      G.money += totalRentIncome;
      addLog('🏠 房产收益：名下除自住房外，其余房屋出租产生租金收益 +'+num(totalRentIncome)+'元！','gd2');
    } else {
      addLog('🏠 自有住房自住中，免缴每月房租。','');
    }
  } else {
    G.money -= G.rent;
    addLog('🏠 扣除本月房租支出 -'+num(G.rent)+'元。','bd');
  }

  // 生活成本
  var lc = 1100 + G.year*100 + G.children.length*800 + (G.parentsLive?1000:0);
  G.money -= lc;
  addLog('🍜 扣除水电、物业、生活伙食及杂费开销 -'+num(lc)+'元。','');

  // 子女反哺（成年且步入社会的孩子每月汇钱）
  if(G.children && G.children.length){
    for(var ci=0;ci<G.children.length;ci++){
      var ch = G.children[ci];
      if(ch.age>=22 && ch.working){
        G.money += 2000;
        addLog('💌 '+ch.name+'工作转正发薪，贴心地向父母转账孝顺2000元。','gold');
      }
    }
  }

  // 宠物状态
  if(G.pet){
    G.pet.hunger = cl(G.pet.hunger - 20);
    if(G.pet.hunger < 20){ G.me.mood = cl(G.me.mood - 6); addLog('😿 '+G.pet.name+'饿得喵喵叫，快添粮吧！','bd'); }
    else if(G.pet.love>=65){ G.me.mood = cl(G.me.mood + 4); }
  }

  // 随机事件触发
  if(Math.random()<0.5) triggerCityEvent();

  // 恩人主线判定
  if(G.mysteryQuest===0 && G.year>=2 && Math.random()<0.35){
    G.mysteryQuest=1;
    pushStory(function(){triggerMysteryStage(1);});
  }
}
function fireFromJob(reason){
  G.unemployed=true;G.warned=0;G.perf=0;
  G.me.mood=cl(G.me.mood-18);
  addLog('📦 由于'+reason+'，你收到了HR的辞退信。收拾工位交还工牌，心情跌入谷底。（心情-18）','bd');
  addLog('⚠️ 失业状态下没有底薪，请尽快去街区「投递简历」寻找工作机会！','bd');
}

/* ================= 年度结算 ================= */
function yearSettle(){
  G.me.age++;
  addLog('🎂 新的一年钟声敲响，你迎来了'+G.me.age+'岁生日。','gd2');

  // 租金通胀
  if(!G.house){
    G.rent = Math.round(G.rent * 1.05);
    addLog('📈 房东来电：因物价上涨，明年租金上调至 '+num(G.rent)+'元/月。','bd');
  }

  // 定期与理财利息
  if(G.fixed>0){
    var fxInterest = Math.round(G.fixed * 0.028);
    G.money += fxInterest;
    addLog('🏦 定期存款年化收益结算到账 +'+num(fxInterest)+'元！','gd');
  }

  // 年终奖
  if(!G.unemployed){
    var bonus = Math.round(salaryNow() * Math.min(2.5, G.perfYear/35));
    if(bonus>0){ G.money += bonus; addLog('🧧 辛苦一年，公司年终奖+'+num(bonus)+'元！','gd2'); }
    G.perfYear=0;
  }

  // 孩子长大与教育节点
  if(G.children && G.children.length){
    for(var k=0;k<G.children.length;k++){
      var c=G.children[k];
      c.age++;
      if(c.age===6 && !c.schoolChosen){
        c.schoolChosen=true;
        pushStory((function(child){return function(){schoolChoiceDialog(child);};})(c));
      } else if(c.age===15 && !c.highSchoolChosen){
        c.highSchoolChosen=true;
        pushStory((function(child){return function(){highSchoolDialog(child);};})(c));
      } else if(c.age===18 && !c.collegeChosen){
        c.collegeChosen=true;
        pushStory((function(child){return function(){collegeDialog(child);};})(c));
      } else if(c.age===22 && !c.marriageChosen){
        c.marriageChosen=true;
        c.working=true;
        pushStory((function(child){return function(){childMarriageDialog(child);};})(c));
      }
    }
  }

  // 婚后生育
  if(G.spouse && G.me.age>=25 && G.me.age<=43 && G.children.length<2 && Math.random()<0.4){
    pushStory(function(){giveBirthEvent();});
  }

  // 父母养老与健康
  if(G.parents.alive){
    G.parents.health = cl(G.parents.health - ri(3,6), 0, 100);
    if(G.parents.health<30){
      pushStory(function(){parentEmergencyDialog();});
    }
  }

  // 35岁职场优化危机
  if(G.me.age>=35 && !G.unemployed && G.level<3 && Math.random()<0.2){
    var comp = salaryNow() * 3;
    G.money += comp;
    fireFromJob('公司推行人员结构年轻化，年满35岁的你遭遇「优化」');
    pushStory(function(){storyLayoffDialog(comp);});

    '⚡ 精力 <b>'+G.actionsLeft+'</b>/'+MAX_ACTIONS_PER_XUN,

    '🎂 '+G.me.age+'岁',
    G.spouse ? ('💍 配偶:<b>'+G.spouse.name+'</b>') : '',
    G.children.length ? ('👶 孩子×'+G.children.length) : '',
    G.pet ? ('🐾 '+G.pet.name) : '',
    G.houseList.length ? ('🏠 房产×'+G.houseList.length) : ('🏠 租房'+num(G.rent)),
    G.businesses.length ? ('🏬 门店×'+G.businesses.length) : '',
    G.mysteryQuest>0 ? ('📜 恩人主线:<b>'+G.mysteryQuest+'/5</b>') : ''
  ];
  chips = chips.filter(function(x){return x;});
  var h='';
  for(var i=0;i<chips.length;i++){
    var cls='chip';
    if(chips[i].indexOf('健康')>=0 && G.me.health<40) cls='chip warn';
    if(chips[i].indexOf('心情')>=0 && G.me.mood<30) cls='chip warn';
    if(chips[i].indexOf('待业')>=0) cls='chip warn';
    if(chips[i].indexOf('恩人')>=0) cls='chip gold';

function doAct(k){

function findJob(){
  if(!G.unemployed||modalOpen)return;

  G.me.mood=cl(G.me.mood-4);
  useEnergy(1);
  var need=JOBS[G.level].need;
  if(G.me.ability>=need){
    G.unemployed=false;G.warned=0;
    addLog('📨 恭喜！面试通关斩获录用，复职为'+JOBS[G.level].name+'（月薪'+num(JOBS[G.level].salary)+'元）。','gd2');

    G.level--;G.unemployed=false;G.warned=0;
    addLog('📨 几轮技术面后，你接受了降职一级复工，就任'+JOBS[G.level].name+'（月薪'+num(JOBS[G.level].salary)+'元）。','gd2');

    G.level=0;G.unemployed=false;G.warned=0;
    addLog('📨 投出几十份简历，最终选择先从一线基础岗位重新磨砺起步。','bd');

function saveToSlot(i){
  try{
    localStorage.setItem('binjiang_save_'+i, JSON.stringify(G));

  }catch(e){toast('存档失败');}
  openSaveModal();
}
function loadSaveSlot(slot){
  var key = slot==='auto' ? 'binjiang_autosave' : ('binjiang_save_'+slot);
  var raw = localStorage.getItem(key);
  if(!raw){toast('该槽位为空');return;}
  try{
    var d = JSON.parse(raw);
    G = d;
    // 补齐字段防御
    if(!G.businesses) G.businesses=[];
    if(!G.houseList) G.houseList=[];
    if(G.actionsLeft===undefined) G.actionsLeft=MAX_ACTIONS_PER_XUN;
    closeModal();render();toast('读档成功！');
  }catch(e){toast('读档解析失败');}
}

/* 导出数据码（支持突破超长限制分批） */
var _exportChunks = [];
var _exportChunkIdx = 0;
function exportSaveCode(){
  var str = JSON.stringify(G);
  var chunkSize = 8000;
  _exportChunks = [];
  for(var i=0;i<str.length;i+=chunkSize){
    _exportChunks.push(str.substring(i, i+chunkSize));
  }
  _exportChunkIdx = 0;
  renderExportView();
}
function renderExportView(){
  var total = _exportChunks.length;
  var cur = _exportChunkIdx + 1;
  var code = _exportChunks[_exportChunkIdx];
  var html='<p class="desc">数据码总长 <b>'+JSON.stringify(G).length+'</b> 字符，共分 <b>'+total+'</b> 批复制：</p>'+
    '<p class="desc">当前批次：<b>第 '+cur+' / '+total+' 批</b></p>'+
    '<textarea id="expTxt" class="qty-input" style="height:120px;font-size:11px;font-family:monospace;text-align:left;word-break:break-all;">'+code+'</textarea>'+
    '<div style="display:flex;gap:6px;margin-top:8px;">'+
    '<button class="main-btn" onclick="copyExpCode()">📋 复制当前批次</button>'+
    (total>1&&cur<total?'<button class="main-btn" style="background:#238652;" onclick="nextExpBatch()">下一批 ➔</button>':'')+
    '</div>'+
    '<button class="main-btn" style="background:#8596a8;margin-top:10px;" onclick="openSaveModal()">返回</button>';
  openModal('📤 导出存档码', html);
}
function copyExpCode(){
  var t = document.getElementById('expTxt');
  if(!t)return;
  t.select();
  try{
    navigator.clipboard.writeText(t.value);
    toast('当前批次已复制到剪贴板！');
  }catch(e){
    document.execCommand('copy');
    toast('已复制到剪贴板！');
  }
}
function nextExpBatch(){
  if(_exportChunkIdx < _exportChunks.length-1){
    _exportChunkIdx++;
    renderExportView();
  }
}
function importSaveCodeModal(){
  var html='<p class="desc">请将之前导出的数据码粘贴至下方文本框中（分批导出的需按顺序完整拼接）：</p>'+
    '<textarea id="impTxt" class="qty-input" style="height:130px;font-size:11px;font-family:monospace;text-align:left;" placeholder="在此粘贴 JSON 存档数据..."></textarea>'+
    '<button class="main-btn" style="margin-top:10px;" onclick="doImportSave()">✅ 校验并导入存档</button>'+
    '<button class="main-btn" style="background:#8596a8;margin-top:8px;" onclick="openSaveModal()">取消</button>';
  openModal('📥 导入数据码', html);
}
function doImportSave(){
  var inp = document.getElementById('impTxt');
  if(!inp||!inp.value.trim()){toast('请粘贴数据码');return;}
  try{
    var d = JSON.parse(inp.value.trim());
    G = d;
    closeModal();render();toast('数据成功恢复！');
  }catch(e){toast('数据码格式损坏，请核对是否完整复制');}
}

/* ================= 防 F12 与源码轻量保护 ================= */
(function() {
  // 1. 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    if(typeof toast === 'function') toast('🔒 系统已开启防查看保护，右键菜单已禁用');
    return false;
  });

  // 2. 禁用 F12、Ctrl+Shift+I/J/C、Ctrl+U 查看源码、Ctrl+S
  document.addEventListener('keydown', function(e) {
    // F12
    if (e.keyCode === 123 || e.key === 'F12') {
      e.preventDefault();
      e.stopPropagation();
      if(typeof toast === 'function') toast('🔒 开发者控制台已锁定');
      return false;
    }
    // Ctrl/Cmd + Shift + I / J / C
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
      e.preventDefault();
      e.stopPropagation();
      if(typeof toast === 'function') toast('🔒 审查元素功能已锁定');
      return false;
    }
    // Ctrl/Cmd + U (查看源代码)
    if ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
      e.stopPropagation();
      if(typeof toast === 'function') toast('🔒 网页源码查看已锁定');
      return false;
    }
    // Ctrl/Cmd + S (保存网页)
    if ((e.ctrlKey || e.metaKey) && (e.keyCode === 83 || e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

  // 3. 动态控制台检测与警示
  var devtoolsOpened = false;
  var threshold = 160;
  setInterval(function() {
    if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
      if (!devtoolsOpened) {
        devtoolsOpened = true;
        try { console.clear(); } catch(err) {}
        console.log('%c⚠️ 安全警告：请关闭开发者工具以保障游戏剧情与本地存档完整性。', 'color:#c53428;font-size:16px;font-weight:bold;');
      }
    } else {
      devtoolsOpened = false;
    }
  }, 1200);
})();

      (bought ? '<button class="main-btn" disabled style="opacity:.5;background:#8596a8;padding:3px 10px;font-size:11px;">已拥有</button>' :
        '<button class="main-btn" style="padding:3px 12px;font-size:11px;background:#1e5b99;" onclick="buyHomeDecor('+i+')">购买添置</button>')+
      '</div></div>';
  }
  html += '</div><button class="main-btn" style="background:#8596a8;margin-top:10px;" onclick="closeModal()">返回温馨小家</button>';

function buyHomeDecor(idx){
  var d = HOME_DECOR_CATALOG[idx];
  if(!d) return;
  if(G.money < d.cost){ toast('存款余额不足'+d.cost+'元'); return; }
  G.money -= d.cost;
  G.homeDecors.push(d.id);
  G.me.mood = cl(G.me.mood + 15);
  addLog('🛋️ 你花费'+d.cost+'元网购了【'+d.name+'】。亲手拆箱组装摆好，暖光亮起的一瞬，出租屋瞬间充满了家的温暖！（心情+15）', 'gd2');
  toast('装扮成功：'+d.name);
  closeModal(); render(); autoSave();
}

/* ================= 治愈萌宠深度互动系统 ================= */
function openPetInteractModal(){
  if(!G.pet){ openAdopt(); return; }
  var p = G.pet;
  var html = '<div class="story-panel"><div class="story-title">🐾 '+p.kind+' · 「'+p.name+'」的治愈日常</div>'+
    '<div class="story-text" style="font-size:12px;color:#3b5673;">'+
    (p.kind==='猫'?'毛茸茸的小橘猫迈着轻巧的猫步走到你脚边，轻轻用软乎乎的小脑门蹭着你的脚踝，喉咙发出满足的呼噜声。':
     p.kind==='狗'?'小狗欢快地甩着蓬松尾巴，嘴里叼着磨牙玩具，两眼放光地扑进你怀里使劲摇尾巴！':
     '玄凤鹦鹉歪着粉扑扑的小脑袋，在你的指尖上轻巧梳理羽毛，脆生生学你说话。')+

    '</div></div>';

  html += '<div style="display:flex;flex-direction:column;gap:8px;">'+
    '<button class="story-choice" onclick="doPetCuddle()">💆 沉浸揉肚子吸毛抚摸（毛茸茸治愈解压，心情+15，精力+1）</button>'+
    '<button class="story-choice" onclick="doPetFeedCan()">🥫 投喂营养主食肉罐头（花费45元，亲密+12，饱食满腹）</button>'+
    '<button class="story-choice" onclick="doPetPlayGame()">🎾 挥舞逗猫棒/扔飞盘畅快玩耍（精力-1，宠物亲密+15）</button>'+
    '<button class="story-choice" onclick="doPetSpa()">🛁 居家宠物洗护香波SPA（花费80元，宠物香喷喷，健康+5）</button>'+
    '<button class="story-choice" onclick="closeModal()">轻抚小家伙，去忙别的</button>'+

}

function doPetCuddle(){
  closeModal();
  G.pet.love = cl(G.pet.love + 8);
  G.me.mood = cl(G.me.mood + 15);
  G.actionsLeft = Math.min(MAX_ACTIONS_PER_XUN+2, G.actionsLeft + 1);
  var lines = [
    '你将'+G.pet.name+'抱入怀中，脸颊贴着它温软顺滑的绒毛。听着它有节奏的呼噜呼噜声，所有内卷与加班的烦闷瞬间烟消云散。（精力+1，心情+15）',
    G.pet.name+'舒舒服服地四脚朝天翻出白肚皮，小爪子在你手腕上一按一按踩奶，眼神里满是对你全心全意的信任与依恋。',
    '闭上眼静静抱着毛茸茸的小家伙。生活虽然忙碌艰辛，但幸好推开门，还有一个小生命永远在毫无保留地爱着你。'
  ];
  addLog('🐾 '+pk(lines), 'gd2');
  toast('被毛茸茸的小家伙治愈了');
  render(); autoSave();
}

function doPetFeedCan(){
  closeModal();
  if(G.money < 45){ toast('零钱不足45元'); return; }
  G.money -= 45;
  G.pet.hunger = cl(G.pet.hunger + 35);
  G.pet.love = cl(G.pet.love + 12);
  addLog('🥫 你开了一罐香气扑鼻的纯肉主食罐头。'+G.pet.name+'吧唧吧唧狼吞虎咽，吃完后满意地舔干净了小胡子，用头顶使劲蹭你的掌心！', 'gd');
  toast(G.pet.name+'吃得超满足');
  render(); autoSave();
}

function doPetPlayGame(){
  closeModal();
  if(G.actionsLeft < 1){ toast('精力不足，歇会儿吧'); return; }
  G.actionsLeft--;
  G.pet.love = cl(G.pet.love + 15);
  G.me.mood = cl(G.me.mood + 10);
  addLog('🎾 你拿着玩具在客厅和'+G.pet.name+'嬉闹追逐，小家伙在羊毛毯上滑稽翻滚，逗得你哈哈大笑。（心情+10）', 'gd');
  toast(G.pet.name+'玩得不亦乐乎');
  render(); autoSave();
}

function doPetSpa(){
  closeModal();
  if(G.money < 80){ toast('零钱不足80元'); return; }
  G.money -= 80;
  G.pet.love = cl(G.pet.love + 10);
  G.me.health = cl(G.me.health + 4);
  addLog('🛁 细心给'+G.pet.name+'吹干毛发并梳顺，整只小可爱变得毛茸茸、香喷喷，抱在怀里像一团软棉花糖！', 'gd2');
  toast('洗得香喷喷软绵绵');
  render(); autoSave();
}

    '「在外面工作顺心不？受了委屈别一个人憋着，实在干得不开心咱就回家，咱家虽说不富裕，但总有一口热饭吃！」',

function openHometownParcel(){
  G.me.mood = cl(G.me.mood + 18);
  G.me.health = cl(G.me.health + 8);

  var parcelItems = [
    '整整三大包妈妈亲手包的荠菜猪肉手工水饺（还冻得硬邦邦的），一坛秘制香辣牛肉酱，还有老家院里老槐树上打下的新鲜核桃！',
    '一箱老家亲戚自家熏制的柴火腊肉和香肠，妈妈在包裹里塞了亲手纳的纯棉鞋垫，附带一张字迹歪歪扭扭的便利贴：「天冷垫鞋里暖和」。',
    '满满一纸箱老家当季甜柿子、手工红薯粉条与自家酿的花生油。厚实的泡沫箱里还夹着妈妈偷偷塞在深处的500块压箱底零钱！'

    '拆开层层保温棉：'+pk(parcelItems)+'<br><br>'+
    '<b>【尝一口妈妈的手艺】</b>下锅煮熟咬开，熟悉的味道在舌尖绽放，瞬间让你红了眼眶。（健康+8，心情+18，省下伙食费300元）'+
    '</div></div>'+
    '<div class="story-choices">'+
    '<button class="story-choice" onclick="finishHometownParcel()">把特产整齐码进冰箱，给妈妈发微信报平安</button>'+

function doHometownRemit(){
  var html = '<div class="story-panel"><div class="story-title">🧧 孝敬汇款 · 回馈父母</div>'+
    '<div class="story-text" style="font-size:12px;color:#3b5673;">'+
    '父母辛苦供你读书成材，如今年岁渐高。汇去一笔孝心款，让二老改善伙食、换套体面的过冬棉衣或定期体检。'+
    '</div></div>'+
    '<div class="story-choices">'+
    '<button class="story-choice" onclick="confirmRemit(1000)">🧧 汇款 1,000元（买保健品与添置换季衣物）</button>'+
    '<button class="story-choice" onclick="confirmRemit(3000)">🧧 汇款 3,000元（为老家翻新家电与父母体检金）</button>'+
    '<button class="story-choice" onclick="confirmRemit(10000)">🧧 汇款 10,000元（大额孝心储蓄，父母笑逐颜开）</button>'+
    '<button class="story-choice" onclick="closeModal()">囊中羞涩，改日再寄</button>'+
    '</div>';
  openModal('🧧 孝敬老家父母', html);
}

function confirmRemit(amt){
  closeModal();
  if(G.money < amt){ toast('存款不足'+amt+'元'); return; }
  G.money -= amt;
  G.hometownAff = cl((G.hometownAff||75) + Math.round(amt/300));
  if(G.parents) G.parents.health = cl(G.parents.health + 8);
  addLog('🧧 你给老家父母汇去了'+num(amt)+'元孝敬金。不久收到父亲微信：「钱收到了，你一个人在外打拼别总往家里寄，自己吃好点！」（父母亲情与健康提升）', 'gd2');
  toast('孝心汇款成功');
  render(); autoSave();
}

function doHometownVisit(){
  G.me.mood = cl(G.me.mood + 22);
  G.me.health = cl(G.me.health + 10);
  openModal('【休假探亲 · 围炉欢聚】',

    '<div class="story-text" style="font-size:13px;color:#4a323a;line-height:1.7;">'+
    '走出县城小站，远远就看见爸爸顶着寒风伸着脖子张望。进门屋里暖气扑面，桌上早已摆满了你从小最爱吃的红烧肉、清蒸鱼和热气腾腾的鸡汤。<br><br>'+
    '妈妈不停往你碗里夹菜：「瘦了，在外面肯定没好好吃。多吃点，都是自家养的！」<br><br>'+
    '吃饱喝足躺在童年的旧木床上，听着隔壁爸妈压低声音的交谈与窗外熟悉的风声，这一夜，你睡得格外香甜安稳。（心情+22，健康+10）'+
    '</div></div>'+
    '<div class="story-choices">'+
    '<button class="story-choice" onclick="finishHometownVisit()">带着父母装满后备箱的特产，元气满满返回滨江！</button>'+

}

    '坐在街角的小马扎上，旁边是同样刚下班的代驾小哥和外卖小哥，大家吸溜着热馄饨，哈着白气有一搭没一搭聊着家长里短。小小的市井摊子，照亮了无数在深夜奔波的普通人。',
    '寒风呼啸，一勺滚烫鲜美的骨汤下肚，胃里瞬间暖融融的。老李笑着递过一瓣糖蒜：「生活就像这柴火，只要火不灭，日子总会越熬越旺的！」'
